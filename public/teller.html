<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>상담사 업무 콘솔</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f2f4f6;
      --card-bg: #ffffff;
      --primary: #3182f6;
      --primary-pressed: #1b64da;
      --text: #191f28;
      --text-sub: #8b95a1;
      --border: #e5e8eb;
      --danger: #f04452;
      --success: #04b071;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px; display: flex; justify-content: center; }
    .wrap { width: 100%; max-width: 520px; }

    #gateModal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .gate-card { background: #fff; border-radius: 28px; padding: 36px 24px; width: 100%; max-width: 400px; text-align: center; }
    .gate-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 10px; }
    .gate-card p { font-size: 15px; color: var(--text-sub); margin-bottom: 24px; line-height: 1.5; }
    .gate-select { width: 100%; padding: 16px; border-radius: 14px; border: 2px solid var(--border); font-size: 17px; font-weight: 700; margin-bottom: 20px; outline: none; }
    .btn-gate-start { width: 100%; height: 60px; font-size: 18px; font-weight: 800; background: var(--primary); color: #fff; border: none; border-radius: 16px; cursor: pointer; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding: 0 4px; }
    .bank-info { display: flex; align-items: center; gap: 10px; }
    .bank-tag { font-size: 22px; font-weight: 800; }
    .desk-pill { background: #e8f3ff; color: var(--primary); font-size: 14px; font-weight: 800; padding: 6px 14px; border-radius: 20px; }
    .btn-seat-change { background: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

    .card { background: var(--card-bg); border-radius: 28px; padding: 30px 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); margin-bottom: 16px; }
    .status-badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 20px; background: #e5e8eb; color: #4e5968; margin-bottom: 8px; }
    .status-badge.active { background: #e8f3ff; color: var(--primary); }

    .center-display { text-align: center; padding: 16px 0 24px; }
    .center-display .label { font-size: 15px; color: var(--text-sub); font-weight: 600; }
    .center-display .number { font-size: 76px; font-weight: 900; color: var(--primary); margin: 6px 0; line-height: 1; letter-spacing: -1.5px; }
    .center-display .timer { font-size: 18px; font-weight: 800; color: var(--danger); margin-top: 10px; }

    .btn-stack { display: flex; flex-direction: column; gap: 12px; }
    .btn-huge { width: 100%; height: 64px; border-radius: 18px; font-size: 19px; font-weight: 800; border: none; cursor: pointer; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn-huge:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 6px 20px rgba(49, 130, 246, 0.3); }
    .btn-finish-auto { background: #191f28; color: #fff; }
    .btn-sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-sub { height: 54px; border-radius: 16px; font-size: 16px; font-weight: 700; border: 1px solid var(--border); background: #fff; color: #333d4b; cursor: pointer; }

    .duration-box { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
    .chips { display: flex; gap: 6px; }
    .chip { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
    .chip.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

    .queue-card { background: var(--card-bg); border-radius: 24px; padding: 20px 24px; }
    .queue-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 15px; font-weight: 800; }
    .queue-slider { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .queue-chip { background: #f9fafb; border: 1px solid var(--border); padding: 10px 18px; border-radius: 14px; font-size: 16px; font-weight: 800; white-space: nowrap; }
  </style>
</head>
<body>

  <div id="gateModal">
    <div class="gate-card">
      <h2>🔊 창구 업무 시작</h2>
      <p>실시간 음성 알림을 켜고<br>담당 상담 창구를 선택해주세요.</p>
      <select id="deskSelect" class="gate-select"></select>
      <button class="btn-gate-start" onclick="startWork()">음성 켜고 콘솔 시작</button>
    </div>
  </div>

  <div class="wrap">
    <div class="header">
      <div class="bank-info">
        <span class="bank-tag" id="bankTitle">은행</span>
        <span class="desk-pill" id="deskPill">-번 창구</span>
      </div>
      <button class="btn-seat-change" onclick="changeSeat()">창구 자리이동</button>
    </div>

    <div class="card">
      <div style="text-align: center;">
        <span class="status-badge" id="deskStatusBadge">상담 대기</span>
      </div>
      
      <div class="center-display">
        <div class="label">현재 상담 중인 고객</div>
        <div class="number" id="currentCustNum">-</div>
        <div class="timer" id="timerDisplay">대기 중</div>
      </div>

      <div class="btn-stack">
        <button class="btn-huge btn-primary" id="btnCallNext" onclick="callNext()">다음 고객 호출</button>
        <div class="btn-sub-row">
          <button class="btn-sub" onclick="recall()">🔔 재호출</button>
          <button class="btn-sub" onclick="transferPrompt()">창구 이동전달</button>
        </div>
        <button class="btn-huge btn-finish-auto" onclick="finishAndAutoCall()">상담 완료 및 자동 다음호출</button>
      </div>

      <div class="duration-box">
        <span style="font-size: 14px; font-weight: 700; color: var(--text-sub);">상담 기준시간</span>
        <div class="chips">
          ${[5, 10, 15, 20].map(m => `<button class="chip" id="dur-${m}" onclick="changeDuration(${m})">${m}분</button>`).join('')}
        </div>
      </div>
    </div>

    <div class="queue-card">
      <div class="queue-head">
        <span>실시간 대기열</span>
        <span id="queueCount" style="color: var(--primary);">대기 0명</span>
      </div>
      <div class="queue-slider" id="queueList"></div>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });
    const urlParams = new URLSearchParams(window.location.search);
    const bank = (urlParams.get('bank') || 'kb').toLowerCase();

    const BANK_NAMES = { woori: '우리은행', shinhan: '신한은행', kb: '국민은행', fubon: '푸본현대생명' };
    document.getElementById('bankTitle').innerText = BANK_NAMES[bank] || '은행';

    let myDesk = parseInt(localStorage.getItem(`selected_desk_${bank}`)) || parseInt(urlParams.get('desk')) || 1;
    let deskData = null;
    let audioCtx = null;
    let timerId = null;

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    function initSelect(desks) {
      const s = document.getElementById('deskSelect');
      s.innerHTML = '';
      desks.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.desk;
        opt.innerText = d.name;
        if (d.desk === myDesk) opt.selected = true;
        s.appendChild(opt);
      });
    }

    function startWork() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const sel = document.getElementById('deskSelect');
      myDesk = parseInt(sel.value);
      localStorage.setItem(`selected_desk_${bank}`, myDesk);

      document.getElementById('gateModal').style.display = 'none';
      document.getElementById('deskPill').innerText = `${myDesk}번 창구`;
      socket.emit('get_state', { bank });
    }

    function changeSeat() {
      localStorage.removeItem(`selected_desk_${bank}`);
      window.location.reload();
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    socket.on('connect', () => {
      socket.emit('get_state', { bank });
    });

    socket.on('state_update', (data) => {
      if (data.bank !== bank) return;
      initSelect(data.desks);

      deskData = data.desks.find(d => d.desk === myDesk) || data.desks[0];
      if (deskData) {
        myDesk = deskData.desk;
        document.getElementById('deskPill').innerText = deskData.name;
        renderDesk(deskData);
      }

      document.getElementById('queueCount').innerText = `대기 ${data.queue.length}명`;
      const qBox = document.getElementById('queueList');
      qBox.innerHTML = '';
      data.queue.forEach(c => {
        const item = document.createElement('div');
        item.className = 'queue-chip';
        item.innerText = `${c.ticketNumber}번`;
        qBox.appendChild(item);
      });
    });

    function renderDesk(d) {
      const isBusy = d.status === 'consulting' && d.currentCustomer;
      const numEl = document.getElementById('currentCustNum');
      const badge = document.getElementById('deskStatusBadge');

      if (isBusy) {
        numEl.innerText = `${d.currentCustomer.ticketNumber}번`;
        badge.innerText = '상담 진행 중';
        badge.className = 'status-badge active';
      } else {
        numEl.innerText = '-';
        badge.innerText = '상담 대기';
        badge.className = 'status-badge';
      }

      [5, 10, 15, 20].forEach(m => {
        const btn = document.getElementById(`dur-${m}`);
        if (btn) btn.className = `chip ${(d.duration || 10) === m ? 'selected' : ''}`;
      });
    }

    clearInterval(timerId);
    timerId = setInterval(() => {
      if (deskData && deskData.status === 'consulting' && deskData.startTime) {
        const sec = Math.floor((new Date() - new Date(deskData.startTime)) / 1000);
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        document.getElementById('timerDisplay').innerText = `상담 진행: ${m}분 ${s < 10 ? '0' : ''}${sec}초`;
      } else {
        document.getElementById('timerDisplay').innerText = '대기 중';
      }
    }, 1000);

    function callNext() {
      socket.emit('call_customer', { bank, deskNumber: myDesk });
    }

    function recall() {
      socket.emit('recall_customer', { bank, deskNumber: myDesk });
    }

    function finishAndAutoCall() {
      socket.emit('complete_consultation', { bank, deskNumber: myDesk, autoCall: true });
    }

    function transferPrompt() {
      const target = prompt('손님을 전달할 창구 번호를 입력하세요 (예: 2)');
      if (target) {
        socket.emit('transfer_customer', { bank, fromDesk: myDesk, toDesk: target });
      }
    }

    function changeDuration(duration) {
      socket.emit('update_duration', { bank, deskNumber: myDesk, duration });
    }

    socket.on('customer_called', (data) => {
      if (data.bank === bank && data.desk === myDesk) {
        speak(`${data.customer.ticketNumber}번 고객님 호출되었습니다.`);
      }
    });
  </script>
</body>
</html>
