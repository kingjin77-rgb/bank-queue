<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>상담석 대기 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; word-break: keep-all; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col p-3 md:p-6 select-none antialiased">

  <!-- 상단 내 창구 정보 헤더 -->
  <header class="bg-white rounded-2xl p-4 shadow-sm flex flex-wrap justify-between items-center gap-3 mb-4 border border-slate-200">
    <div class="flex items-center gap-2 flex-1 min-w-[220px]">
      <span class="bg-blue-600 text-white font-black px-3 py-1.5 rounded-xl text-xs md:text-sm whitespace-nowrap shadow-sm" id="current-bank-label">우리은행</span>
      <select id="teller-select" onchange="changeTeller(this.value)" class="flex-1 text-sm md:text-base font-extrabold bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 outline-none focus:border-blue-500">
      </select>
    </div>
    
    <div class="flex items-center gap-2 bg-slate-50 px-3.5 py-2 rounded-xl border border-slate-200">
      <span class="text-xs font-bold text-slate-500">대기 인원:</span>
      <span class="text-base md:text-xl font-black text-rose-500" id="bank-queue-count">0명</span>
    </div>
  </header>

  <!-- 메인 컨트롤 영역 -->
  <main class="flex-1 flex flex-col lg:grid lg:grid-cols-3 gap-4 min-h-0">
    
    <!-- 1. 좌측: 초대형 상담 조작 카드 -->
    <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm p-5 md:p-8 flex flex-col justify-between border border-slate-200">
      <div>
        <div class="flex justify-between items-center pb-3 border-b border-slate-100">
          <span class="text-xs font-bold text-slate-400 tracking-wider">진행 상태</span>
          <span id="status-badge" class="bg-slate-100 text-slate-600 text-xs font-black px-3.5 py-1.5 rounded-full">대기 중</span>
        </div>
        
        <div class="text-center my-6 md:my-8">
          <p class="text-xs font-bold text-slate-400 tracking-widest uppercase">현재 상담 고객</p>
          <div class="text-6xl sm:text-7xl md:text-8xl font-black text-slate-900 mt-2 tracking-tight" id="current-serving">-</div>
        </div>
      </div>

      <!-- 📱 [초대형 모바일 터치 버튼 그리드] -->
      <div class="grid grid-cols-2 gap-3.5 md:gap-4 mt-2">
        <!-- 1. 고객 호출 버튼 -->
        <button onclick="callCustomer()" id="btn-call" class="h-20 md:h-24 bg-blue-600 hover:bg-blue-700 active:scale-[0.97] text-white font-black rounded-2xl shadow-lg shadow-blue-500/20 transition flex flex-col items-center justify-center gap-1">
          <span class="text-2xl md:text-3xl">📢</span>
          <span class="text-base md:text-xl tracking-tight">고객 호출</span>
        </button>

        <!-- 2. 상담 시작 버튼 -->
        <button onclick="startConsult()" id="btn-start" disabled class="h-20 md:h-24 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.97] text-white font-black rounded-2xl shadow-lg shadow-emerald-500/20 transition disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none flex flex-col items-center justify-center gap-1">
          <span class="text-2xl md:text-3xl">▶</span>
          <span class="text-base md:text-xl tracking-tight">상담 시작</span>
        </button>

        <!-- 3. 부재(보류) 버튼 -->
        <button onclick="markNoShow()" id="btn-noshow" disabled class="h-20 md:h-24 bg-amber-500 hover:bg-amber-600 active:scale-[0.97] text-white font-black rounded-2xl shadow-lg shadow-amber-500/20 transition disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none flex flex-col items-center justify-center gap-1">
          <span class="text-2xl md:text-3xl">⏳</span>
          <span class="text-base md:text-xl tracking-tight">부재 (보류)</span>
        </button>

        <!-- 4. 상담 완료 버튼 -->
        <button onclick="finishConsult()" id="btn-finish" disabled class="h-20 md:h-24 bg-slate-900 hover:bg-black active:scale-[0.97] text-white font-black rounded-2xl shadow-lg shadow-slate-900/20 transition disabled:bg-slate-100 disabled:text-slate-400 disabled:shadow-none flex flex-col items-center justify-center gap-1">
          <span class="text-2xl md:text-3xl">✔</span>
          <span class="text-base md:text-xl tracking-tight">상담 완료</span>
        </button>
      </div>
    </div>

    <!-- 2. 우측: 실시간 대기열 및 보류자 목록 -->
    <div class="bg-white rounded-3xl shadow-sm p-5 flex flex-col min-h-0 border border-slate-200">
      <div class="flex-1 flex flex-col min-h-[140px] md:min-h-0">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-extrabold text-slate-700 flex items-center gap-1.5">
            📋 내 은행 대기 목록
          </h2>
          <span class="text-xs text-blue-600 font-black" id="queue-mini-count">0명 대기</span>
        </div>
        <div class="flex-1 overflow-y-auto max-h-44 lg:max-h-none space-y-2 pr-1 mb-3" id="queue-list"></div>
      </div>

      <div class="border-t border-slate-100 pt-3">
        <h2 class="text-xs font-extrabold text-amber-600 mb-2 flex items-center gap-1">
          ⏳ 부재(보류) 고객 목록
        </h2>
        <div class="max-h-32 overflow-y-auto space-y-2 pr-1" id="noshow-list"></div>
      </div>
    </div>
  </main>

  <script>
    const socket = io();
    let currentTellerId = null;
    let allTellers = [];
    let myBank = '';
    let audioCtx = null;

    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(e => {});

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function changeTeller(val) {
      currentTellerId = String(val);
      const teller = allTellers.find(t => String(t.id) === currentTellerId);
      if (teller) {
        myBank = teller.bank;
        document.getElementById('current-bank-label').innerText = teller.bank;
      }
    }

    function setStatus(text, colorClass) {
      const badge = document.getElementById('status-badge');
      badge.className = `text-xs font-black px-3.5 py-1.5 rounded-full ${colorClass}`;
      badge.innerText = text;
    }

    function callCustomer() {
      unlockAudio();
      if (!currentTellerId) return alert('창구를 선택해주세요.');
      socket.emit('call_next', { tellerId: currentTellerId });
    }

    function startConsult() {
      socket.emit('start_consult', { tellerId: currentTellerId });
      setStatus("상담 진행 중", "bg-emerald-100 text-emerald-800");
      document.getElementById('btn-call').disabled = true;
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-noshow').disabled = true;
      document.getElementById('btn-finish').disabled = false;
    }

    function markNoShow() {
      if (confirm('고객을 부재 목록으로 이동하고 다음 대기자를 호출하시겠습니까?')) {
        socket.emit('mark_no_show', { tellerId: currentTellerId });
      }
    }

    function recallNoShow(ticketNo) {
      unlockAudio();
      socket.emit('recall_no_show', { tellerId: currentTellerId, ticketNo });
    }

    function finishConsult() {
      socket.emit('finish_consult', { tellerId: currentTellerId });
    }

    socket.on('call_success', (data) => {
      document.getElementById('current-serving').innerText = `${data.ticketNo}번`;
      setStatus("📢 고객 호출 중", "bg-amber-100 text-amber-800");
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-noshow').disabled = false;
    });

    socket.on('consult_finished', () => {
      setStatus("대기 중", "bg-slate-100 text-slate-600");
      document.getElementById('current-serving').innerText = "-";
      document.getElementById('btn-call').disabled = false;
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-noshow').disabled = true;
      document.getElementById('btn-finish').disabled = true;
    });

    socket.on('state_update', (data) => {
      allTellers = data.tellers;
      const select = document.getElementById('teller-select');
      const prevVal = currentTellerId;
      select.innerHTML = '';
      data.tellers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.innerText = `${t.name} [${t.bank}]`;
        select.appendChild(opt);
      });

      if (!currentTellerId && data.tellers.length > 0) {
        currentTellerId = String(data.tellers[0].id);
        myBank = data.tellers[0].bank;
        document.getElementById('current-bank-label').innerText = myBank;
      } else if (data.tellers.some(t => String(t.id) === String(prevVal))) {
        select.value = prevVal;
      }

      const bankQueue = data.queueList.filter(q => q.bank === myBank);
      document.getElementById('bank-queue-count').innerText = `${bankQueue.length}명`;
      document.getElementById('queue-mini-count').innerText = `${bankQueue.length}명 대기`;

      const list = document.getElementById('queue-list');
      list.innerHTML = '';
      if (bankQueue.length === 0) {
        list.innerHTML = '<div class="text-xs text-slate-400 py-4 text-center">대기 중인 고객이 없습니다.</div>';
      } else {
        bankQueue.forEach((q, idx) => {
          const item = document.createElement('div');
          item.className = 'flex justify-between items-center p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs';
          item.innerHTML = `
            <span class="font-black text-slate-800 text-sm">${q.ticketNo}번</span>
            <span class="font-bold text-blue-600 text-xs">${idx === 0 ? '다음 호출' : (idx + 1) + '번째'}</span>
          `;
          list.appendChild(item);
        });
      }

      const noshowBox = document.getElementById('noshow-list');
      noshowBox.innerHTML = '';
      const bankNoShows = data.noShowList.filter(n => n.bank === myBank);
      if (bankNoShows.length === 0) {
        noshowBox.innerHTML = '<div class="text-xs text-slate-400 py-2 text-center">보류된 고객이 없습니다.</div>';
      } else {
        bankNoShows.forEach(n => {
          const row = document.createElement('div');
          row.className = 'flex justify-between items-center p-2.5 bg-amber-50 rounded-xl border border-amber-100 text-xs';
          row.innerHTML = `
            <span class="font-black text-amber-900 text-sm">${n.ticketNo}번</span>
            <button onclick="recallNoShow(${n.ticketNo})" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold rounded-lg text-xs">재호출</button>
          `;
          noshowBox.appendChild(row);
        });
      }
    });

    socket.on('error_msg', msg => alert(msg));
  </script>
</body>
</html>
