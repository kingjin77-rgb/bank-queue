<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담사 호출기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center">
  <div class="w-full max-w-md bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
    <div class="flex justify-between items-center mb-6 pb-4 border-b border-gray-100">
      <select id="bankSelect" onchange="changeBank()" class="font-bold text-xl text-blue-600 bg-transparent outline-none">
        <option value="우리은행">우리은행</option>
        <option value="신한은행">신한은행</option>
        <option value="국민은행">국민은행</option>
        <option value="푸본현대생명">푸본현대생명</option>
      </select>
      <div id="waitCount" class="text-sm font-semibold text-gray-500">대기: 0명</div>
    </div>

    <div class="bg-blue-50 rounded-2xl p-6 text-center mb-6">
      <div class="text-xs font-bold text-gray-500 mb-1">현재 응대 번호</div>
      <div id="servingNo" class="text-6xl font-black text-blue-600 my-2">-</div>
    </div>

    <button onclick="callNext()" class="w-full py-6 bg-blue-600 active:bg-blue-700 text-white font-black text-2xl rounded-2xl shadow-lg mb-6">
      다음 고객 호출
    </button>

    <div>
      <div class="text-xs font-bold text-gray-400 mb-2">대기 목록</div>
      <div id="waitingList" class="flex flex-wrap gap-2 text-sm text-gray-600 min-h-[30px]">
        대기 고객 없음
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentBank = document.getElementById('bankSelect').value;

    function changeBank() {
      currentBank = document.getElementById('bankSelect').value;
      socket.emit('get_all_state');
    }

    function callNext() {
      socket.emit('call_next', { bank: currentBank }, (res) => {
        if (!res.success) alert(res.message);
      });
    }

    socket.on('init_state', (queues) => {
      updateUI(queues[currentBank]);
    });

    socket.on('queue_update', ({ bank, data }) => {
      if (bank === currentBank) updateUI(data);
    });

    function updateUI(data) {
      if (!data) return;
      document.getElementById('servingNo').innerText = data.current > 0 ? `${data.current}번` : '-';
      document.getElementById('waitCount').innerText = `대기: ${data.waiting.length}명`;
      
      const listEl = document.getElementById('waitingList');
      if (data.waiting.length > 0) {
        listEl.innerHTML = data.waiting.map(n => `<span class="px-3 py-1 bg-gray-100 rounded-lg font-bold">${n}번</span>`).join('');
      } else {
        listEl.innerHTML = '대기 고객 없음';
      }
    }
  </script>
</body>
</html>
