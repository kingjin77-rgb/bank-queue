<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>창구 콘솔</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
    .box { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 15px; }
    button { padding: 15px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin-right: 10px; }
    .btn-issue { background: #38bdf8; color: #000; }
    .btn-call { background: #22c55e; color: #000; }
  </style>
</head>
<body>
  <h1 id="title">창구</h1>
  <div class="box">
    <h3>대기 인원: <span id="waitingCount">0</span>명</h3>
    <button class="btn-issue" onclick="issueTicket()">번호표 발권</button>
    <button class="btn-call" onclick="callNext()">다음 고객 호출</button>
  </div>
  <div class="box">
    <h3>현재 호출</h3>
    <p id="currentCalled" style="font-size: 20px; color: #22c55e; font-weight: bold;">대기 중...</p>
  </div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const bank = urlParams.get('bank') || 'kb';
    const deskNumber = urlParams.get('desk') || '1';

    const names = { kb: '국민은행', woori: '우리은행', shinhan: '신한은행', fubon: '푸본현대' };
    document.getElementById('title').innerText = `${names[bank] || '은행'} ${deskNumber}번 창구`;

    function issueTicket() {
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res && res.success) console.log('발권 성공:', res.ticket.ticketNumber);
      });
    }

    function callNext() {
      socket.emit('call_customer', { bank, deskNumber });
    }

    socket.on('sync_state', (banks) => {
      if (banks[bank]) {
        document.getElementById('waitingCount').innerText = banks[bank].waiting.length;
      }
    });

    socket.on('customer_called', (data) => {
      if (data.bankKey !== bank) return;
      document.getElementById('currentCalled').innerText = `${data.customer.ticketNumber}번 고객님 -> ${data.deskName}`;
    });
  </script>
</body>
</html>
