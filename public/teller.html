<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담사 창구 및 발권 콘솔</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
    .box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
    button { background: #38bdf8; color: #000; font-weight: bold; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin: 5px; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <h1 id="bankTitle">창구 시스템</h1>
  <div class="box">
    <h3>대기 인원: <span id="waitingCount">0</span>명</h3>
    <button onclick="issueTicket()">번호표 발권</button>
    <button onclick="callNext()">다음 고객 호출</button>
  </div>
  <div class="box">
    <h3>현재 호출된 고객</h3>
    <p id="currentCalled" style="font-size: 20px; color: #22c55e; font-weight: bold;">없음</p>
  </div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const bank = urlParams.get('bank') || 'kb';
    const deskNumber = 1; // 기본 1번 창구

    document.getElementById('bankTitle').innerText = `${bank.toUpperCase()} 창구 관리 시스템`;

    function issueTicket() {
      socket.emit('issue_ticket', { bank, name: '일반고객' }, (res) => {
        if (res && res.success) {
          alert(`발권 완료: ${res.ticket.ticketNumber}번`);
        }
      });
    }

    function callNext() {
      socket.emit('call_customer', { bank, deskNumber });
    }

    socket.on('sync_state', (banks) => {
      if (banks[bank]) {
        document.getElementById('waitingCount').innerText = banks[bank].waiting.length;
      }
    });

    // 🔊 "한번"이 아니라 무조건 "일번"으로 읽어주는 완벽한 변환 함수
    function convertNumberToKorean(numStr) {
      let n = parseInt(numStr);
      if (isNaN(n)) return numStr;
      if (n === 0) return '영';

      const units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (n < 10) return units[n];
      if (n < 20) return '십' + (n % 10 > 0 ? units[n % 10] : '');
      
      let ten = Math.floor(n / 10);
      let one = n % 10;
      return (ten > 1 ? units[ten] : '') + '십' + (one > 0 ? units[one] : '');
    }

    socket.on('customer_called', (data) => {
      if (data.bankKey !== bank) return;
      document.getElementById('currentCalled').innerText = `${data.customer.ticketNumber}번 고객님 -> ${data.deskName}`;
      
      // 음성 출력 (일번, 이번 발음 보장)
      const ticketText = convertNumberToKorean(data.customer.ticketNumber);
      const deskText = convertNumberToKorean(deskNumber);
      const msg = `${data.bankName}, ${ticketText}번 고객님, ${deskText}번 창구로 오십시요.`;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(msg);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.95;
        window.speechSynthesis.speak(utter);
      }
    });
  </script>
</body>
</html>
