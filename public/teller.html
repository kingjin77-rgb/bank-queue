<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" id="themeColorMeta" content="#3182f6">
  <title>상담사 창구 콘솔</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --font-stack: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --brand: #3182f6;
      --brand-sub: #e8f3ff;
      --brand-text: #ffffff;
      --bg: #f2f4f6;
      --card: #ffffff;
      --text: #191f28;
      --text-sub: #8b95a1;
      --border: #e5e8eb;
      --danger: #f04452;
      --success: #04b071;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); font-weight: 700; letter-spacing: -0.4px; min-height: 100vh; display: flex; flex-direction: column; }

    /* ===== 헤더 ===== */
    .top-bar {
      background: var(--brand); color: var(--brand-text);
      padding: calc(env(safe-area-inset-top) + 16px) 16px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .top-left { min-width: 0; }
    .top-bank { font-size: 24px; font-weight: 900; letter-spacing: -0.6px; }
    .top-desk { font-size: 16px; font-weight: 800; opacity: 0.9; margin-top: 2px; }
    .btn-move {
      background: rgba(0,0,0,0.2); color: inherit; border: 2px solid rgba(255,255,255,0.45);
      border-radius: 14px; padding: 12px 16px; font-size: 15px; font-weight: 900; cursor: pointer; white-space: nowrap;
    }

    main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 16px 14px 30px; }

    /* ===== 대형 전광판 (현재 상담 고객) ===== */
    .board {
      background: #0b101b; color: #fff; border-radius: 28px;
      padding: 26px 18px 22px; text-align: center; border-top: 10px solid var(--brand);
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    }
    .board-label { font-size: 17px; font-weight: 800; color: #94a3b8; }
    .board-num { font-size: 132px; font-weight: 900; line-height: 0.95; letter-spacing: -6px; margin: 8px 0 6px; color: var(--brand); }
    .board-num.idle { font-size: 62px; color: #475569; letter-spacing: -2px; }
    .board-timer { font-size: 22px; font-weight: 900; font-family: monospace; color: #94a3b8; }
    .board-timer.over { color: #ff6b6b; }

    /* ===== 지표 3칸 ===== */
    .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
    .metric { background: var(--card); border-radius: 20px; padding: 16px 6px; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    .metric .m-label { font-size: 13px; font-weight: 800; color: var(--text-sub); }
    .metric .m-value { font-size: 28px; font-weight: 900; margin-top: 4px; }

    /* ===== 큰 버튼 ===== */
    .btn { border: none; border-radius: 22px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
    .btn:active { transform: scale(0.98); }
    .btn-call { width: 100%; min-height: 108px; font-size: 32px; background: var(--brand); color: var(--brand-text); margin-top: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .btn-mid { min-height: 84px; font-size: 21px; }
    .btn-done { background: #191f28; color: #fff; }
    .btn-recall { background: #ffb020; color: #1a1a1a; }
    .btn-pass { background: #fff; color: var(--danger); border: 3px solid var(--danger); }
    .btn-issue { background: #fff; color: var(--text); border: 3px solid var(--border); }

    /* ===== 대기열 ===== */
    .queue-card { background: var(--card); border-radius: 24px; padding: 20px 18px; margin-top: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.05); }
    .queue-head { display: flex; justify-content: space-between; align-items: center; font-size: 17px; font-weight: 900; }
    .queue-list { display: flex; gap: 10px; overflow-x: auto; padding: 14px 0 4px; }
    .q-chip { background: var(--brand-sub); color: var(--brand); border-radius: 16px; padding: 14px 20px; font-size: 22px; font-weight: 900; white-space: nowrap; }
    .q-chip.first { background: var(--brand); color: var(--brand-text); }
    .q-empty { color: var(--text-sub); font-weight: 800; padding: 14px 0 4px; }

    /* ===== 창구 선택 / 이동 모달 ===== */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.82); z-index: 950; display: none; align-items: center; justify-content: center; padding: 18px; }
    .modal.show { display: flex; }
    .sheet { background: #fff; border-radius: 30px; padding: 28px 22px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; }
    .sheet h2 { font-size: 25px; font-weight: 900; text-align: center; }
    .sheet p { font-size: 15px; color: var(--text-sub); font-weight: 700; text-align: center; margin-top: 8px; line-height: 1.5; }
    .desk-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0 16px; }
    .desk-opt {
      min-height: 88px; border-radius: 20px; border: 3px solid var(--border); background: #fff;
      font-size: 21px; font-weight: 900; color: var(--text); cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .desk-opt .d-sub { font-size: 13px; font-weight: 800; color: var(--text-sub); }
    .desk-opt.busy { border-color: #ffb020; }
    .desk-opt.mine { border-color: var(--brand); background: var(--brand-sub); color: var(--brand); }
    .sheet .btn-cancel { width: 100%; min-height: 62px; border-radius: 18px; border: 2px solid var(--border); background: #fff; font-size: 17px; font-weight: 900; color: var(--text-sub); cursor: pointer; }

    /* ===== 접수 알림 토스트 ===== */
    #arrivalToast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(env(safe-area-inset-bottom) + 20px); z-index: 800;
      background: #191f28; color: #fff; border-radius: 20px; padding: 16px 24px;
      font-size: 18px; font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      display: none; max-width: 92vw; text-align: center;
    }

    .audio-warn {
      background: #fff3cd; color: #7a5b00; border: 2px solid #ffe08a; border-radius: 18px;
      padding: 16px; font-size: 15px; font-weight: 800; text-align: center; margin-top: 14px; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="top-left">
      <div class="top-bank" id="bankTitle">은행</div>
      <div class="top-desk" id="deskPill">창구 선택 필요</div>
    </div>
    <button class="btn-move" onclick="openDeskSheet('move')">창구 이동</button>
  </div>

  <main>
    <!-- 대형 현재 고객 전광판 -->
    <div class="board">
      <div class="board-label">현재 상담 고객</div>
      <div class="board-num idle" id="currentCustNum">대기</div>
      <div class="board-timer" id="consultTimer">호출 대기 중</div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="m-label">대기 인원</div><div class="m-value" id="waitCount" style="color:var(--danger);">0명</div></div>
      <div class="metric"><div class="m-label">내 창구 완료</div><div class="m-value" id="myDoneCount" style="color:var(--success);">0건</div></div>
      <div class="metric"><div class="m-label">예상 대기</div><div class="m-value" id="estWait">-</div></div>
    </div>

    <button class="btn btn-call" onclick="callNext()">다음 고객 호출</button>

    <div class="btn-row">
      <button class="btn btn-mid btn-recall" onclick="recall()">🔔 재호출</button>
      <button class="btn btn-mid btn-done" onclick="finishAndAutoCall()">상담 완료<br>+ 다음 호출</button>
    </div>

    <div class="btn-row">
      <button class="btn btn-mid btn-pass" onclick="passCustomer()">부재 패스</button>
      <button class="btn btn-mid btn-issue" onclick="issueTicketHere()">🎫 대리 발권</button>
    </div>

    <div class="audio-warn" id="audioWarn" onclick="unlockAudio(true)">
      🔊 음성 안내가 꺼져 있습니다. 여기를 눌러 켜주세요.
    </div>

    <div class="queue-card">
      <div class="queue-head">
        <span>실시간 대기열</span>
        <span id="queueCount" style="color: var(--brand);">대기 0명</span>
      </div>
      <div class="queue-list" id="queueList"></div>
      <div id="issueLog" style="font-size: 14px; color: var(--text-sub); font-weight: 700; text-align: center; margin-top: 6px;"></div>
    </div>
  </main>

  <!-- 창구 선택 / 이동 -->
  <div class="modal" id="bankErrorModal">
    <div class="sheet">
      <h2 style="color:#f04452;">잘못된 창구 주소</h2>
      <p id="bankErrorMsg">이 주소의 기관이 시스템에 등록되어 있지 않습니다.<br>관리자에게 문의하거나 아래에서 기관을 선택하세요.</p>
      <div class="desk-options" id="bankOptions"></div>
    </div>
  </div>

  <div class="modal" id="deskModal">
    <div class="sheet">
      <h2 id="sheetTitle">창구를 선택하세요</h2>
      <p id="sheetDesc">선택한 창구는 새로고침을 해도 그대로 유지됩니다.</p>
      <div class="desk-options" id="deskOptions"></div>
      <button class="btn-cancel" id="sheetCancel" onclick="closeDeskSheet()">취소</button>
    </div>
  </div>

  <div id="arrivalToast"></div>

  <audio id="keepAliveAudio" src="/silent.wav" loop preload="auto" playsinline></audio>
  <audio id="alarmAudio" src="/chime.wav" preload="auto" playsinline></audio>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    // 기존에 배포된 QR/링크가 ?b= 와 ?bank= 를 섞어 쓰므로 둘 다 받는다.
    function urlBank(fallback) {
      const v = urlParams.get('bank') || urlParams.get('b');
      return (v || fallback || '').toLowerCase().trim();
    }
    const bank = urlBank('kb');

    const LOCAL_BANK_THEMES = {
      kb:      { name: '국민은행',       color: '#ffbc00', sub: '#fff9e6', btnText: '#2b2b2b' },
      shinhan: { name: '신한은행',       color: '#0046ff', sub: '#e8f0fe', btnText: '#ffffff' },
      woori:   { name: '우리은행',       color: '#0067ac', sub: '#e6f3fa', btnText: '#ffffff' },
      fubon:   { name: '푸본현대생명',   color: '#00A88F', sub: '#e6f7f4', btnText: '#ffffff' },
      hana:    { name: '하나은행',       color: '#008485', sub: '#e6f4f4', btnText: '#ffffff' },
      jl:      { name: '법무법인 제이엘', color: '#8b0029', sub: '#fbe9ee', btnText: '#ffffff' }
    };

    function applyTheme(info) {
      if (!info) return;
      const root = document.documentElement.style;
      root.setProperty('--brand', info.color);
      root.setProperty('--brand-sub', info.sub || '#f2f4f6');
      root.setProperty('--brand-text', info.btnText || '#ffffff');
      document.getElementById('bankTitle').innerText = info.name;
      document.getElementById('themeColorMeta').setAttribute('content', info.color);
      bankName = info.name;
      document.title = info.name + ' 창구 콘솔';
    }

    let bankName = (LOCAL_BANK_THEMES[bank] || {}).name || '은행';
    applyTheme(LOCAL_BANK_THEMES[bank] || LOCAL_BANK_THEMES.kb);

    const socket = io({ transports: ['websocket', 'polling'] });

    // 창구는 한 번 고르면 새로고침해도 유지된다.
    const DESK_KEY = 'fixed_desk_' + bank;
    let myDesk = parseInt(localStorage.getItem(DESK_KEY) || urlParams.get('desk') || '', 10);
    if (isNaN(myDesk)) myDesk = null;

    let allDesks = [];
    let standardMinutes = 15;
    let serverOffsetMs = 0;
    let currentCalledAt = null;
    let audioReady = false;
    let sheetMode = 'select';
    let knownTicketIds = null;   // 접수 알림용 (첫 동기화는 알리지 않음)

    /* ================= 음성 ================= */

    const keepAliveAudio = document.getElementById('keepAliveAudio');
    const alarmAudio = document.getElementById('alarmAudio');

    function numToKorean(n) {
      const num = parseInt(n, 10);
      if (isNaN(num)) return String(n);
      if (num === 0) return '영';
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const units = ['', '십', '백', '천'];
      let out = '', rest = num;
      for (let i = 3; i >= 0; i--) {
        const div = Math.pow(10, i);
        const d = Math.floor(rest / div);
        rest %= div;
        if (d === 0) continue;
        out += (d === 1 && i > 0 ? '' : digits[d]) + units[i];
      }
      return out;
    }
    function deskToKorean(deskName) {
      const m = String(deskName || '').match(/\d+/);
      return m ? numToKorean(m[0]) + '번 창구' : String(deskName || '창구');
    }

    const speechQueue = [];
    let speaking = false, speechGuard = null;

    function enqueueSpeech(text) {
      speechQueue.push(text);
      processSpeechQueue();
    }
    function processSpeechQueue() {
      if (speaking || speechQueue.length === 0) return;
      if (!('speechSynthesis' in window)) { speechQueue.length = 0; return; }
      speaking = true;
      const text = speechQueue.shift();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.92;
      utter.volume = 1.0;
      const done = function () {
        if (!speaking) return;
        speaking = false;
        clearTimeout(speechGuard);
        setTimeout(processSpeechQueue, 250);
      };
      utter.onend = done;
      utter.onerror = done;
      speechGuard = setTimeout(done, 15000);
      try { window.speechSynthesis.resume(); } catch (e) {}
      window.speechSynthesis.speak(utter);
    }

    // 어떤 조작을 하든 오디오 잠금이 풀리도록 (음성 호출은 절대 빠지면 안 됨)
    function unlockAudio(announce) {
      audioReady = true;
      keepAliveAudio.volume = 0.01;
      keepAliveAudio.play().catch(function () {});
      alarmAudio.volume = 1.0;
      if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {});
      document.getElementById('audioWarn').style.display = 'none';
      if (announce) enqueueSpeech('음성 안내가 켜졌습니다.');
    }
    ['click', 'touchstart'].forEach(function (ev) {
      window.addEventListener(ev, function () { unlockAudio(false); }, { once: true });
    });
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden && audioReady) keepAliveAudio.play().catch(function () {});
    });

    function playChime() {
      try {
        alarmAudio.currentTime = 0;
        alarmAudio.play().catch(function () {});
      } catch (e) {}
    }

    /* ================= 시간 ================= */

    function elapsedSec(iso) {
      if (!iso) return 0;
      return Math.max(0, Math.round((Date.now() + serverOffsetMs - new Date(iso).getTime()) / 1000));
    }
    function fmtMs(sec) {
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }
    function updateTimer() {
      const el = document.getElementById('consultTimer');
      if (!currentCalledAt) {
        el.innerText = '호출 대기 중';
        el.className = 'board-timer';
        return;
      }
      const sec = elapsedSec(currentCalledAt);
      const over = sec > standardMinutes * 60;
      el.innerText = over ? '상담 ' + fmtMs(sec) + ' · 표준 ' + standardMinutes + '분 초과' : '상담 경과 ' + fmtMs(sec);
      el.className = over ? 'board-timer over' : 'board-timer';
    }
    setInterval(updateTimer, 1000);

    /* ================= 창구 선택 / 이동 ================= */

    function openDeskSheet(mode) {
      sheetMode = mode || 'select';
      const isMove = sheetMode === 'move';
      document.getElementById('sheetTitle').innerText = isMove ? '창구 이동' : '창구를 선택하세요';
      document.getElementById('sheetDesc').innerText = isMove
        ? '이동할 창구를 누르면 즉시 옮겨집니다. 선택한 창구는 새로고침해도 유지됩니다.'
        : '선택한 창구는 새로고침을 해도 그대로 유지됩니다.';
      document.getElementById('sheetCancel').style.display = (isMove && myDesk) ? 'block' : 'none';
      renderDeskOptions();
      document.getElementById('deskModal').classList.add('show');
    }
    function closeDeskSheet() {
      document.getElementById('deskModal').classList.remove('show');
    }

    function renderDeskOptions() {
      const box = document.getElementById('deskOptions');
      box.innerHTML = '';
      if (allDesks.length === 0) {
        box.innerHTML = '<div style="grid-column: 1/-1; text-align:center; color:#8b95a1; font-weight:800;">창구 정보를 불러오는 중입니다.</div>';
        return;
      }
      allDesks.forEach(function (d) {
        const busy = d.status === 'consulting' && d.currentCustomer;
        const btn = document.createElement('button');
        btn.className = 'desk-opt' + (d.desk === myDesk ? ' mine' : (busy ? ' busy' : ''));
        btn.innerHTML = '<span>' + d.name + '</span><span class="d-sub">' +
          (d.desk === myDesk ? '현재 내 창구' : (busy ? d.currentCustomer.ticketNumber + '번 상담 중' : '비어 있음')) + '</span>';
        btn.onclick = function () { chooseDesk(d.desk); };
        box.appendChild(btn);
      });
    }

    function chooseDesk(deskNo) {
      unlockAudio(false);
      myDesk = deskNo;
      localStorage.setItem(DESK_KEY, String(deskNo));
      closeDeskSheet();
      syncDeskUi();
      socket.emit('get_state', { bank: bank });
    }

    function syncDeskUi() {
      const d = allDesks.find(function (x) { return x.desk === myDesk; });
      document.getElementById('deskPill').innerText = d ? d.name : (myDesk ? myDesk + '번 창구' : '창구 선택 필요');
    }

    /* ================= 서버 상태 ================= */

    socket.on('connect', function () {
      socket.emit('get_state', { bank: bank });
      socket.emit('get_all_state');
    });

    // 서버에 등록되지 않은 은행 코드로 접속하면 다른 은행 고객을 호출하게 될 수 있으므로
    // 아예 조작을 막고 올바른 기관을 고르게 한다.
    let bankValid = true;
    socket.on('all_state_update', function (data) {
      if (!data.bankInfo) return;
      bankValid = Object.prototype.hasOwnProperty.call(data.bankInfo, bank);
      if (bankValid) {
        document.getElementById('bankErrorModal').classList.remove('show');
        return;
      }
      const box = document.getElementById('bankOptions');
      box.innerHTML = '';
      Object.keys(data.bankInfo).forEach(function (b) {
        const btn = document.createElement('button');
        btn.className = 'desk-opt';
        btn.innerHTML = '<span>' + data.bankInfo[b].name + '</span><span class="d-sub">이 기관으로 이동</span>';
        btn.onclick = function () { window.location.href = '/teller.html?bank=' + b; };
        box.appendChild(btn);
      });
      document.getElementById('deskModal').classList.remove('show');
      document.getElementById('bankErrorModal').classList.add('show');
    });

    socket.on('state_update', function (data) {
      if (data.bank !== bank) return;
      if (data.bankInfo) applyTheme(data.bankInfo);
      if (data.serverTime) serverOffsetMs = new Date(data.serverTime).getTime() - Date.now();
      if (data.settings) standardMinutes = data.settings.standardMinutes;

      allDesks = data.desks || [];

      // 관리자가 창구를 없앴는데 그게 내 창구였다면 즉시 다시 고르게 한다.
      if (myDesk && !allDesks.some(function (d) { return d.desk === myDesk; })) {
        myDesk = null;
        localStorage.removeItem(DESK_KEY);
        openDeskSheet('select');
      }
      if (!myDesk && bankValid) {
        openDeskSheet('select');
      } else if (document.getElementById('deskModal').classList.contains('show')) {
        renderDeskOptions();   // 열려 있으면 목록만 갱신 (관리자 +/- 즉시 반영)
      }
      syncDeskUi();

      const waiting = (data.queue || []).filter(function (c) { return c.status === 'waiting'; });
      const logs = data.logs || [];

      document.getElementById('waitCount').innerText = waiting.length + '명';
      document.getElementById('queueCount').innerText = '대기 ' + waiting.length + '명';
      document.getElementById('myDoneCount').innerText =
        logs.filter(function (l) { return l.desk === myDesk; }).length + '건';
      const deskCount = allDesks.length || 1;
      document.getElementById('estWait').innerText = waiting.length > 0
        ? Math.ceil(waiting.length / deskCount) * standardMinutes + '분' : '없음';

      // 대기열 목록
      const qBox = document.getElementById('queueList');
      qBox.innerHTML = '';
      if (waiting.length === 0) {
        qBox.innerHTML = '<div class="q-empty">대기 중인 고객이 없습니다.</div>';
      } else {
        waiting.forEach(function (c, i) {
          const chip = document.createElement('div');
          chip.className = 'q-chip' + (i === 0 ? ' first' : '');
          chip.innerText = c.ticketNumber + '번';
          qBox.appendChild(chip);
        });
      }

      // 내 창구 상태
      const mine = allDesks.find(function (d) { return d.desk === myDesk; });
      if (mine) renderDesk(mine);
    });

    function renderDesk(d) {
      const busy = d.status === 'consulting' && d.currentCustomer;
      const numEl = document.getElementById('currentCustNum');
      if (busy) {
        numEl.innerText = d.currentCustomer.ticketNumber;
        numEl.className = 'board-num';
        currentCalledAt = d.currentCustomer.calledAt;
      } else {
        numEl.innerText = '대기';
        numEl.className = 'board-num idle';
        currentCalledAt = null;
      }
      updateTimer();
    }

    // 새 고객 접수 알림 - 내 은행만
    socket.on('ticket_issued', function (data) {
      if (data.bank !== bank) return;
      showArrival(data.ticket.ticketNumber, data.waitingCount);
      playChime();
      setTimeout(function () {
        enqueueSpeech('새 고객이 접수되었습니다. 대기 ' + numToKorean(data.waitingCount) + '명입니다.');
      }, 700);
    });

    function showArrival(ticketNumber, waitingCount) {
      const t = document.getElementById('arrivalToast');
      t.innerText = '🎫 ' + ticketNumber + '번 고객 접수 · 대기 ' + waitingCount + '명';
      t.style.display = 'block';
      clearTimeout(showArrival._t);
      showArrival._t = setTimeout(function () { t.style.display = 'none'; }, 4000);
    }

    // 관리자가 창구를 늘리거나 줄이면 즉시 반응
    socket.on('desks_changed', function (data) {
      if (data.bank !== bank) return;
      if (data.action === 'remove' && data.removedDesk === myDesk) {
        myDesk = null;
        localStorage.removeItem(DESK_KEY);
        enqueueSpeech('이 창구가 관리자에 의해 닫혔습니다. 창구를 다시 선택해 주세요.');
        openDeskSheet('select');
      }
      socket.emit('get_state', { bank: bank });
    });

    // 내 창구로 호출된 고객 음성 안내
    socket.on('customer_called', function (data) {
      if (data.bank !== bank || data.desk !== myDesk) return;
      playChime();
      const msg = data.bankName + ', ' + numToKorean(data.customer.ticketNumber) + '번 고객님, ' + deskToKorean(data.deskName) + '로 오십시오.';
      setTimeout(function () { enqueueSpeech(msg); }, 700);
    });

    /* ================= 조작 ================= */

    function requireDesk() {
      if (!bankValid) {
        document.getElementById('bankErrorModal').classList.add('show');
        return false;
      }
      if (!myDesk) { openDeskSheet('select'); return false; }
      return true;
    }

    function callNext() {
      if (!requireDesk()) return;
      unlockAudio(false);
      socket.emit('call_customer', { bank: bank, deskNumber: myDesk });
    }

    function recall() {
      if (!requireDesk()) return;
      unlockAudio(false);
      socket.emit('recall_customer', { bank: bank, deskNumber: myDesk });
    }

    function finishAndAutoCall() {
      if (!requireDesk()) return;
      unlockAudio(false);
      socket.emit('complete_consultation', { bank: bank, deskNumber: myDesk, autoCall: true });
    }

    function passCustomer() {
      if (!requireDesk()) return;
      if (!currentCalledAt) { alert('현재 상담 중인 고객이 없습니다.'); return; }
      if (confirm('이 고객을 부재 처리하고 다음 고객을 받으시겠습니까?')) {
        socket.emit('pass_customer', { bank: bank, deskNumber: myDesk });
      }
    }

    function issueTicketHere() {
      if (!bankValid) { document.getElementById('bankErrorModal').classList.add('show'); return; }
      unlockAudio(false);
      socket.emit('issue_ticket', { bank: bank, name: '창구발권' }, function (res) {
        if (res && res.success) {
          document.getElementById('issueLog').innerText =
            '[발권 완료] ' + res.ticket.ticketNumber + '번 · ' + new Date().toLocaleTimeString('ko-KR');
        } else {
          alert('발권 실패: ' + (res && res.message ? res.message : '알 수 없는 오류'));
        }
      });
    }

    socket.on('emergency_repaired', function () {
      localStorage.removeItem(DESK_KEY);
      window.location.reload();
    });
  </script>
  <script src="/pwa.js" data-role="teller"></script>
</body>
</html>
