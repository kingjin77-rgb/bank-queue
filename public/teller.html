<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>상담사 호출 단말기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #0f172a; -webkit-font-smoothing: antialiased; }
    .app-card { background: #ffffff; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col justify-center items-center" onclick="initAudioAndWakeLock()">
  <div class="w-full max-w-xl app-card p-6 md:p-8 border border-slate-200">
    
    <div id="newWaitingBanner" class="hidden mb-5 p-4 bg-rose-600 text-white rounded-2xl text-center shadow-lg border-2 border-rose-300">
      <div class="text-xs font-bold opacity-90">NEW CUSTOMER</div>
      <div id="bannerText" class="text-xl font-black mt-1">🔔 대기 고객 접수됨!</div>
    </div>

    <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-200">
      <div class="flex gap-2 items-center">
        <span id="bankFixedBadge" class="hidden text-xl font-black px-4 py-2 bg-blue-50 text-blue-600 rounded-2xl"></span>
        <select id="bankSelect" onchange="onBankChanged()" class="font-black text-2xl text-blue-600 bg-transparent outline-none cursor-pointer"></select>
        <select id="deskSelect" onchange="onDeskChanged()" class="font-bold text-base text-slate-700 bg-slate-100 px-3 py-2 rounded-xl outline-none cursor-pointer"></select>
      </div>
      <div id="waitCountBadge" class="text-base font-black text-rose-600 bg-rose-50 px-3.5 py-1.5 rounded-full border border-rose-200">
        대기: 0명
      </div>
    </div>

    <div class="bg-blue-50/70 border-2 border-blue-200 rounded-3xl p-6 text-center mb-6">
      <div class="flex justify-center items-center gap-2 mb-2">
        <span id="deskTitle" class="text-sm font-bold text-slate-500">1번 창구</span>
        <span id="statusBadge" class="text-sm font-black px-3 py-0.5 rounded-full bg-slate-200 text-slate-700">대기중</span>
      </div>
      <div id="servingNo" class="text-7xl md:text-8xl font-black text-blue-600 my-2 tracking-tight">-</div>
      <p id="servingGuide" class="text-sm font-semibold text-slate-500 mt-2">고객을 호출하면 즉시 [상담중]으로 자동 전환됩니다.</p>
    </div>

    <div class="space-y-3 mb-6">
      <div class="flex gap-3">
        <button id="callBtn" onclick="callNext()" class="flex-[2] py-5 bg-blue-600 active:bg-blue-700 text-white font-black text-xl rounded-2xl shadow-lg transition disabled:bg-slate-200 disabled:text-slate-400">
          다음 고객 호출
        </button>
        <button id="recallBtn" onclick="reCall()" class="flex-1 py-5 bg-amber-500 active:bg-amber-600 text-white font-black text-lg rounded-2xl shadow-lg transition disabled:bg-slate-200 disabled:text-slate-400">
          📢 재호출
        </button>
      </div>

      <div class="grid grid-cols-3 gap-2.5">
        <button id="finishBtn" onclick="finishServing()" class="py-4 bg-slate-900 active:bg-black text-white font-bold rounded-2xl text-base shadow-sm disabled:opacity-40">
          상담종료
        </button>
        <button id="absentBtn" onclick="passAbsent()" class="py-4 bg-rose-50 active:bg-rose-100 text-rose-600 font-bold rounded-2xl text-base border border-rose-200 disabled:opacity-40">
          부재(패스)
        </button>
        <button id="transferBtn" onclick="openTransferModal()" class="py-4 bg-purple-50 active:bg-purple-100 text-purple-700 font-bold rounded-2xl text-base border border-purple-200 disabled:opacity-40">
          창구이동 ➔
        </button>
      </div>
    </div>

    <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-slate-500">📋 실시간 대기 고객</span>
        <span id="waitingCountText" class="text-xs font-bold text-blue-600">0명</span>
      </div>
      <div id="waitingList" class="flex flex-wrap gap-2 min-h-[38px] items-center">
        <span class="text-xs text-slate-400">대기 중인 고객이 없습니다.</span>
      </div>
    </div>

  </div>

  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    
    const bankKeyMap = { 'woori': '우리은행', 'shinhan': '신한은행', 'kb': '국민은행', 'fubon': '푸본현대생명' };
    const rawParam = urlParams.get('b') || urlParams.get('bank');
    const lockedBank = bankKeyMap[rawParam] || rawParam;
    const lockedDesk = urlParams.get('desk') || urlParams.get('d');

    let currentBank = lockedBank || localStorage.getItem('saved_teller_bank') || '';
    let currentDeskId = Number(lockedDesk || localStorage.getItem('saved_teller_desk') || 1);
    let globalState = {};
    let wakeLock = null;
    let audioCtx = null;
    let silentAudio = null;

    function initAudioAndWakeLock() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!silentAudio) {
        silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        silentAudio.loop = true;
        silentAudio.play().catch(() => {});
      }

      if ('wakeLock' in navigator && !wakeLock) {
        navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }).catch(() => {});
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        initAudioAndWakeLock();
        socket.emit('get_all_state');
      }
    });

    socket.on('init_state', (queues) => {
      globalState = queues;
      setupBankSelect();
      updateUI();
    });

    socket.on('queue_update', ({ bank, data }) => {
      globalState[bank] = data;
      if (bank === currentBank) {
        setupDeskSelect();
        updateUI();
      }
    });

    socket.on('new_customer_waiting', ({ bank, ticketNo, waitingCount }) => {
      if (bank === currentBank) {
        initAudioAndWakeLock();
        const banner = document.getElementById('newWaitingBanner');
        const textEl = document.getElementById('bannerText');
        banner.classList.remove('hidden');
        textEl.innerText = `🔔 신규 대기 ${ticketNo}번 접수! (대기 ${waitingCount}명)`;
      }
    });

    socket.on('customer_called_dismiss', ({ bank }) => {
      if (bank === currentBank) {
        document.getElementById('newWaitingBanner').classList.add('hidden');
      }
    });

    function setupBankSelect() {
      const select = document.getElementById('bankSelect');
      const fixedBadge = document.getElementById('bankFixedBadge');
      const banks = Object.keys(globalState);

      if (lockedBank && banks.includes(lockedBank)) {
        currentBank = lockedBank;
        select.classList.add('hidden');
        fixedBadge.classList.remove('hidden');
        fixedBadge.innerText = `🏦 ${lockedBank}`;
      } else {
        if (!currentBank || !banks.includes(currentBank)) currentBank = banks[0];
        select.innerHTML = banks.map(b => `<option value="${b}" ${b === currentBank ? 'selected' : ''}>${b}</option>`).join('');
      }
      setupDeskSelect();
    }

    function setupDeskSelect() {
      const deskSelect = document.getElementById('deskSelect');
      const desks = (globalState[currentBank] && globalState[currentBank].desks) || [];

      deskSelect.innerHTML = desks.map(d => `
        <option value="${d.id}" ${d.id === currentDeskId ? 'selected' : ''}>${d.name}</option>
      `).join('');

      if (!desks.find(d => d.id === currentDeskId) && desks.length > 0) {
        currentDeskId = desks[0].id;
      }
    }

    function onBankChanged() {
      currentBank = document.getElementById('bankSelect').value;
      localStorage.setItem('saved_teller_bank', currentBank);
      const desks = (globalState[currentBank] && globalState[currentBank].desks) || [];
      if (desks.length > 0) currentDeskId = desks[0].id;
      localStorage.setItem('saved_teller_desk', currentDeskId);
      setupDeskSelect();
      updateUI();
    }

    function onDeskChanged() {
      currentDeskId = Number(document.getElementById('deskSelect').value);
      localStorage.setItem('saved_teller_desk', currentDeskId);
      updateUI();
    }

    function callNext() {
      initAudioAndWakeLock();
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);

      if (!bankData || bankData.waiting.length === 0) return alert('대기 중인 고객이 없습니다.');
      if (desk && desk.status === '상담중') return alert('현재 상담 중인 고객을 먼저 종료해주세요.');

      socket.emit('call_next_desk', { bank: currentBank, deskId: currentDeskId }, (res) => {
        if (!res.success && res.message) alert(res.message);
      });
    }

    function reCall() {
      initAudioAndWakeLock();
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);
      if (!desk || !desk.current) return alert('호출된 고객이 없습니다.');
      socket.emit('recall_desk', { bank: currentBank, deskId: currentDeskId });
    }

    function finishServing() {
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);
      if (!desk || !desk.current) return alert('진행 중인 고객이 없습니다.');
      socket.emit('update_desk_status', { bank: currentBank, deskId: currentDeskId, status: '상담완료' });
    }

    function passAbsent() {
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);
      if (!desk || !desk.current) return alert('처리할 고객이 없습니다.');
      if (confirm(`${desk.current}번 고객을 부재 처리하고 번호표를 취소하시겠습니까?`)) {
        socket.emit('update_desk_status', { bank: currentBank, deskId: currentDeskId, status: '부재중' });
      }
    }

    function openTransferModal() {
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);
      if (!desk || !desk.current) return alert('이동시킬 고객 번호가 없습니다.');

      const otherDesks = bankData.desks.filter(d => d.id !== currentDeskId);
      if (otherDesks.length === 0) return alert('이동 가능한 다른 창구가 없습니다.');

      const deskOptions = otherDesks.map(d => `${d.id}번: ${d.name} (${d.status})`).join('\n');
      const targetId = prompt(`현재 ${desk.current}번 고객을 이동시킬 창구 번호(숫자만)를 입력하세요:\n${deskOptions}`);

      if (targetId) {
        socket.emit('transfer_desk', { bank: currentBank, fromDeskId: currentDeskId, toDeskId: Number(targetId) }, (res) => {
          if (res.success) alert(`${res.ticketNo}번 고객이 ${targetId}번 창구로 이동되었습니다.`);
          else alert(res.message || '이동 실패');
        });
      }
    }

    function updateUI() {
      const bankData = globalState[currentBank];
      if (!bankData) return;

      const desk = bankData.desks.find(d => d.id === currentDeskId) || bankData.desks[0];
      if (!desk) return;

      const waitCount = bankData.waiting.length;
      document.getElementById('deskTitle').innerText = desk.name;
      document.getElementById('servingNo').innerText = desk.current > 0 ? `${desk.current}번` : '-';
      document.getElementById('waitCountBadge').innerText = `대기: ${waitCount}명`;
      document.getElementById('waitingCountText').innerText = `${waitCount}명`;

      const badge = document.getElementById('statusBadge');
      const callBtn = document.getElementById('callBtn');
      const recallBtn = document.getElementById('recallBtn');
      const finishBtn = document.getElementById('finishBtn');
      const absentBtn = document.getElementById('absentBtn');
      const transferBtn = document.getElementById('transferBtn');
      const guide = document.getElementById('servingGuide');

      badge.innerText = desk.status;

      if (desk.status === '상담중') {
        badge.className = 'text-sm font-black px-3 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
        guide.innerText = '고객 상담 진행 중입니다. 완료 시 [상담종료]를 누르세요.';
        callBtn.disabled = true;
        recallBtn.disabled = false;
        finishBtn.disabled = false;
        absentBtn.disabled = false;
        transferBtn.disabled = false;
      } else {
        badge.className = 'text-sm font-black px-3 py-0.5 rounded-full bg-slate-200 text-slate-700';
        guide.innerText = waitCount > 0 ? '대기 고객이 있습니다. [다음 고객 호출]을 누르세요.' : '대기 중인 고객이 없습니다.';
        callBtn.disabled = (waitCount === 0);
        recallBtn.disabled = true;
        finishBtn.disabled = true;
        absentBtn.disabled = true;
        transferBtn.disabled = true;
      }

      const listEl = document.getElementById('waitingList');
      if (waitCount > 0) {
        listEl.innerHTML = bankData.waiting.map((n, idx) => `
          <span class="px-3.5 py-1.5 bg-white border border-slate-300 rounded-xl font-black text-base text-slate-800 shadow-sm">
            <span class="text-xs text-slate-400 mr-1">${idx + 1}위</span>${n}번
          </span>
        `).join('');
      } else {
        listEl.innerHTML = '<span class="text-xs text-slate-400">대기 중인 고객이 없습니다.</span>';
      }
    }
  </script>
</body>
</html>
