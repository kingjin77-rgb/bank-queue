<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담사 호출기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; }
    .toss-card { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center">
  <div class="w-full max-w-md toss-card p-6 border border-gray-100">
    
    <div class="flex justify-between items-center mb-5 pb-3 border-b border-gray-100">
      <div class="flex gap-2 items-center">
        <select id="bankSelect" onchange="changeBank()" class="font-bold text-lg text-blue-600 bg-transparent outline-none cursor-pointer"></select>
        <select id="deskSelect" onchange="changeDesk()" class="font-bold text-sm text-gray-700 bg-gray-100 px-2 py-1 rounded-lg outline-none cursor-pointer"></select>
      </div>
      <div id="waitCount" class="text-sm font-semibold text-gray-500">대기: 0명</div>
    </div>

    <!-- 현재 상담/호출 현황 -->
    <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-5 text-center mb-5">
      <div class="flex justify-center items-center gap-2 mb-1">
        <span id="deskTitle" class="text-xs font-bold text-gray-500">1번 창구</span>
        <span id="statusBadge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-gray-200 text-gray-700">대기중</span>
      </div>
      <div id="servingNo" class="text-6xl font-black text-blue-600 my-1">-</div>
      <p id="servingGuide" class="text-xs text-gray-400">대기 중인 고객을 호출하세요.</p>
    </div>

    <!-- 호출 컨트롤 패널 -->
    <div class="space-y-2.5 mb-5">
      <div class="flex gap-2">
        <button id="callBtn" onclick="callNext()" class="flex-[2] py-4 bg-blue-600 active:bg-blue-700 text-white font-black text-lg rounded-xl shadow-md transition active:scale-[0.98]">
          다음 고객 호출
        </button>
        <button id="recallBtn" onclick="reCall()" class="flex-1 py-4 bg-amber-500 active:bg-amber-600 text-white font-black text-base rounded-xl shadow-md transition active:scale-[0.98]">
          📢 재호출
        </button>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <button onclick="setStatus('상담중')" class="py-3.5 bg-emerald-50 active:bg-emerald-100 text-emerald-700 font-bold rounded-xl text-sm border border-emerald-200 transition">
          상담시작
        </button>
        <button onclick="setStatus('상담완료')" class="py-3.5 bg-gray-100 active:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm border border-gray-200 transition">
          상담종료
        </button>
        <button onclick="passAbsent()" class="py-3.5 bg-rose-50 active:bg-rose-100 text-rose-600 font-bold rounded-xl text-sm border border-rose-200 transition">
          부재(패스)
        </button>
      </div>
    </div>

    <!-- 대기 번호 명단 -->
    <div>
      <div class="text-xs font-bold text-gray-400 mb-2">대기 번호 명단</div>
      <div id="waitingList" class="flex flex-wrap gap-1.5 text-sm text-gray-600 min-h-[32px]">
        대기 고객 없음
      </div>
    </div>

  </div>

  <script>
    const socket = io();
    let currentBank = '';
    let currentDeskId = 1;
    let globalState = {};

    socket.on('init_state', (queues) => {
      globalState = queues;
      initBankSelect();
      updateUI();
    });

    socket.on('queue_update', ({ bank, data }) => {
      globalState[bank] = data;
      if (bank === currentBank) {
        initDeskSelect();
        updateUI();
      }
    });

    function initBankSelect() {
      const select = document.getElementById('bankSelect');
      const banks = Object.keys(globalState);
      if (!currentBank && banks.length > 0) currentBank = banks[0];

      select.innerHTML = banks.map(b => `
        <option value="${b}" ${b === currentBank ? 'selected' : ''}>${b}</option>
      `).join('');
      initDeskSelect();
    }

    function initDeskSelect() {
      const deskSelect = document.getElementById('deskSelect');
      const desks = (globalState[currentBank] && globalState[currentBank].desks) || [];
      
      deskSelect.innerHTML = desks.map(d => `
        <option value="${d.id}" ${d.id === currentDeskId ? 'selected' : ''}>${d.name}</option>
      `).join('');

      if (!desks.find(d => d.id === currentDeskId) && desks.length > 0) {
        currentDeskId = desks[0].id;
      }
    }

    function changeBank() {
      currentBank = document.getElementById('bankSelect').value;
      initDeskSelect();
      updateUI();
    }

    function changeDesk() {
      currentDeskId = Number(document.getElementById('deskSelect').value);
      updateUI();
    }

    // 신규 다음 고객 호출
    function callNext() {
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);
      
      if (desk && desk.status === '상담중') {
        alert('현재 상담 중입니다. 먼저 [상담종료]를 눌러주세요.');
        return;
      }

      socket.emit('call_next_desk', { bank: currentBank, deskId: currentDeskId }, (res) => {
        if (!res.success && res.message) alert(res.message);
      });
    }

    // 현재 고객 다시 호출 (재호출)
    function reCall() {
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);

      if (!desk || !desk.current) {
        alert('현재 호출된 고객이 없습니다. [다음 고객 호출]을 누르세요.');
        return;
      }

      socket.emit('recall_desk', { bank: currentBank, deskId: currentDeskId }, (res) => {
        if (!res.success && res.message) alert(res.message);
      });
    }

    // 고객 부재 시 패스 처리
    function passAbsent() {
      const bankData = globalState[currentBank];
      const desk = bankData && bankData.desks.find(d => d.id === currentDeskId);

      if (!desk || !desk.current) {
        alert('처리할 호출 고객이 없습니다.');
        return;
      }

      if (confirm(`${desk.current}번 고객을 부재중 처리하고 비우시겠습니까?`)) {
        socket.emit('update_desk_status', { bank: currentBank, deskId: currentDeskId, status: '부재중' });
      }
    }

    function setStatus(status) {
      socket.emit('update_desk_status', { bank: currentBank, deskId: currentDeskId, status });
    }

    function updateUI() {
      const bankData = globalState[currentBank];
      if (!bankData) return;

      const desk = bankData.desks.find(d => d.id === currentDeskId) || bankData.desks[0];
      if (!desk) return;

      document.getElementById('deskTitle').innerText = desk.name;
      document.getElementById('servingNo').innerText = desk.current > 0 ? `${desk.current}번` : '-';
      document.getElementById('waitCount').innerText = `대기: ${bankData.waiting.length}명`;

      const badge = document.getElementById('statusBadge');
      const callBtn = document.getElementById('callBtn');
      const recallBtn = document.getElementById('recallBtn');
      const guide = document.getElementById('servingGuide');

      badge.innerText = desk.status;

      if (desk.status === '상담중') {
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
        guide.innerText = '현재 고객님과 상담 진행 중입니다.';
        callBtn.disabled = true;
        callBtn.className = 'flex-[2] py-4 bg-gray-300 text-gray-500 font-bold text-lg rounded-xl cursor-not-allowed';
        recallBtn.disabled = true;
        recallBtn.className = 'flex-1 py-4 bg-gray-300 text-gray-500 font-bold text-base rounded-xl cursor-not-allowed';
      } else if (desk.status === '호출중') {
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-700';
        guide.innerText = '고객이 오지 않으면 [재호출] 또는 [부재(패스)]를 누르세요.';
        callBtn.disabled = false;
        callBtn.className = 'flex-[2] py-4 bg-blue-600 active:bg-blue-700 text-white font-black text-lg rounded-xl shadow-md';
        recallBtn.disabled = false;
        recallBtn.className = 'flex-1 py-4 bg-amber-500 active:bg-amber-600 text-white font-black text-base rounded-xl shadow-md';
      } else {
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-gray-200 text-gray-700';
        guide.innerText = '대기 중인 고객을 호출하세요.';
        callBtn.disabled = false;
        callBtn.className = 'flex-[2] py-4 bg-blue-600 active:bg-blue-700 text-white font-black text-lg rounded-xl shadow-md';
        recallBtn.disabled = true;
        recallBtn.className = 'flex-1 py-4 bg-gray-300 text-gray-500 font-bold text-base rounded-xl cursor-not-allowed';
      }

      const listEl = document.getElementById('waitingList');
      if (bankData.waiting.length > 0) {
        listEl.innerHTML = bankData.waiting.map(n => `<span class="px-2.5 py-1 bg-gray-100 rounded-lg font-bold text-xs">${n}번</span>`).join('');
      } else {
        listEl.innerHTML = '<span class="text-xs text-gray-400">대기 고객 없음</span>';
      }
    }
  </script>
</body>
</html>
