<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>상담석 대기 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; word-break: keep-all; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col p-3 md:p-6 select-none antialiased">

  <!-- 1. 반응형 상단 헤더 -->
  <header class="bg-white rounded-2xl p-3.5 md:p-4 shadow-sm flex flex-wrap justify-between items-center gap-3 mb-3 md:mb-5 border border-slate-200/80">
    <div class="flex items-center gap-2 md:gap-3 flex-1 min-w-[200px]">
      <span class="bg-blue-600 text-white font-black px-3 py-1.5 rounded-xl text-xs md:text-sm whitespace-nowrap shadow-sm" id="current-bank-label">우리은행</span>
      <select id="teller-select" onchange="changeTeller(this.value)" class="flex-1 max-w-xs text-xs md:text-base font-extrabold bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 outline-none focus:border-blue-500">
      </select>
    </div>
    
    <div class="flex items-center gap-1.5 bg-slate-50 px-3 py-1.5 rounded-xl border border-slate-100">
      <span class="text-[11px] md:text-xs font-bold text-slate-400">내 은행 대기:</span>
      <span class="text-sm md:text-lg font-black text-rose-500" id="bank-queue-count">0명</span>
    </div>
  </header>

  <!-- 2. 메인 반응형 컨테이너 (모바일: 1열 스택 / 태블릿·PC: 2열 분할) -->
  <main class="flex-1 flex flex-col lg:grid lg:grid-cols-3 gap-3 md:gap-5 min-h-0">
    
    <!-- 좌측(모바일 상단) 메인 컨트롤 패널 -->
    <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm p-4 md:p-8 flex flex-col justify-between border border-slate-200/80">
      
      <!-- 상단 진행 상태 및 현재 번호 -->
      <div>
        <div class="flex justify-between items-center pb-3 border-b border-slate-100">
          <span class="text-xs font-bold text-slate-400 tracking-wider">진행 상태</span>
          <span id="status-badge" class="bg-slate-100 text-slate-600 text-xs font-extrabold px-3 py-1 rounded-full">대기 중</span>
        </div>
        
        <div class="text-center my-6 md:my-10">
          <p class="text-xs font-bold text-slate-400 tracking-widest uppercase">현재 상담 고객</p>
          <div class="text-5xl sm:text-6xl md:text-8xl font-black text-slate-900 mt-2 tracking-tight" id="current-serving">-</div>
        </div>
      </div>

      <!-- 제어 버튼 (모바일: 2x2 그리드 / PC: 4열 가로 배치) -->
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 md:gap-3 mt-4">
        <button onclick="callCustomer()" id="btn-call" class="py-4 md:py-5 bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-black rounded-2xl shadow-md transition text-xs sm:text-sm md:text-base flex items-center justify-center">
          📢 고객 호출
        </button>
        <button onclick="startConsult()" id="btn-start" disabled class="py-4 md:py-5 bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black rounded-2xl shadow-md transition disabled:bg-slate-100 disabled:text-slate-400 text-xs sm:text-sm md:text-base flex items-center justify-center">
          ▶ 상담 시작
        </button>
        <button onclick="markNoShow()" id="btn-noshow" disabled class="py-4 md:py-5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white font-black rounded-2xl shadow-md transition disabled:bg-slate-100 disabled:text-slate-400 text-xs sm:text-sm md:text-base flex items-center justify-center">
          ⏳ 부재(보류)
        </button>
        <button onclick="finishConsult()" id="btn-finish" disabled class="py-4 md:py-5 bg-slate-900 hover:bg-black active:scale-95 text-white font-black rounded-2xl shadow-md transition disabled:bg-slate-100 disabled:text-slate-400 text-xs sm:text-sm md:text-base flex items-center justify-center">
          ✔ 상담 완료
        </button>
      </div>
    </div>

    <!-- 우측(모바일 하단) 대기 고객 & 부재 목록 -->
    <div class="bg-white rounded-3xl shadow-sm p-4 md:p-5 flex flex-col min-h-0 border border-slate-200/80 mt-2 lg:mt-0">
      
      <!-- 대기열 목록 -->
      <div class="flex-1 flex flex-col min-h-[140px] md:min-h-0">
        <div class="flex justify-between items-center mb-2">
          <h2 class="text-xs font-bold text-slate-700">내 은행 실시간 대기열</h2>
          <span class="text-[11px] text-blue-600 font-bold" id="queue-mini-count">0명</span>
        </div>
        <div class="flex-1 overflow-y-auto max-h-40 lg:max-h-none space-y-1.5 pr-1 mb-3" id="queue-list"></div>
      </div>

      <!-- 부재 보류자 목록 -->
      <div class="border-t border-slate-100 pt-3">
        <h2 class="text-xs font-bold text-amber-600 mb-2">⏳ 부재(No-Show) 보류자</h2>
        <div class="max-h-28 overflow-y-auto space-y-1.5 pr-1" id="noshow-list"></div>
      </div>

    </div>
  </main>

  <script>
    const socket = io();
    let currentTellerId = null;
    let allTellers = [];
    let myBank = '';
    let audioCtx = null;

    // 화면 꺼짐 방지
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(e => {});
    }

    // 모바일 터치 오디오 언락
    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('touchstart', unlockAudio, { once: true });
    document.addEventListener('click', unlockAudio, { once: true });

    function changeTeller(val) {
      currentTellerId = String(val);
      const teller = allTellers.find(t => String(t.id) === currentTellerId);
      if (teller) {
        myBank = teller.bank;
        document.getElementById('current-bank-label').innerText = teller.bank;
      }
    }

    function setStatus(text, colorClass) {
      const badge = document.getElementById('status-badge');
      badge.className = `text-xs font-extrabold px-3 py-1 rounded-full ${colorClass}`;
      badge.innerText = text;
    }

    function callCustomer() {
      unlockAudio();
      if (!currentTellerId) return alert('창구를 선택해주세요.');
      socket.emit('call_next', { tellerId: currentTellerId });
    }

    function startConsult() {
      socket.emit('start_consult', { tellerId: currentTellerId });
      setStatus("상담 진행 중", "bg-emerald-100 text-emerald-800");
      document.getElementById('btn-call').disabled = true;
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-noshow').disabled = true;
      document.getElementById('btn-finish').disabled = false;
    }

    function markNoShow() {
      if (confirm('고객을 부재 목록으로 이동하고 다음 대기자를 호출하시겠습니까?')) {
        socket.emit('mark_no_show', { tellerId: currentTellerId });
      }
    }

    function recallNoShow(ticketNo) {
      unlockAudio();
      socket.emit('recall_no_show', { tellerId: currentTellerId, ticketNo });
    }

    function finishConsult() {
      socket.emit('finish_consult', { tellerId: currentTellerId });
    }

    socket.on('call_success', (data) => {
      document.getElementById('current-serving').innerText = `${data.ticketNo}번`;
      setStatus("📢 고객 호출 중", "bg-amber-100 text-amber-800");
      document.getElementById('btn-start').disabled = false;
      document.getElementById('btn-noshow').disabled = false;

      playChimeAndTTS(`${data.ticketNo}번 고객님, ${data.counterName} 창구로 오시기 바랍니다.`);
    });

    socket.on('consult_finished', () => {
      setStatus("대기 중", "bg-slate-100 text-slate-600");
      document.getElementById('current-serving').innerText = "-";
      document.getElementById('btn-call').disabled = false;
      document.getElementById('btn-start').disabled = true;
      document.getElementById('btn-noshow').disabled = true;
      document.getElementById('btn-finish').disabled = true;
    });

    socket.on('state_update', (data) => {
      allTellers = data.tellers;
      const select = document.getElementById('teller-select');
      const prevVal = currentTellerId;
      select.innerHTML = '';
      data.tellers.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.innerText = `${t.name} [${t.bank}]`;
        select.appendChild(opt);
      });

      if (!currentTellerId && data.tellers.length > 0) {
        currentTellerId = String(data.tellers[0].id);
        myBank = data.tellers[0].bank;
        document.getElementById('current-bank-label').innerText = myBank;
      } else if (data.tellers.some(t => String(t.id) === String(prevVal))) {
        select.value = prevVal;
      }

      // 내 은행 대기열 목록
      const bankQueue = data.queueList.filter(q => q.bank === myBank);
      document.getElementById('bank-queue-count').innerText = `${bankQueue.length}명`;
      document.getElementById('queue-mini-count').innerText = `${bankQueue.length}명 대기`;

      const list = document.getElementById('queue-list');
      list.innerHTML = '';
      if (bankQueue.length === 0) {
        list.innerHTML = '<div class="text-[11px] text-slate-400 py-3 text-center">대기 중인 고객이 없습니다.</div>';
      } else {
        bankQueue.forEach((q, idx) => {
          const item = document.createElement('div');
          item.className = 'flex justify-between items-center p-2 bg-slate-50 rounded-xl border border-slate-100 text-xs';
          item.innerHTML = `
            <span class="font-extrabold text-slate-800">${q.ticketNo}번</span>
            <span class="font-bold text-blue-600 text-[11px]">${idx === 0 ? '다음 호출' : (idx + 1) + '번째'}</span>
          `;
          list.appendChild(item);
        });
      }

      // 부재 보류자 목록
      const noshowBox = document.getElementById('noshow-list');
      noshowBox.innerHTML = '';
      const bankNoShows = data.noShowList.filter(n => n.bank === myBank);
      if (bankNoShows.length === 0) {
        noshowBox.innerHTML = '<div class="text-[11px] text-slate-400 py-1 text-center">보류된 고객이 없습니다.</div>';
      } else {
        bankNoShows.forEach(n => {
          const row = document.createElement('div');
          row.className = 'flex justify-between items-center p-1.5 bg-amber-50 rounded-xl text-xs';
          row.innerHTML = `
            <span class="font-bold text-amber-900 text-[11px]">${n.ticketNo}번</span>
            <button onclick="recallNoShow(${n.ticketNo})" class="px-2 py-0.5 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white font-bold rounded-lg text-[10px]">재호출</button>
          `;
          noshowBox.appendChild(row);
        });
      }
    });

    function playChimeAndTTS(speechText) {
      try {
        unlockAudio();
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        osc1.frequency.setValueAtTime(523.25, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
        osc1.connect(gain);
        gain.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.7);

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(speechText);
          utter.lang = 'ko-KR';
          utter.rate = 0.95;
          setTimeout(() => window.speechSynthesis.speak(utter), 500);
        }
      } catch(e) {}
    }

    socket.on('error_msg', msg => alert(msg));
  </script>
</body>
</html>
