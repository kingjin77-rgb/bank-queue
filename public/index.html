<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 대기표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">
  <div class="w-full max-w-sm bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center" id="card">
    <!-- 동적 렌더링 -->
  </div>

  <script>
    const socket = io();
    
    // URL에서 은행명 정확히 추출 및 한글 디코딩
    const params = new URLSearchParams(window.location.search);
    const rawBank = params.get('bank');
    const bank = rawBank ? decodeURIComponent(rawBank).trim() : null;

    function render() {
      const card = document.getElementById('card');

      // 파라미터가 없을 때는 4개 은행 선택 버튼 노출
      if (!bank) {
        card.innerHTML = `
          <h1 class="text-2xl font-bold mb-3">은행을 선택해주세요</h1>
          <p class="text-sm text-gray-500 mb-6">대기표를 발급받을 창구를 선택하세요.</p>
          <div class="space-y-3">
            <button onclick="goToBank('우리은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100">우리은행</button>
            <button onclick="goToBank('신한은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100">신한은행</button>
            <button onclick="goToBank('국민은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100">국민은행</button>
            <button onclick="goToBank('푸본현대생명')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100">푸본현대생명</button>
          </div>
        `;
        return;
      }

      // 해당 은행의 발권 상태 확인
      const saved = localStorage.getItem(`ticket_${bank}`);

      if (!saved) {
        card.innerHTML = `
          <div class="inline-block px-3 py-1 bg-blue-50 text-blue-600 font-bold rounded-full text-xs mb-3">${bank}</div>
          <h1 class="text-2xl font-bold mb-2">모바일 번호표 발급</h1>
          <p class="text-sm text-gray-500 mb-6">스마트폰으로 간편하게 순서를 대기하세요.</p>
          <button onclick="issue()" class="w-full py-4 bg-blue-600 active:bg-blue-700 text-white font-bold rounded-2xl text-lg shadow-md">
            번호표 발급받기
          </button>
        `;
      } else {
        const ticket = JSON.parse(saved);
        card.innerHTML = `
          <div class="inline-block px-3 py-1 bg-blue-50 text-blue-600 font-bold rounded-full text-xs mb-3">${bank}</div>
          <p class="text-sm text-gray-400">내 대기 번호</p>
          <div class="text-6xl font-black text-blue-600 my-4">${ticket.no}번</div>
          
          <div class="flex gap-2 mt-6">
            <button onclick="delay(${ticket.no})" ${ticket.delay >= 3 ? 'disabled class="flex-1 py-3 bg-gray-100 text-gray-400 font-bold rounded-xl text-sm cursor-not-allowed"' : 'class="flex-1 py-3 bg-amber-50 active:bg-amber-100 text-amber-700 font-bold rounded-xl text-sm"'}>
              미루기 (${ticket.delay}/3)
            </button>
            <button onclick="cancel(${ticket.no})" class="flex-1 py-3 bg-red-50 active:bg-red-100 text-red-600 font-bold rounded-xl text-sm">
              취소하기
            </button>
          </div>
        `;
      }
    }

    function goToBank(name) {
      window.location.search = `?bank=${encodeURIComponent(name)}`;
    }

    function issue() {
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res.success) {
          localStorage.setItem(`ticket_${bank}`, JSON.stringify({ no: res.ticketNo, delay: 0 }));
          render();
        } else {
          alert('발권 오류가 발생했습니다.');
        }
      });
    }

    function delay(ticketNo) {
      let ticket = JSON.parse(localStorage.getItem(`ticket_${bank}`));
      if (ticket.delay >= 3) return alert('순번 미루기는 최대 3회까지 가능합니다.');
      
      socket.emit('delay_ticket', { bank, ticketNo }, (res) => {
        if (res.success) {
          ticket.delay++;
          localStorage.setItem(`ticket_${bank}`, JSON.stringify(ticket));
          render();
          alert('순번이 맨 뒤로 이동되었습니다.');
        } else {
          alert('순번 미루기 실패');
        }
      });
    }

    function cancel(ticketNo) {
      if (confirm('대기표를 취소하시겠습니까?')) {
        socket.emit('cancel_ticket', { bank, ticketNo }, () => {
          localStorage.removeItem(`ticket_${bank}`);
          render();
        });
      }
    }

    render();
  </script>
</body>
</html>
