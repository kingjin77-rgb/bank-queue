<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 모바일 번호표</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f2f4f6;
      --card-bg: #ffffff;
      --primary: #3182f6;
      --text: #191f28;
      --text-sub: #8b95a1;
      --border: #e5e8eb;
      --danger: #f04452;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .card { background: var(--card-bg); border-radius: 32px; padding: 36px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); width: 100%; max-width: 400px; text-align: center; }

    .bank-pill { display: inline-block; background: #e8f3ff; color: var(--primary); font-size: 15px; font-weight: 800; padding: 8px 18px; border-radius: 20px; margin-bottom: 16px; }
    .title { font-size: 24px; font-weight: 800; margin-bottom: 24px; }

    .ticket-box { background: #f9fafb; border: 2px solid var(--border); border-radius: 24px; padding: 28px 16px; margin: 20px 0; }
    .ticket-label { font-size: 15px; color: var(--text-sub); font-weight: 600; }
    .ticket-number { font-size: 76px; font-weight: 900; color: var(--primary); margin: 10px 0; letter-spacing: -2px; }
    .wait-text { font-size: 18px; font-weight: 800; color: var(--text); }

    .btn-big { width: 100%; height: 64px; font-size: 19px; font-weight: 800; background: var(--primary); color: #fff; border: none; border-radius: 18px; cursor: pointer; box-shadow: 0 6px 20px rgba(49, 130, 246, 0.35); }
    .btn-big:active { transform: scale(0.98); }

    .call-alert { display: none; background: #e8f3ff; border: 3px solid var(--primary); border-radius: 24px; padding: 24px; margin-top: 18px; animation: flash 1s infinite alternate; }
    @keyframes flash { from { transform: scale(1); } to { transform: scale(1.03); } }
    .call-alert h2 { font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
    .call-alert p { font-size: 18px; font-weight: 800; color: #191f28; }
  </style>
</head>
<body>

  <div class="card">
    <span class="bank-pill" id="bankPill">은행</span>
    <h1 class="title" id="pageTitle">상담 대기표 발권</h1>

    <div id="readySection">
      <p style="font-size: 16px; color: var(--text-sub); margin-bottom: 28px; line-height: 1.5;">
        아래 버튼을 누르면 번호표가 발권되며<br>호출 시 소리와 진동으로 알려드립니다.
      </p>
      <button class="btn-big" onclick="issueTicket()">번호표 발권하기</button>
    </div>

    <div id="ticketSection" style="display: none;">
      <div class="ticket-box">
        <div class="ticket-label">내 대기 번호</div>
        <div class="ticket-number" id="myNumDisplay">-</div>
        <div class="wait-text" id="myWaitDisplay">내 앞 대기: - 명</div>
      </div>

      <div class="call-alert" id="callBanner">
        <h2>🔔 고객님 차례입니다!</h2>
        <p id="deskNotice">창구로 방문해주세요.</p>
      </div>

      <p style="font-size: 13px; color: var(--text-sub); margin-top: 16px;">
        ※ 브라우저를 켜두시면 음성과 진동으로 호출됩니다.
      </p>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });
    const urlParams = new URLSearchParams(window.location.search);
    const bank = (urlParams.get('bank') || 'kb').toLowerCase();

    const BANK_NAMES = { woori: '우리은행', shinhan: '신한은행', kb: '국민은행', fubon: '푸본현대생명' };
    document.getElementById('bankPill').innerText = BANK_NAMES[bank] || '은행';

    let myTicket = null;
    let audioCtx = null;

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeep() {
      try {
        unlockAudio();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(784, now);
        osc.frequency.setValueAtTime(659.25, now + 0.25);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        osc.start(now);
        osc.stop(now + 0.9);
      } catch (e) {}
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'ko-KR';
        u.rate = 1.0;
        window.speechSynthesis.speak(u);
      }
    }

    const saved = localStorage.getItem(`my_ticket_${bank}`);
    if (saved) {
      myTicket = JSON.parse(saved);
      showTicket();
    }

    function issueTicket() {
      unlockAudio();
      socket.emit('issue_ticket', { bank, name: '고객' }, (res) => {
        if (res && res.success) {
          myTicket = res.ticket;
          localStorage.setItem(`my_ticket_${bank}`, JSON.stringify(myTicket));
          showTicket();
        }
      });
    }

    function showTicket() {
      document.getElementById('readySection').style.display = 'none';
      document.getElementById('ticketSection').style.display = 'block';
      document.getElementById('myNumDisplay').innerText = `${myTicket.ticketNumber}번`;
      socket.emit('get_state', { bank });
    }

    socket.on('state_update', (data) => {
      if (data.bank !== bank || !myTicket) return;
      const idx = data.queue.findIndex(c => c.id === myTicket.id);
      if (idx >= 0) {
        document.getElementById('myWaitDisplay').innerText = `내 앞 대기: ${idx} 명`;
      }
    });

    socket.on('customer_called', (data) => {
      if (data.bank !== bank || !myTicket) return;
      if (data.customer.id === myTicket.id) {
        const banner = document.getElementById('callBanner');
        banner.style.display = 'block';
        document.getElementById('deskNotice').innerText = `${data.deskName}로 와주세요.`;

        playBeep();
        setTimeout(() => {
          speak(`${myTicket.ticketNumber}번 고객님, ${data.deskName}로 방문해주시기 바랍니다.`);
        }, 300);

        if (navigator.vibrate) {
          navigator.vibrate([400, 200, 400, 200, 600]);
        }
      }
    });

    socket.on('emergency_repaired', () => {
      localStorage.removeItem(`my_ticket_${bank}`);
      window.location.reload();
    });
  </script>
</body>
</html>
