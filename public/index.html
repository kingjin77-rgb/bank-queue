<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>스마트 대기 순번표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style> body { font-family: "Pretendard Variable", Pretendard, sans-serif; word-break: keep-all; } </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-4 antialiased">
  <header class="text-center py-4">
    <h1 class="text-xl font-extrabold text-blue-400 tracking-tight">현장 상담 대기 시스템</h1>
    <p class="text-xs text-slate-400 mt-1">빠르고 편리한 원스톱 모바일 번호표</p>
  </header>
  <main class="flex-1 flex flex-col justify-center max-w-md mx-auto w-full">
    <div id="step-select" class="space-y-4">
      <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-xl text-center">
        <h2 class="text-lg font-black text-white mb-1">상담 기관을 선택해 주세요</h2>
        <p class="text-xs text-slate-400 mb-6">터치 즉시 순번표가 발권됩니다.</p>
        <div id="bank-button-container" class="grid grid-cols-1 gap-3">
          <div class="text-slate-500 text-xs py-4">목록을 불러오는 중입니다...</div>
        </div>
      </div>
    </div>
    <div id="step-ticket" class="hidden space-y-4">
      <div id="notif-banner" class="bg-amber-500/20 border border-amber-500/50 rounded-2xl p-3 text-center hidden">
        <p class="text-xs text-amber-300 font-bold mb-1.5">🔔 내 차례 알림을 받으시겠습니까?</p>
        <button onclick="requestNotificationPermission()" class="px-4 py-1.5 bg-amber-500 text-slate-950 text-xs font-extrabold rounded-xl shadow active:scale-95 transition">알림 허용하기 (진동/푸시)</button>
      </div>
      <div id="ticket-card" class="bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl text-center relative overflow-hidden transition-all duration-300">
        <div class="inline-block px-3.5 py-1 bg-blue-900/60 border border-blue-500/40 rounded-full text-blue-300 text-xs font-bold mb-3">🏛️ <span id="display-bank-name">-</span></div>
        <p class="text-xs text-slate-400 font-medium">고객님의 대기 번호</p>
        <div class="text-5xl font-black text-white tracking-tight my-2" id="display-ticket-no">---번</div>
        <div class="my-6 py-4 px-3 bg-slate-900/80 rounded-2xl border border-slate-700/60 flex items-center justify-around">
          <div><p class="text-[11px] text-slate-400">내 앞 대기</p><p class="text-2xl font-black text-amber-400 mt-0.5" id="display-wait-count">-명</p></div>
          <div class="w-px h-8 bg-slate-700"></div>
          <div><p class="text-[11px] text-slate-400">상태</p><p class="text-sm font-extrabold text-emerald-400 mt-1" id="display-status-text">대기 중</p></div>
        </div>
        <div id="call-action-box" class="hidden bg-amber-500 text-slate-950 p-4 rounded-2xl font-black text-sm animate-bounce shadow-lg shadow-amber-500/30">📢 <span id="call-counter-name">상담 부스</span>로 지금 바로 이동해 주세요!</div>
        <p class="text-[11px] text-slate-500 mt-4 leading-relaxed">화면을 닫거나 다른 앱을 켜두셔도 순번 임박 시 진동과 푸시 알림으로 안내해 드립니다.</p>
      </div>
      <button onclick="cancelTicket()" class="w-full py-3 bg-slate-800/80 hover:bg-rose-950/40 border border-slate-700 text-slate-400 hover:text-rose-400 text-xs font-bold rounded-2xl transition">대기 번호표 취소</button>
    </div>
  </main>
  <footer class="text-center py-4 text-[11px] text-slate-500">실시간 대기 연동 시스템</footer>
  <script>
    const socket = io();
    let myBank = null; let myTicketNo = null; let audioCtx = null; let hasAlertedImminent = false;
    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('touchstart', unlockAudio, { passive: true });
    document.addEventListener('click', unlockAudio, { passive: true });
    function playBeep(frequency = 880, duration = 0.2) {
      try {
        unlockAudio();
        const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
        osc.frequency.value = frequency; gain.gain.value = 0.3;
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }
    function triggerVibrate(pattern = [200, 100, 200]) { if ('vibrate' in navigator) navigator.vibrate(pattern); }
    function sendPushNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body, icon: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png', vibrate: [300, 150, 300] });
      }
    }
    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            document.getElementById('notif-banner').classList.add('hidden');
            triggerVibrate([100]);
            sendPushNotification('🔔 알림 활성화 완료', '순번이 다가오면 진동과 알림으로 알려드립니다.');
          }
        });
      }
    }
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const bankParam = params.get('bank');
      if (bankParam) setTimeout(() => issueTicket(bankParam), 300);
    });
    function issueTicket(bank) {
      unlockAudio(); myBank = bank; socket.emit('issue_ticket', { selectedBank: bank });
      if ('Notification' in window && Notification.permission === 'default') document.getElementById('notif-banner').classList.remove('hidden');
    }
    socket.on('ticket_issued', (data) => {
      if (myBank === data.bank && !myTicketNo) {
        myTicketNo = data.ticketNo;
        document.getElementById('step-select').classList.add('hidden');
        document.getElementById('step-ticket').classList.remove('hidden');
        document.getElementById('display-bank-name').innerText = myBank;
        document.getElementById('display-ticket-no').innerText = `${myTicketNo}번`;
        triggerVibrate([150]);
      }
    });
    function cancelTicket() {
      if (confirm('대기를 취소하시겠습니까?')) {
        myBank = null; myTicketNo = null; hasAlertedImminent = false;
        document.getElementById('step-ticket').classList.add('hidden');
        document.getElementById('step-select').classList.remove('hidden');
      }
    }
    socket.on('state_update', (data) => {
      const btnContainer = document.getElementById('bank-button-container'); btnContainer.innerHTML = '';
      data.banks.forEach(b => {
        const stat = (data.stats || []).find(s => s.bank === b); const waitCount = stat ? stat.waiting : 0;
        const btn = document.createElement('button');
        btn.className = 'w-full py-4 px-5 bg-slate-700/80 hover:bg-blue-600 active:scale-[0.98] border border-slate-600/80 rounded-2xl text-left flex justify-between items-center transition shadow-lg';
        btn.onclick = () => issueTicket(b);
        btn.innerHTML = `<div class="flex items-center gap-3"><span class="text-xl">🏛️</span><span class="font-bold text-sm text-white">${b}</span></div><div class="text-right"><span class="text-[11px] text-slate-400">대기</span><span class="text-sm font-black text-amber-400 ml-1">${waitCount}명</span></div>`;
        btnContainer.appendChild(btn);
      });
      if (myTicketNo && myBank) {
        const queueForBank = data.queue.filter(q => q.bank === myBank && q.status === 'WAITING');
        const myIndex = queueForBank.findIndex(q => q.ticketNo === myTicketNo);
        if (myIndex !== -1) {
          const aheadCount = myIndex;
          document.getElementById('display-wait-count').innerText = `${aheadCount}명`;
          if (aheadCount <= 3 && !hasAlertedImminent) {
            hasAlertedImminent = true; triggerVibrate([300, 100, 300]); playBeep(660, 0.3);
            sendPushNotification('🔔 [입장 준비 안내]', `고객님 차례가 곧 다가옵니다! (앞에 ${aheadCount}명 대기 중)`);
          }
        }
      }
    });
    socket.on('customer_called', (data) => {
      if (myTicketNo && data.ticketNo === myTicketNo) {
        const card = document.getElementById('ticket-card');
        card.classList.remove('bg-slate-800', 'border-slate-700'); card.classList.add('bg-amber-950/60', 'border-amber-500');
        document.getElementById('display-status-text').innerText = '📢 지금 호출 중!';
        document.getElementById('display-status-text').className = 'text-sm font-black text-amber-400 animate-pulse';
        document.getElementById('call-counter-name').innerText = data.counterName;
        document.getElementById('call-action-box').classList.remove('hidden');
        triggerVibrate([500, 200, 500, 200, 800]); playBeep(880, 0.5);
        sendPushNotification('📢 [고객님 호출]', `${data.ticketNo}번 고객님, ${data.counterName}로 지금 방문해 주세요!`);
      }
    });
  </script>
</body>
</html>
