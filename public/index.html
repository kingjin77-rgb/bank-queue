<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 대기표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; }
    .toss-card { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4" onclick="unlockAudio()">
  <div class="w-full max-w-sm">
    <div id="app" class="toss-card p-6 text-center">
      <div class="py-12">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-sm font-bold text-gray-600">번호표를 발권하고 있습니다...</p>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const rawBank = params.get('bank');
    const bank = rawBank ? decodeURIComponent(rawBank).trim() : null;

    let preAlert3rdSent = false;
    let preAlertNextSent = false;
    let audioUnlocked = false;
    let audioCtx = null;

    // 모바일 브라우저 오디오 & 음성 잠금 해제
    function unlockAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if ('speechSynthesis' in window && !audioUnlocked) {
        const dummy = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(dummy);
        audioUnlocked = true;
      }
    }

    // 맑은 은행/공항 2단 차임벨 ("딩~동~")
    function playDingDong(onEnded) {
      unlockAudio();
      try {
        const now = audioCtx.currentTime;

        // 1음 ("딩" - 높은 솔 / G5: 784Hz)
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(784, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.5);

        // 2음 ("동" - 중간 도 / C5: 523.25Hz)
        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(523.25, now + 0.28);
        gain2.gain.setValueAtTime(0.35, now + 0.28);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.28);
        osc2.stop(now + 0.9);

        if (onEnded) {
          setTimeout(onEnded, 700);
        }
      } catch (e) {
        if (onEnded) onEnded();
      }
    }

    // 한국어 음성 안내 (TTS)
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.95;
        msg.volume = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    function requestNotificationPermission() {
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    }

    function sendPushNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, {
          body: body,
          icon: 'https://cdn-icons-png.flaticon.com/512/2830/2830284.png'
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (bank) {
        autoProcessTicket();
      } else {
        render();
      }
    });

    function autoProcessTicket() {
      requestNotificationPermission();
      const activeData = localStorage.getItem(`ticket_${bank}`);

      if (activeData) {
        render();
        return;
      }

      localStorage.removeItem(`ticket_completed_${bank}`);
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res.success) {
          localStorage.setItem(`ticket_${bank}`, JSON.stringify({ no: res.ticketNo, delay: 0 }));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
        } else {
          alert('발권 오류: ' + (res.message || '다시 시도해주세요.'));
          render();
        }
      });
    }

    function render() {
      const app = document.getElementById('app');

      if (!bank) {
        app.innerHTML = `
          <h2 class="text-2xl font-bold mb-2">상담 은행 선택</h2>
          <p class="text-sm text-gray-500 mb-6">스마트태그 또는 은행을 선택해주세요.</p>
          <div class="space-y-3">
            <button onclick="selectBank('우리은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100 transition">우리은행</button>
            <button onclick="selectBank('신한은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100 transition">신한은행</button>
            <button onclick="selectBank('국민은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100 transition">국민은행</button>
            <button onclick="selectBank('푸본현대생명')" class="w-full py-4 bg-blue-50 text-blue-600 font-bold rounded-2xl text-lg hover:bg-blue-100 transition">푸본현대생명</button>
          </div>
        `;
        return;
      }

      const activeData = localStorage.getItem(`ticket_${bank}`);
      const isCompleted = localStorage.getItem(`ticket_completed_${bank}`);

      if (isCompleted) {
        app.innerHTML = `
          <div class="py-4">
            <span class="inline-block px-3 py-1 bg-gray-100 text-gray-600 font-bold rounded-full text-xs mb-3">${bank}</span>
            <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 font-black">✓</div>
            <h2 class="text-2xl font-bold mb-2">상담이 완료되었습니다</h2>
            <p class="text-xs text-gray-400 mb-6">이용해 주셔서 대단히 감사합니다.</p>

            <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-5 mb-5 text-left">
              <span class="text-[11px] font-bold text-blue-600 bg-white px-2 py-0.5 rounded-md border border-blue-200">법률 & 등기 전담</span>
              <h3 class="text-base font-bold text-gray-900 mt-2 mb-1">법무법인 제이엘</h3>
              <p class="text-xs text-gray-600 mb-4 leading-relaxed">분양전환 및 소유권이전등기, 브릿지 대출 관련 전문 법률 상담을 지원합니다.</p>
              <a href="tel:1899-4252" class="w-full py-3.5 bg-blue-600 active:bg-blue-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm text-sm">
                📞 분양전환 상담: 1899-4252
              </a>
            </div>

            <button onclick="reIssue()" class="w-full py-3 bg-blue-50 text-blue-600 font-bold rounded-xl text-sm">
              번호표 다시 발권하기
            </button>
          </div>
        `;
        return;
      }

      if (activeData) {
        const ticket = JSON.parse(activeData);
        app.innerHTML = `
          <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 font-bold rounded-full text-xs mb-3">${bank}</span>
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6 mb-4">
            <p class="text-sm text-gray-500 mb-1 font-medium">나의 대기 번호</p>
            <div class="text-6xl font-black text-blue-600 my-2">${ticket.no}번</div>
            <div id="waitAheadCount" class="text-xs text-blue-600 font-bold mt-2">대기 순서를 확인하는 중...</div>
          </div>
          
          <div class="flex gap-2">
            <button onclick="delayTicket(${ticket.no})" id="delay-btn" ${ticket.delay >= 3 ? 'disabled class="flex-1 py-3 bg-gray-100 text-gray-400 font-bold rounded-xl text-sm cursor-not-allowed"' : 'class="flex-1 py-3 bg-amber-50 active:bg-amber-100 text-amber-700 font-bold rounded-xl text-sm"'}>
              순번 미루기 (${ticket.delay}/3)
            </button>
            <button onclick="cancelTicket(${ticket.no})" class="flex-1 py-3 bg-red-50 active:bg-red-100 text-red-600 font-bold rounded-xl text-sm">
              즉시 취소
            </button>
          </div>
        `;
      }
    }

    function selectBank(name) {
      window.location.search = `?bank=${encodeURIComponent(name)}`;
    }

    function delayTicket(ticketNo) {
      let ticket = JSON.parse(localStorage.getItem(`ticket_${bank}`));
      if (ticket.delay >= 3) return alert('순번 미루기는 최대 3회까지만 가능합니다.');
      
      socket.emit('delay_ticket', { bank, ticketNo }, (res) => {
        if (res.success) {
          ticket.delay++;
          localStorage.setItem(`ticket_${bank}`, JSON.stringify(ticket));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
          alert('순번이 맨 뒤로 연기되었습니다.');
        }
      });
    }

    function cancelTicket(ticketNo) {
      if (confirm('대기표를 취소하시겠습니까?')) {
        socket.emit('cancel_ticket', { bank, ticketNo }, () => {
          localStorage.removeItem(`ticket_${bank}`);
          localStorage.removeItem(`ticket_completed_${bank}`);
          alert('대기표가 성공적으로 취소되었습니다.');
          window.location.href = window.location.pathname;
        });
      }
    }

    function reIssue() {
      localStorage.removeItem(`ticket_completed_${bank}`);
      autoProcessTicket();
    }

    socket.on('queue_update', ({ bank: b, data }) => {
      if (b !== bank) return;

      const activeData = localStorage.getItem(`ticket_${bank}`);
      if (!activeData) return;

      const ticket = JSON.parse(activeData);
      const myNumber = ticket.no;
      const myIndex = data.waiting.indexOf(myNumber);
      const waitCountEl = document.getElementById('waitAheadCount');

      if (myIndex > -1) {
        const aheadCount = myIndex;
        if (waitCountEl) {
          if (aheadCount === 0) {
            waitCountEl.innerText = '🔔 곧 고객님 순서입니다! 창구 앞으로 이동해주세요.';
            waitCountEl.className = 'text-xs text-rose-600 font-black mt-2 animate-pulse';
          } else if (aheadCount <= 2) {
            waitCountEl.innerText = `⚠️ 대기 순서 3번째 전입니다 (앞에 ${aheadCount}명 대기)`;
            waitCountEl.className = 'text-xs text-amber-600 font-bold mt-2';
          } else {
            waitCountEl.innerText = `내 앞에 ${aheadCount}명 대기 중`;
            waitCountEl.className = 'text-xs text-blue-600 font-bold mt-2';
          }
        }

        // 3번째 전 알림
        if (aheadCount === 2 && !preAlert3rdSent) {
          preAlert3rdSent = true;
          playDingDong(() => {
            speakText(`${myNumber}번 고객님, 대기 순서 3번째 전입니다. 창구 근처로 이동해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
          sendPushNotification(`[${bank}] 대기 3번째 전 안내`, `${myNumber}번 고객님, 창구 근처로 이동해 주세요.`);
        }

        // 바로 직전(다음) 순서 알림
        if (aheadCount === 0 && !preAlertNextSent) {
          preAlertNextSent = true;
          playDingDong(() => {
            speakText(`곧 ${myNumber}번 고객님 상담 순번입니다. 창구 바로 앞에서 대기해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          sendPushNotification(`[${bank}] 곧 고객님 상담 순번입니다!`, `${myNumber}번 고객님, 창구 바로 앞에서 대기해주세요.`);
        }
      }

      // 창구에서 호출했을 때
      const calledDesk = data.desks.find(d => d.current === myNumber);
      if (calledDesk) {
        playDingDong(() => {
          speakText(`${bank} ${calledDesk.name}, ${myNumber}번 고객님 창구로 와주시기 바랍니다.`);
        });
        if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
        sendPushNotification(`[${bank}] 창구 방문 안내`, `${myNumber}번 고객님, ${bank} ${calledDesk.name}로 오십시오!`);
        
        document.getElementById('app').innerHTML = `
          <div class="py-4">
            <span class="inline-block px-3 py-1 bg-red-100 text-red-600 font-bold rounded-full text-xs mb-3 animate-pulse">● 지금 호출 중</span>
            <div class="text-6xl font-black text-blue-600 my-2">${myNumber}번</div>
            <div class="bg-blue-50 border-2 border-blue-500 rounded-2xl p-5 my-4">
              <p class="text-sm font-semibold text-gray-600">${bank}</p>
              <h2 class="text-2xl font-black text-blue-700 mt-1">${calledDesk.name}로 오십시오!</h2>
            </div>
            <p class="text-xs text-gray-500">담당 상담사가 창구에서 기다리고 있습니다.</p>
          </div>
        `;
      }

      if (myIndex === -1 && !calledDesk) {
        const isStillServing = data.desks.some(d => d.current === myNumber);
        if (!isStillServing && localStorage.getItem(`ticket_${bank}`)) {
          localStorage.removeItem(`ticket_${bank}`);
          localStorage.setItem(`ticket_completed_${bank}`, 'true');
          render();
        }
      }
    });
  </script>
</body>
</html>
