<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>스마트 번호표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .calling-animation { animation: pulse-ring 1.5s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col justify-between min-h-screen p-4 select-none">

  <!-- 대기 화면 -->
  <div id="screen-waiting" class="flex flex-col items-center justify-between h-full flex-1">
    <div class="w-full text-center mt-4">
      <div id="bank-badge" class="inline-block bg-blue-100 text-blue-800 text-xs font-bold px-3 py-1 rounded-full mb-2">
        우리은행
      </div>
      <h1 class="text-xl font-bold text-slate-800">모바일 대기표</h1>
    </div>

    <div class="w-full max-w-sm bg-white rounded-3xl shadow-lg p-6 text-center border border-slate-100">
      <p class="text-sm text-slate-400 font-medium">내 번호표</p>
      <div class="text-6xl font-black text-blue-600 my-4" id="my-number">-</div>
      <div class="inline-block bg-emerald-50 text-emerald-600 text-xs font-semibold px-2.5 py-1 rounded-md mb-2">
        발권 접수 완료
      </div>

      <div class="mt-4 pt-4 border-t border-slate-100 grid grid-cols-2 gap-4">
        <div class="bg-slate-50 p-3 rounded-2xl">
          <p class="text-xs text-slate-400">전체 대기</p>
          <p class="text-lg font-bold text-slate-700 mt-1" id="total-wait-count">-</p>
        </div>
        <div class="bg-slate-50 p-3 rounded-2xl">
          <p class="text-xs text-slate-400">내 앞 대기자</p>
          <p class="text-lg font-bold text-red-500 mt-1" id="waiting-count">-</p>
        </div>
      </div>
    </div>

    <!-- 순서 미루기 버튼 -->
    <div class="w-full max-w-sm flex flex-col gap-3 mb-6">
      <button 
        id="btn-delay" 
        onclick="delayOrder()" 
        class="w-full py-4 bg-slate-900 active:scale-95 text-white font-bold rounded-2xl shadow-lg transition flex items-center justify-center gap-2">
        <span>순서 3칸 뒤로 미루기</span>
        <span id="delay-badge" class="bg-amber-400 text-slate-900 text-xs px-2.5 py-0.5 rounded-full font-black">남은 3회</span>
      </button>
    </div>
  </div>

  <!-- 호출 화면 -->
  <div id="screen-called" class="fixed inset-0 bg-blue-600 z-50 hidden flex-col items-center justify-center p-6 text-white text-center">
    <div class="calling-animation w-20 h-20 bg-white/20 rounded-full flex items-center justify-center mb-6">
      <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
    </div>

    <p class="text-xl font-medium opacity-90 mb-1">고객님의 차례입니다!</p>
    <div class="text-6xl font-black tracking-tight my-2" id="called-number">-</div>
    
    <div class="bg-white text-slate-900 px-6 py-5 rounded-3xl shadow-2xl mt-4 w-full max-w-xs">
      <p class="text-xs font-bold text-slate-400">배정 창구</p>
      <p class="text-2xl font-black text-blue-600 mt-1" id="counter-info">-</p>
    </div>

    <p class="text-sm text-blue-100 mt-6 animate-pulse">창구로 방문해주시기 바랍니다.</p>

    <button onclick="closeCallPopup()" class="mt-8 px-6 py-3 bg-white/10 hover:bg-white/20 border border-white/30 rounded-2xl text-xs font-bold">
      확인 (닫기)
    </button>
  </div>

  <script>
    const socket = io();
    let myTicket = null;

    window.addEventListener('load', () => {
      socket.emit('issue_ticket');
    });

    socket.on('ticket_issued', (data) => {
      myTicket = data.ticketNo;
      document.getElementById('my-number').innerText = `${myTicket}번`;
      document.getElementById('waiting-count').innerText = `${Math.max(0, data.order - 1)}명`;
      document.getElementById('bank-badge').innerText = data.bank;
    });

    function delayOrder() {
      if (!myTicket) return;
      socket.emit('delay_order', { ticketNo: myTicket });
    }

    socket.on('order_delayed', (data) => {
      document.getElementById('delay-badge').innerText = `남은 ${data.delayRemaining}회`;
      document.getElementById('waiting-count').innerText = `${Math.max(0, data.newOrder - 1)}명`;
      alert(`순서가 뒤로 미뤄졌습니다. (내 앞 대기자: ${Math.max(0, data.newOrder - 1)}명)`);

      if (data.delayRemaining === 0) {
        const btn = document.getElementById('btn-delay');
        btn.disabled = true;
        btn.classList.add('bg-slate-400', 'cursor-not-allowed');
        btn.classList.remove('bg-slate-900');
      }
    });

    socket.on('customer_called', (data) => {
      if ("vibrate" in navigator) {
        navigator.vibrate([300, 150, 300, 150, 500]);
      }
      playAlarmSound();
      document.getElementById('counter-info').innerText = `${data.counterName} (${data.bankName})`;
      document.getElementById('called-number').innerText = `${data.ticketNo}번`;
      document.getElementById('screen-called').classList.remove('hidden');
      document.getElementById('screen-called').classList.add('flex');
    });

    socket.on('state_update', (data) => {
      document.getElementById('total-wait-count').innerText = `${data.totalWaiting}명`;
      if (myTicket) {
        const myPos = data.queueList.findIndex(q => q.ticketNo === myTicket);
        if (myPos !== -1) {
          document.getElementById('waiting-count').innerText = `${myPos}명`;
        }
      }
    });

    socket.on('system_reset_alert', () => {
      alert('대기열이 관리자에 의해 초기화되었습니다. 새로 발권합니다.');
      location.reload();
    });

    socket.on('error_msg', (msg) => alert(msg));

    function playAlarmSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch(e) {}
    }

    function closeCallPopup() {
      document.getElementById('screen-called').classList.add('hidden');
      document.getElementById('screen-called').classList.remove('flex');
    }
  </script>
</body>
</html>
