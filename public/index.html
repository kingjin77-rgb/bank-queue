<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 모바일 번호표</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f2f4f6;
      --card-bg: #ffffff;
      --primary: #00A88F;
      --primary-sub: #e6f7f4;
      --text: #191f28;
      --text-sub: #8b95a1;
      --border: #e5e8eb;
      --danger: #f04452;
      --btn-text: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
    .card { background: var(--card-bg); border-radius: 32px; padding: 36px 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); width: 100%; max-width: 420px; text-align: center; border-top: 8px solid var(--primary); }

    .bank-pill { display: inline-block; background: var(--primary-sub); color: var(--primary); font-size: 15px; font-weight: 800; padding: 8px 20px; border-radius: 20px; margin-bottom: 16px; border: 1px solid var(--primary); }
    .title { font-size: 24px; font-weight: 800; margin-bottom: 20px; }

    .ticket-box { background: #f9fafb; border: 2px solid var(--border); border-radius: 24px; padding: 28px 16px; margin: 20px 0; }
    .ticket-label { font-size: 15px; color: var(--text-sub); font-weight: 600; }
    .ticket-number { font-size: clamp(64px, 15vw, 84px); font-weight: 900; color: var(--primary); margin: 10px 0; letter-spacing: -2px; }
    .wait-text { font-size: 19px; font-weight: 800; color: var(--text); }

    .call-alert { display: none; background: var(--primary-sub); border: 3px solid var(--primary); border-radius: 24px; padding: 24px; margin-top: 18px; animation: flash 1s infinite alternate; }
    @keyframes flash { from { transform: scale(1); } to { transform: scale(1.03); } }
    .call-alert h2 { font-size: 22px; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
    .call-alert p { font-size: 18px; font-weight: 800; color: #191f28; }

    #completeSection { display: none; text-align: left; }
    .complete-badge { display: inline-block; background: #e6fcf5; color: #0ca678; font-size: 13px; font-weight: 800; padding: 6px 12px; border-radius: 12px; margin-bottom: 8px; }
    .bank-select-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; margin-bottom: 24px; }
    .btn-bank-pick { padding: 16px 12px; border-radius: 16px; border: 2px solid var(--border); background: #fff; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; }

    .jl-banner { background: #1e293b; color: #fff; border-radius: 20px; padding: 20px; text-align: left; margin-top: 10px; }
    .jl-tag { background: #38bdf8; color: #0f172a; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 6px; }
    .jl-title { font-size: 17px; font-weight: 800; margin-bottom: 6px; color: #f8fafc; }
    .jl-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="card">
    <span class="bank-pill" id="bankPill">은행</span>
    <h1 class="title" id="pageTitle">상담 대기표</h1>

    <div id="ticketSection">
      <div class="ticket-box">
        <div class="ticket-label">내 대기 번호</div>
        <div class="ticket-number" id="myNumDisplay">-</div>
        <div class="wait-text" id="myWaitDisplay">내 앞 대기: 접수 중...</div>
        <button id="reissueBtn" onclick="reissueTicket()" style="display: none; width: 100%; margin-top: 14px; height: 52px; border-radius: 14px; border: none; background: var(--primary); color: var(--btn-text); font-size: 16px; font-weight: 800; cursor: pointer;">다시 번호표 받기</button>
      </div>

      <div class="call-alert" id="callBanner">
        <h2>🔔 고객님 차례입니다!</h2>
        <p id="deskNotice">창구로 방문해주세요.</p>
      </div>

      <p style="font-size: 13px; color: var(--text-sub); margin-top: 16px;">
        ※ 화면을 켜두시면 순서에 맞춰 음성과 진동으로 호출됩니다.
      </p>
    </div>

    <div id="completeSection">
      <div style="text-align: center; margin-bottom: 18px;">
        <span class="complete-badge">상담 완료</span>
        <h2 style="font-size: 22px; font-weight: 800; margin-top: 4px;">상담이 완료되었습니다.</h2>
        <p style="font-size: 14px; color: var(--text-sub);">추가 상담이 필요한 다른 은행을 선택하세요.</p>
      </div>

      <div class="bank-select-grid" id="bankSelectGrid"></div>

      <div class="jl-banner">
        <span class="jl-tag">전문 법률 자문</span>
        <div class="jl-title">법무법인 제이엘 분양전환 센터</div>
        <div class="jl-desc">
          공공임대 분양전환 권리분석, 소유권이전 집단등기 및 브릿지 대출 법률 자문 지원 창구입니다.
        </div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentBank = (urlParams.get('bank') || 'kb').toLowerCase();

    // 푸본현대생명 공식 그린 (#00A88F) 적용
    const LOCAL_BANK_THEMES = {
      kb: { name: '국민은행', color: '#ffbc00', sub: '#fff9e6', btnText: '#2b2b2b' },
      shinhan: { name: '신한은행', color: '#0046ff', sub: '#e8f0fe', btnText: '#ffffff' },
      woori: { name: '우리은행', color: '#0067ac', sub: '#e6f3fa', btnText: '#ffffff' },
      fubon: { name: '푸본현대생명', color: '#00A88F', sub: '#e6f7f4', btnText: '#ffffff' }
    };

    function applyThemeDirect(theme) {
      if (!theme) return;
      document.documentElement.style.setProperty('--primary', theme.color);
      document.documentElement.style.setProperty('--primary-sub', theme.sub);
      document.documentElement.style.setProperty('--btn-text', theme.btnText || '#fff');
      document.getElementById('bankPill').innerText = theme.name;
    }
    applyThemeDirect(LOCAL_BANK_THEMES[currentBank] || LOCAL_BANK_THEMES.kb);

    const socket = io({ transports: ['websocket', 'polling'] });
    let myTicket = null;
    let audioCtx = null;

    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    // ===== 공통 음성 유틸 =====
    // 숫자를 "일, 이, 삼..." 한자어 발음으로 변환 ("한번/두번" 오독 방지, 최대 9999)
    function numToKorean(n) {
      const num = parseInt(n, 10);
      if (isNaN(num)) return String(n);
      if (num === 0) return '영';
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const units = ['', '십', '백', '천'];
      let out = '';
      let rest = num;
      for (let i = 3; i >= 0; i--) {
        const div = Math.pow(10, i);
        const d = Math.floor(rest / div);
        rest %= div;
        if (d === 0) continue;
        out += (d === 1 && i > 0 ? '' : digits[d]) + units[i];
      }
      return out;
    }

    // "1번 창구" -> "일번 창구", "단일 창구" -> 그대로
    function deskToKorean(deskName) {
      const m = String(deskName || '').match(/\d+/);
      return m ? `${numToKorean(m[0])}번 창구` : String(deskName || '창구');
    }

    // 표준 호출 안내 멘트
    function callMessage(bankName, ticketNumber, deskName) {
      return `${bankName}, ${numToKorean(ticketNumber)}번 고객님, ${deskToKorean(deskName)}로 오십시오.`;
    }

    // 음성 끊김 방지 큐: 이전 멘트가 끝난 뒤에 다음 멘트를 읽는다 (cancel 사용 안 함)
    const speechQueue = [];
    let speaking = false;
    let speechGuard = null;

    function enqueueSpeech(text, withChime) {
      speechQueue.push({ text, withChime: !!withChime });
      processSpeechQueue();
    }

    function processSpeechQueue() {
      if (speaking || speechQueue.length === 0) return;
      if (!('speechSynthesis' in window)) { speechQueue.length = 0; return; }
      speaking = true;
      const item = speechQueue.shift();

      const start = () => {
        const utter = new SpeechSynthesisUtterance(item.text);
        utter.lang = 'ko-KR';
        utter.rate = 0.92;
        utter.pitch = 1.0;
        utter.volume = 1.0;
        const done = () => {
          if (!speaking) return;
          speaking = false;
          clearTimeout(speechGuard);
          setTimeout(processSpeechQueue, 300);
        };
        utter.onend = done;
        utter.onerror = done;
        speechGuard = setTimeout(done, 15000); // onend 가 오지 않는 브라우저 대비 안전장치
        try { window.speechSynthesis.resume(); } catch (e) {}
        window.speechSynthesis.speak(utter);
      };

      if (item.withChime && typeof playChime === 'function') {
        playChime();
        setTimeout(start, 500);
      } else {
        start();
      }
    }

    function autoIssue() {
      const saved = localStorage.getItem(`my_ticket_${currentBank}`);
      if (saved) {
        myTicket = JSON.parse(saved);
        showTicket();
      } else {
        socket.emit('issue_ticket', { bank: currentBank, name: '고객' }, (res) => {
          if (res && res.success) {
            myTicket = res.ticket;
            localStorage.setItem(`my_ticket_${currentBank}`, JSON.stringify(myTicket));
            showTicket();
          }
        });
      }
    }

    function showTicket() {
      document.getElementById('ticketSection').style.display = 'block';
      document.getElementById('completeSection').style.display = 'none';
      document.getElementById('myNumDisplay').innerText = `${myTicket.ticketNumber}번`;
      socket.emit('get_state', { bank: currentBank });
    }

    window.addEventListener('click', unlockAudio, { once: true });
    window.addEventListener('touchstart', unlockAudio, { once: true });

    socket.on('connect', () => {
      autoIssue();
      socket.emit('get_all_state');
    });

    socket.on('all_state_update', (data) => {
      renderBankSelection(data.bankInfo);
    });

    socket.on('state_update', (data) => {
      if (data.bank !== currentBank) return;
      if (data.bankInfo) applyThemeDirect(data.bankInfo);
      if (!myTicket) return;

      const inQueue = data.queue.some(c => c.id === myTicket.id);
      const isConsulting = data.desks.some(d => d.currentCustomer && d.currentCustomer.id === myTicket.id);

      if (!inQueue && !isConsulting && myTicket.status === 'called') {
        showCompleteView();
        return;
      }

      const idx = data.queue.findIndex(c => c.id === myTicket.id);
      if (idx >= 0) {
        document.getElementById('myWaitDisplay').innerText = `내 앞 대기: ${idx} 명`;
      }
    });

    socket.on('customer_called', (data) => {
      if (data.bank !== currentBank || !myTicket) return;
      if (data.customer.id === myTicket.id) {
        myTicket.status = 'called';
        const banner = document.getElementById('callBanner');
        banner.style.display = 'block';
        document.getElementById('deskNotice').innerText = `${data.deskName}로 와주세요.`;

        setTimeout(() => {
          enqueueSpeech(`${numToKorean(myTicket.ticketNumber)}번 고객님, ${deskToKorean(data.deskName)}로 오십시오.`);
        }, 300);

        if (navigator.vibrate) navigator.vibrate([400, 200, 400, 200, 600]);
      }
    });

    socket.on('customer_passed', (data) => {
      if (data.bank !== currentBank || !myTicket) return;
      if (data.customer.id !== myTicket.id) return;
      localStorage.removeItem(`my_ticket_${currentBank}`);
      myTicket = null;
      document.getElementById('callBanner').style.display = 'none';
      document.getElementById('myNumDisplay').innerText = '-';
      document.getElementById('myWaitDisplay').innerText = '호출에 응답하지 않아 순번이 취소되었습니다.';
      document.getElementById('reissueBtn').style.display = 'block';
    });

    function reissueTicket() {
      document.getElementById('reissueBtn').style.display = 'none';
      document.getElementById('myWaitDisplay').innerText = '내 앞 대기: 접수 중...';
      autoIssue();
    }

    function showCompleteView() {
      localStorage.removeItem(`my_ticket_${currentBank}`);
      myTicket = null;
      document.getElementById('ticketSection').style.display = 'none';
      document.getElementById('completeSection').style.display = 'block';
      document.getElementById('bankPill').innerText = '상담 완료';
      document.documentElement.style.setProperty('--primary', '#0f172a');
    }

    function renderBankSelection(bankInfo) {
      const grid = document.getElementById('bankSelectGrid');
      grid.innerHTML = '';
      Object.keys(bankInfo).forEach(b => {
        const info = bankInfo[b];
        const btn = document.createElement('button');
        btn.className = 'btn-bank-pick';
        btn.style.borderColor = info.color;
        btn.style.color = info.color;
        btn.innerText = info.name;
        btn.onclick = () => {
          window.location.href = `/?bank=${b}`;
        };
        grid.appendChild(btn);
      });
    }

    socket.on('emergency_repaired', () => {
      localStorage.clear();
      window.location.reload();
    });
  </script>
</body>
</html>
