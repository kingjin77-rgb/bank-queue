<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 대기표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; -webkit-font-smoothing: antialiased; }
    .toss-card { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4" onclick="initCustomerAudio()">
  <div class="w-full max-w-sm">
    <div id="app" class="toss-card p-6 text-center">
      <div class="py-12">
        <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-sm font-bold text-gray-600">번호표를 확인하고 있습니다...</p>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const rawBank = params.get('bank');
    let bank = rawBank ? decodeURIComponent(rawBank).trim() : null;

    let preAlert3rdSent = false;
    let preAlertNextSent = false;
    let audioCtx = null;
    let hasProcessed = false;

    function toHanja(raw) {
      const num = parseInt(raw, 10);
      if (isNaN(num) || num <= 0) return raw;
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return digits[num];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return (t === 1 ? '십' : digits[t] + '십') + (o > 0 ? digits[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100), r = num % 100, t = Math.floor(r / 10), o = r % 10;
        return (h === 1 ? '백' : digits[h] + '백') + (t > 0 ? (t === 1 ? '십' : digits[t] + '십') : '') + (o > 0 ? digits[o] : '');
      }
      return num;
    }

    function initCustomerAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playDingDong(cb) {
      initCustomerAudio();
      try {
        const now = audioCtx.currentTime;
        const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(784, now);
        gain1.gain.setValueAtTime(0.3, now); gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        o1.connect(g1); g1.connect(audioCtx.destination);
        o1.start(now); o1.stop(now + 0.5);

        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(523.25, now + 0.28);
        gain2.gain.setValueAtTime(0.35, now + 0.28); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(now + 0.28); o2.stop(now + 0.9);

        if (cb) setTimeout(cb, 700);
      } catch (e) {
        if (cb) cb();
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR'; msg.rate = 0.92; msg.volume = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    socket.on('connect', () => {
      if (bank && !hasProcessed) {
        hasProcessed = true;
        autoProcessTicket();
      } else if (!bank) {
        render();
      }
    });

    socket.on('ticket_finished', ({ bank: b, ticketNo, reason }) => {
      const activeData = localStorage.getItem(`ticket_${b}`);
      if (activeData) {
        const myTicket = JSON.parse(activeData);
        if (myTicket.no === ticketNo) {
          localStorage.removeItem(`ticket_${b}`);
          localStorage.setItem(`ticket_status_${b}`, reason);
          render();
        }
      }
    });

    function autoProcessTicket() {
      const activeData = localStorage.getItem(`ticket_${bank}`);
      if (activeData) { render(); return; }

      localStorage.removeItem(`ticket_status_${bank}`);
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res && res.success) {
          localStorage.setItem(`ticket_${bank}`, JSON.stringify({ no: res.ticketNo, delay: 0 }));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
        } else {
          alert('발권 오류가 발생했습니다.');
          render();
        }
      });
    }

    function render() {
      const app = document.getElementById('app');

      if (!bank) {
        app.innerHTML = `
          <h2 class="text-2xl font-black mb-2">상담 기관 선택</h2>
          <p class="text-xs text-gray-500 mb-6">상담을 원하시는 금융기관을 선택하세요.</p>
          <div class="space-y-3">
            <button onclick="selectBank('우리은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-black rounded-2xl text-lg hover:bg-blue-100 transition shadow-sm">우리은행</button>
            <button onclick="selectBank('신한은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-black rounded-2xl text-lg hover:bg-blue-100 transition shadow-sm">신한은행</button>
            <button onclick="selectBank('국민은행')" class="w-full py-4 bg-blue-50 text-blue-600 font-black rounded-2xl text-lg hover:bg-blue-100 transition shadow-sm">국민은행</button>
            <button onclick="selectBank('푸본현대생명')" class="w-full py-4 bg-blue-50 text-blue-600 font-black rounded-2xl text-lg hover:bg-blue-100 transition shadow-sm">푸본현대생명</button>
          </div>
        `;
        return;
      }

      const activeData = localStorage.getItem(`ticket_${bank}`);
      const finishedStatus = localStorage.getItem(`ticket_status_${bank}`);

      // 상담완료 또는 부재(패스) 시 -> 전 은행 신청 화면 자동 오픈
      if (finishedStatus) {
        const isAbsent = (finishedStatus === '부재중');
        app.innerHTML = `
          <div class="py-2">
            <div class="w-14 h-14 ${isAbsent ? 'bg-rose-50 text-rose-500' : 'bg-emerald-50 text-emerald-500'} rounded-full flex items-center justify-center text-2xl mx-auto mb-3 font-black">
              ${isAbsent ? '✕' : '✓'}
            </div>
            <h2 class="text-2xl font-black text-gray-900 mb-1">
              ${isAbsent ? '대기표가 취소되었습니다' : '상담이 완료되었습니다'}
            </h2>
            <p class="text-xs text-gray-500 mb-5">
              ${isAbsent ? '호출 시 부재로 번호표가 자동 소멸되었습니다.' : `[${bank}] 상담이 정상 종료되었습니다.`}
            </p>

            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4 mb-5 text-left">
              <span class="text-xs font-black text-blue-600 block mb-2">➕ 다른 금융기관 상담 신청하기</span>
              <div class="grid grid-cols-2 gap-2">
                <button onclick="selectBank('우리은행')" class="py-2.5 bg-white border border-gray-200 rounded-xl font-bold text-xs text-gray-700 shadow-sm active:bg-blue-50">우리은행</button>
                <button onclick="selectBank('신한은행')" class="py-2.5 bg-white border border-gray-200 rounded-xl font-bold text-xs text-gray-700 shadow-sm active:bg-blue-50">신한은행</button>
                <button onclick="selectBank('국민은행')" class="py-2.5 bg-white border border-gray-200 rounded-xl font-bold text-xs text-gray-700 shadow-sm active:bg-blue-50">국민은행</button>
                <button onclick="selectBank('푸본현대생명')" class="py-2.5 bg-white border border-gray-200 rounded-xl font-bold text-xs text-gray-700 shadow-sm active:bg-blue-50">푸본현대생명</button>
              </div>
            </div>

            <div class="bg-blue-50/70 border border-blue-100 rounded-2xl p-4 mb-4 text-left">
              <span class="text-[10px] font-bold text-blue-600 bg-white px-2 py-0.5 rounded border border-blue-200">법률 & 등기 전담</span>
              <h3 class="text-sm font-bold text-gray-900 mt-1 mb-1">법무법인 제이엘</h3>
              <p class="text-xs text-gray-600 mb-3 leading-relaxed">분양전환 및 소유권이전등기, 브릿지 대출 관련 전담 법률 지원</p>
              <a href="tel:1899-4252" class="w-full py-3 bg-blue-600 active:bg-blue-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 shadow-sm text-xs">
                📞 분양전환 법률상담: 1899-4252
              </a>
            </div>

            <button onclick="reIssue()" class="w-full py-3 bg-gray-100 text-gray-700 font-bold rounded-xl text-xs">
              ${bank} 새 번호표 다시 뽑기
            </button>
          </div>
        `;
        return;
      }

      if (activeData) {
        const ticket = JSON.parse(activeData);
        app.innerHTML = `
          <span class="inline-block px-3 py-1 bg-blue-50 text-blue-600 font-black rounded-full text-xs mb-3">${bank}</span>
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6 mb-4">
            <p class="text-sm font-bold text-gray-500 mb-1">고객님의 대기 번호</p>
            <div class="text-6xl font-black text-blue-600 my-2">${ticket.no}번</div>
            <div id="waitAheadCount" class="text-xs text-blue-600 font-bold mt-2">대기 순서를 확인하는 중...</div>
          </div>
          
          <div class="flex gap-2">
            <button onclick="delayTicket(${ticket.no})" id="delay-btn" ${ticket.delay >= 3 ? 'disabled class="flex-1 py-3.5 bg-gray-100 text-gray-400 font-bold rounded-xl text-sm cursor-not-allowed"' : 'class="flex-1 py-3.5 bg-amber-50 active:bg-amber-100 text-amber-700 font-bold rounded-xl text-sm"'}>
              순번 미루기 (${ticket.delay}/3)
            </button>
            <button onclick="cancelTicket(${ticket.no})" class="flex-1 py-3.5 bg-red-50 active:bg-red-100 text-red-600 font-bold rounded-xl text-sm">
              대기 취소
            </button>
          </div>
        `;
      }
    }

    function selectBank(name) { window.location.search = `?bank=${encodeURIComponent(name)}`; }

    function delayTicket(ticketNo) {
      let ticket = JSON.parse(localStorage.getItem(`ticket_${bank}`));
      if (ticket.delay >= 3) return alert('순번 미루기는 최대 3회까지만 가능합니다.');
      
      socket.emit('delay_ticket', { bank, ticketNo }, (res) => {
        if (res.success) {
          ticket.delay++;
          localStorage.setItem(`ticket_${bank}`, JSON.stringify(ticket));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
          alert('순번이 맨 뒤로 미뤄졌습니다.');
        }
      });
    }

    function cancelTicket(ticketNo) {
      if (confirm('대기 번호표를 취소하시겠습니까?')) {
        socket.emit('cancel_ticket', { bank, ticketNo }, () => {
          localStorage.removeItem(`ticket_${bank}`);
          localStorage.removeItem(`ticket_status_${bank}`);
          alert('대기표가 정상 취소되었습니다.');
          window.location.href = window.location.pathname;
        });
      }
    }

    function reIssue() {
      localStorage.removeItem(`ticket_status_${bank}`);
      autoProcessTicket();
    }

    socket.on('queue_update', ({ bank: b, data }) => {
      if (b !== bank) return;

      const activeData = localStorage.getItem(`ticket_${bank}`);
      if (!activeData) return;

      const ticket = JSON.parse(activeData);
      const myNumber = ticket.no;
      const myNumberHanja = toHanja(myNumber);

      const myIndex = data.waiting.indexOf(myNumber);
      const waitCountEl = document.getElementById('waitAheadCount');

      if (myIndex > -1) {
        const aheadCount = myIndex;
        if (waitCountEl) {
          if (aheadCount === 0) {
            waitCountEl.innerText = '🔔 곧 고객님 순서입니다! 창구 바로 앞으로 이동해주세요.';
            waitCountEl.className = 'text-xs text-rose-600 font-black mt-2 animate-pulse';
          } else if (aheadCount <= 2) {
            waitCountEl.innerText = `⚠️ 대기 순서 3번째 전입니다 (앞에 ${aheadCount}명 대기)`;
            waitCountEl.className = 'text-xs text-amber-600 font-bold mt-2';
          } else {
            waitCountEl.innerText = `내 앞에 ${aheadCount}명 대기 중`;
            waitCountEl.className = 'text-xs text-blue-600 font-bold mt-2';
          }
        }

        // 3번째 전 사전안내
        if (aheadCount === 2 && !preAlert3rdSent) {
          preAlert3rdSent = true;
          playDingDong(() => {
            speakText(`${myNumberHanja} 번 고객님, 대기 순서 3번째 전입니다. 창구 근처로 이동해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
        }

        // 바로 직전 안내
        if (aheadCount === 0 && !preAlertNextSent) {
          preAlertNextSent = true;
          playDingDong(() => {
            speakText(`곧 ${myNumberHanja} 번 고객님 상담 순번입니다. 창구 바로 앞에서 대기해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        }
      }

      // 창구에서 호출 시
      const calledDesk = data.desks.find(d => d.current === myNumber);
      if (calledDesk) {
        const dNum = calledDesk.name.replace(/[^0-9]/g, '');
        const dHanja = dNum ? toHanja(dNum) + ' 번 창구' : calledDesk.name;

        playDingDong(() => {
          speakText(`${bank} ${dHanja}, ${myNumberHanja} 번 고객님 창구로 와주시기 바랍니다.`);
        });
        if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
        
        document.getElementById('app').innerHTML = `
          <div class="py-4">
            <span class="inline-block px-3 py-1 bg-red-100 text-red-600 font-black rounded-full text-xs mb-3 animate-pulse">● 지금 호출 중입니다</span>
            <div class="text-6xl font-black text-blue-600 my-2">${myNumber}번</div>
            <div class="bg-blue-50 border-2 border-blue-500 rounded-2xl p-5 my-4">
              <p class="text-xs font-bold text-gray-500">${bank}</p>
              <h2 class="text-2xl font-black text-blue-700 mt-1">${calledDesk.name}로 오십시오!</h2>
            </div>
            <p class="text-xs text-gray-500 font-medium">담당 상담사가 창구에서 기다리고 있습니다.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
