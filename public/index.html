<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>스마트 대기 순번표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #0f172a; -webkit-font-smoothing: antialiased; }
    .toss-card { background: #ffffff; border-radius: 32px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.08); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4 md:p-8" onclick="initCustomerAudioAndWakeLock()">
  <div class="w-full max-w-lg">
    <div id="app" class="toss-card p-6 md:p-10 text-center border border-slate-200">
      <div class="py-16">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
        <p class="text-lg font-black text-slate-700">번호표를 확인하는 중입니다...</p>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);
    const bankKeyMap = { 'woori': '우리은행', 'shinhan': '신한은행', 'kb': '국민은행', 'fubon': '푸본현대생명' };
    const rawParam = params.get('b') || params.get('bank');
    let bank = bankKeyMap[rawParam] || (rawParam ? decodeURIComponent(rawParam).trim() : null);

    let preAlert3rdSent = false;
    let preAlertNextSent = false;
    let audioCtx = null;
    let silentAudio = null;
    let wakeLock = null;
    let hasProcessed = false;

    function toHanja(raw) {
      const num = parseInt(raw, 10);
      if (isNaN(num) || num <= 0) return raw;
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return digits[num];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return (t === 1 ? '십' : digits[t] + '십') + (o > 0 ? digits[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100), r = num % 100, t = Math.floor(r / 10), o = r % 10;
        return (h === 1 ? '백' : digits[h] + '백') + (t > 0 ? (t === 1 ? '십' : digits[t] + '십') : '') + (o > 0 ? digits[o] : '');
      }
      return num;
    }

    // 고객 폰 슬립모드 방지 (WakeLock + Silent Audio Hack)
    function initCustomerAudioAndWakeLock() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!silentAudio) {
        silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        silentAudio.loop = true;
        silentAudio.play().catch(() => {});
      }

      if ('wakeLock' in navigator && !wakeLock) {
        navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }).catch(() => {});
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        initCustomerAudioAndWakeLock();
        socket.emit('get_all_state');
      }
    });

    function playDingDong(cb) {
      initCustomerAudioAndWakeLock();
      try {
        const now = audioCtx.currentTime;
        const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(784, now);
        g1.gain.setValueAtTime(0.4, now); g1.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
        o1.connect(g1); g1.connect(audioCtx.destination);
        o1.start(now); o1.stop(now + 0.5);

        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(523.25, now + 0.28);
        g2.gain.setValueAtTime(0.45, now + 0.28); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(now + 0.28); o2.stop(now + 0.9);

        if (cb) setTimeout(cb, 750);
      } catch (e) {
        if (cb) cb();
      }
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance("... " + text);
        msg.lang = 'ko-KR'; msg.rate = 0.92; msg.volume = 1.0;
        window.speechSynthesis.speak(msg);
      }
    }

    socket.on('connect', () => {
      if (bank && !hasProcessed) {
        hasProcessed = true;
        autoProcessTicket();
      } else if (!bank) {
        render();
      }
    });

    socket.on('ticket_finished', ({ bank: b, ticketNo, reason }) => {
      const activeData = localStorage.getItem(`ticket_${b}`);
      if (activeData) {
        const myTicket = JSON.parse(activeData);
        if (myTicket.no === ticketNo) {
          localStorage.removeItem(`ticket_${b}`);
          localStorage.setItem(`ticket_status_${b}`, reason);
          render();
        }
      }
    });

    function autoProcessTicket() {
      const activeData = localStorage.getItem(`ticket_${bank}`);
      if (activeData) { render(); return; }

      localStorage.removeItem(`ticket_status_${bank}`);
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res && res.success) {
          localStorage.setItem(`ticket_${bank}`, JSON.stringify({ no: res.ticketNo, delay: 0 }));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
        } else {
          alert('발권 오류가 발생했습니다.');
          render();
        }
      });
    }

    function render() {
      const app = document.getElementById('app');

      if (!bank) {
        app.innerHTML = `
          <h2 class="text-3xl font-black mb-3">상담 기관 선택</h2>
          <p class="text-sm text-slate-500 mb-8 font-semibold">상담을 원하시는 금융기관을 터치하세요.</p>
          <div class="space-y-4">
            <button onclick="selectBank('woori')" class="w-full py-5 bg-blue-50 text-blue-600 font-black rounded-2xl text-xl hover:bg-blue-100 transition shadow-sm">우리은행</button>
            <button onclick="selectBank('shinhan')" class="w-full py-5 bg-blue-50 text-blue-600 font-black rounded-2xl text-xl hover:bg-blue-100 transition shadow-sm">신한은행</button>
            <button onclick="selectBank('kb')" class="w-full py-5 bg-blue-50 text-blue-600 font-black rounded-2xl text-xl hover:bg-blue-100 transition shadow-sm">국민은행</button>
            <button onclick="selectBank('fubon')" class="w-full py-5 bg-blue-50 text-blue-600 font-black rounded-2xl text-xl hover:bg-blue-100 transition shadow-sm">푸본현대생명</button>
          </div>
        `;
        return;
      }

      const activeData = localStorage.getItem(`ticket_${bank}`);
      const finishedStatus = localStorage.getItem(`ticket_status_${bank}`);

      if (finishedStatus) {
        const isAbsent = (finishedStatus === '부재중');
        app.innerHTML = `
          <div class="py-4">
            <div class="w-16 h-16 ${isAbsent ? 'bg-rose-50 text-rose-500' : 'bg-emerald-50 text-emerald-500'} rounded-full flex items-center justify-center text-3xl mx-auto mb-4 font-black">
              ${isAbsent ? '✕' : '✓'}
            </div>
            <h2 class="text-3xl font-black text-slate-900 mb-2">
              ${isAbsent ? '대기표가 취소되었습니다' : '상담이 완료되었습니다'}
            </h2>
            <p class="text-sm text-slate-500 mb-6 font-medium">
              ${isAbsent ? '호출 시 부재로 인해 번호표가 자동 소멸되었습니다.' : `[${bank}] 상담이 정상적으로 마감되었습니다.`}
            </p>

            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 mb-6 text-left">
              <span class="text-sm font-black text-blue-600 block mb-3">➕ 다른 금융기관 추가 상담 신청</span>
              <div class="grid grid-cols-2 gap-2.5">
                <button onclick="selectBank('woori')" class="py-3 bg-white border border-slate-300 rounded-xl font-black text-sm text-slate-800 shadow-sm active:bg-blue-50">우리은행</button>
                <button onclick="selectBank('shinhan')" class="py-3 bg-white border border-slate-300 rounded-xl font-black text-sm text-slate-800 shadow-sm active:bg-blue-50">신한은행</button>
                <button onclick="selectBank('kb')" class="py-3 bg-white border border-slate-300 rounded-xl font-black text-sm text-slate-800 shadow-sm active:bg-blue-50">국민은행</button>
                <button onclick="selectBank('fubon')" class="py-3 bg-white border border-slate-300 rounded-xl font-black text-sm text-slate-800 shadow-sm active:bg-blue-50">푸본현대생명</button>
              </div>
            </div>

            <div class="bg-blue-50/80 border border-blue-200 rounded-2xl p-5 mb-5 text-left">
              <span class="text-[11px] font-black text-blue-600 bg-white px-2.5 py-0.5 rounded border border-blue-200">법률 & 등기 전담</span>
              <h3 class="text-base font-black text-slate-900 mt-1 mb-1">법무법인 제이엘</h3>
              <p class="text-xs text-slate-600 mb-3 leading-relaxed">분양전환 및 소유권이전등기, 브릿지 대출 관련 전담 법률 지원</p>
              <a href="tel:1899-4252" class="w-full py-3.5 bg-blue-600 active:bg-blue-700 text-white font-black rounded-xl flex items-center justify-center gap-2 shadow-sm text-sm">
                📞 법률상담 직통: 1899-4252
              </a>
            </div>

            <button onclick="reIssue()" class="w-full py-4 bg-slate-100 active:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm">
              ${bank} 새 번호표 다시 뽑기
            </button>
          </div>
        `;
        return;
      }

      if (activeData) {
        const ticket = JSON.parse(activeData);
        app.innerHTML = `
          <span class="inline-block px-4 py-1.5 bg-blue-50 text-blue-600 font-black rounded-full text-sm mb-4">${bank}</span>
          <div class="bg-slate-50 border-2 border-slate-200 rounded-3xl p-6 md:p-8 mb-6">
            <p class="text-base font-bold text-slate-500 mb-1">고객님의 대기 번호</p>
            <div class="text-7xl md:text-8xl font-black text-blue-600 my-2 tracking-tight">${ticket.no}번</div>
            <div id="waitAheadCount" class="text-sm text-blue-600 font-black mt-2">대기 순서를 확인하고 있습니다...</div>
          </div>
          
          <div class="flex gap-3">
            <button onclick="delayTicket(${ticket.no})" id="delay-btn" ${ticket.delay >= 3 ? 'disabled class="flex-1 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl text-base cursor-not-allowed"' : 'class="flex-1 py-4 bg-amber-50 active:bg-amber-100 text-amber-700 font-bold rounded-2xl text-base border border-amber-200"'}>
              순번 미루기 (${ticket.delay}/3)
            </button>
            <button onclick="cancelTicket(${ticket.no})" class="flex-1 py-4 bg-rose-50 active:bg-rose-100 text-rose-600 font-bold rounded-2xl text-base border border-rose-200">
              대기 취소
            </button>
          </div>
        `;
      }
    }

    function selectBank(code) { window.location.search = `?b=${code}`; }

    function delayTicket(ticketNo) {
      let ticket = JSON.parse(localStorage.getItem(`ticket_${bank}`));
      if (ticket.delay >= 3) return alert('순번 미루기는 최대 3회까지만 가능합니다.');
      
      socket.emit('delay_ticket', { bank, ticketNo }, (res) => {
        if (res.success) {
          ticket.delay++;
          localStorage.setItem(`ticket_${bank}`, JSON.stringify(ticket));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
          alert('순번이 맨 뒤로 미뤄졌습니다.');
        }
      });
    }

    function cancelTicket(ticketNo) {
      if (confirm('대기 번호표를 취소하시겠습니까?')) {
        socket.emit('cancel_ticket', { bank, ticketNo }, () => {
          localStorage.removeItem(`ticket_${bank}`);
          localStorage.removeItem(`ticket_status_${bank}`);
          alert('대기표가 취소되었습니다.');
          window.location.href = window.location.pathname;
        });
      }
    }

    function reIssue() {
      localStorage.removeItem(`ticket_status_${bank}`);
      autoProcessTicket();
    }

    socket.on('queue_update', ({ bank: b, data }) => {
      if (b !== bank) return;

      const activeData = localStorage.getItem(`ticket_${bank}`);
      if (!activeData) return;

      const ticket = JSON.parse(activeData);
      const myNumber = ticket.no;
      const myNumberHanja = toHanja(myNumber);

      const myIndex = data.waiting.indexOf(myNumber);
      const waitCountEl = document.getElementById('waitAheadCount');

      if (myIndex > -1) {
        const aheadCount = myIndex;
        if (waitCountEl) {
          if (aheadCount === 0) {
            waitCountEl.innerText = '🔔 곧 고객님 차례입니다! 창구 바로 앞으로 이동하세요.';
            waitCountEl.className = 'text-base text-rose-600 font-black mt-2 animate-pulse';
          } else if (aheadCount <= 2) {
            waitCountEl.innerText = `⚠️ 대기 순서 3번째 전입니다 (앞에 ${aheadCount}명 대기)`;
            waitCountEl.className = 'text-sm text-amber-600 font-black mt-2';
          } else {
            waitCountEl.innerText = `내 앞에 ${aheadCount}명 대기 중`;
            waitCountEl.className = 'text-sm text-blue-600 font-black mt-2';
          }
        }

        // 3번째 전 사전안내
        if (aheadCount === 2 && !preAlert3rdSent) {
          preAlert3rdSent = true;
          playDingDong(() => {
            speakText(`${myNumberHanja} 번 고객님, 대기 순서 3번째 전입니다. 창구 근처로 이동해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        }

        // 바로 직전 안내
        if (aheadCount === 0 && !preAlertNextSent) {
          preAlertNextSent = true;
          playDingDong(() => {
            speakText(`곧 ${myNumberHanja} 번 고객님 상담 순번입니다. 창구 바로 앞에서 대기해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
        }
      }

      // 창구에서 호출 시
      const calledDesk = data.desks.find(d => d.current === myNumber);
      if (calledDesk) {
        const dNum = calledDesk.name.replace(/[^0-9]/g, '');
        const dHanja = dNum ? toHanja(dNum) + ' 번 창구' : calledDesk.name;

        playDingDong(() => {
          speakText(`${bank} ${dHanja}, ${myNumberHanja} 번 고객님 창구로 와주시기 바랍니다.`);
        });
        if (navigator.vibrate) navigator.vibrate([600, 200, 600, 200, 600]);
        
        document.getElementById('app').innerHTML = `
          <div class="py-4">
            <span class="inline-block px-4 py-1.5 bg-rose-100 text-rose-600 font-black rounded-full text-sm mb-3 animate-pulse">● 지금 호출 중입니다</span>
            <div class="text-7xl font-black text-blue-600 my-2">${myNumber}번</div>
            <div class="bg-blue-50 border-3 border-blue-500 rounded-3xl p-6 my-5">
              <p class="text-sm font-bold text-slate-500">${bank}</p>
              <h2 class="text-3xl font-black text-blue-700 mt-1">${calledDesk.name}로 오십시오!</h2>
            </div>
            <p class="text-sm text-slate-500 font-bold">담당 상담사가 창구에서 기다리고 있습니다.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
