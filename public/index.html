<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>스마트 번호표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .calling-animation { animation: pulse-ring 1.5s infinite ease-in-out; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col justify-between min-h-screen p-4 select-none">

  <div id="screen-waiting" class="flex flex-col items-center justify-between h-full flex-1">
    <div class="w-full text-center mt-4">
      <div id="bank-badge" class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-3 py-1 rounded-full mb-2">
        우리은행
      </div>
      <h1 class="text-xl font-bold text-gray-700">모바일 대기표</h1>
    </div>

    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-6 text-center border border-gray-100">
      <p class="text-sm text-gray-500 font-medium">내 번호표</p>
      <div class="text-6xl font-extrabold text-blue-600 my-3" id="my-number">-</div>
      <p class="text-xs text-gray-400">발권 완료</p>

      <div class="mt-6 pt-4 border-t border-gray-100 grid grid-cols-2 gap-4">
        <div>
          <p class="text-xs text-gray-500">전체 대기</p>
          <p class="text-xl font-bold text-gray-700" id="total-wait-count">-</p>
        </div>
        <div>
          <p class="text-xs text-gray-500">내 앞 대기자</p>
          <p class="text-xl font-bold text-red-500" id="waiting-count">-</p>
        </div>
      </div>
    </div>

    <div class="w-full max-w-sm flex flex-col gap-3 mb-4">
      <button 
        id="btn-delay" 
        onclick="delayOrder()" 
        class="w-full py-3.5 bg-gray-800 hover:bg-gray-900 active:scale-95 text-white font-semibold rounded-xl shadow-md transition flex items-center justify-center gap-2">
        <span>순서 3칸 뒤로 미루기</span>
        <span id="delay-badge" class="bg-yellow-400 text-gray-900 text-xs px-2 py-0.5 rounded-full font-bold">남은 3회</span>
      </button>
    </div>
  </div>

  <div id="screen-called" class="fixed inset-0 bg-blue-600 z-50 hidden flex-col items-center justify-center p-6 text-white text-center">
    <div class="calling-animation w-24 h-24 bg-white/20 rounded-full flex items-center justify-center mb-6">
      <svg class="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
      </svg>
    </div>

    <p class="text-2xl font-light opacity-90 mb-1">고객님의 차례입니다!</p>
    <div class="text-7xl font-black tracking-tight my-2" id="called-number">-</div>
    
    <div class="bg-white text-gray-900 px-6 py-4 rounded-2xl shadow-2xl mt-4 w-full max-w-xs">
      <p class="text-sm font-semibold text-gray-500">배정 창구</p>
      <p class="text-3xl font-extrabold text-blue-600 mt-1" id="counter-info">-</p>
    </div>

    <p class="text-sm text-blue-100 mt-6 animate-pulse">해당 창구로 이동해주세요.</p>

    <button onclick="closeCallPopup()" class="mt-8 px-6 py-2.5 bg-white/10 hover:bg-white/20 border border-white/30 rounded-xl text-xs font-semibold">
      확인 (닫기)
    </button>
  </div>

  <script>
    const socket = io();
    let myTicket = null;

    window.addEventListener('load', () => {
      socket.emit('issue_ticket');
    });

    socket.on('ticket_issued', (data) => {
      myTicket = data.ticketNo;
      document.getElementById('my-number').innerText = myTicket;
      document.getElementById('waiting-count').innerText = `${data.order - 1}명`;
    });

    function delayOrder() {
      if (!myTicket) return;
      socket.emit('delay_order', { ticketNo: myTicket });
    }

    socket.on('order_delayed', (data) => {
      document.getElementById('delay-badge').innerText = `남은 ${data.delayCount}회`;
      document.getElementById('waiting-count').innerText = `${data.newOrder - 1}명`;
      if (data.delayCount === 0) {
        const btn = document.getElementById('btn-delay');
        btn.disabled = true;
        btn.classList.add('bg-gray-400', 'cursor-not-allowed');
      }
    });

    socket.on('customer_called', (data) => {
      if ("vibrate" in navigator) {
        navigator.vibrate([300, 150, 300, 150, 500]);
      }
      playAlarmSound();
      document.getElementById('counter-info').innerText = `${data.counterId}번 창구 (${data.bankName})`;
      document.getElementById('called-number').innerText = `${data.ticketNo}번`;
      document.getElementById('screen-called').classList.remove('hidden');
      document.getElementById('screen-called').classList.add('flex');
    });

    socket.on('state_update', (data) => {
      document.getElementById('bank-badge').innerText = data.bankName;
      document.getElementById('total-wait-count').innerText = `${data.totalWaiting}명`;
      if (myTicket) {
        const myPos = data.queueList.findIndex(q => q.ticketNo === myTicket);
        if (myPos !== -1) {
          document.getElementById('waiting-count').innerText = `${myPos}명`;
        }
      }
    });

    socket.on('error_msg', (msg) => alert(msg));

    function playAlarmSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    }

    function closeCallPopup() {
      document.getElementById('screen-called').classList.add('hidden');
      document.getElementById('screen-called').classList.remove('flex');
    }
  </script>
</body>
</html>
