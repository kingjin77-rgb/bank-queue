<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>스마트 대기 순번표</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    body { background-color: #030712; color: #f8fafc; padding: 16px; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .client-card { width: 100%; max-width: 520px; background: #0b0f19; border: 3px solid var(--theme-color, #38bdf8); border-radius: 32px; padding: 28px 22px; box-shadow: 0 0 35px var(--theme-glow, rgba(56, 189, 248, 0.25)); text-align: center; }

    .bank-woori { --theme-color: #00a2ed; --theme-glow: rgba(0, 162, 237, 0.4); --btn-bg: #0067ac; }
    .bank-shinhan { --theme-color: #38bdf8; --theme-glow: rgba(0, 70, 255, 0.4); --btn-bg: #0046ff; }
    .bank-kb { --theme-color: #ffbc00; --theme-glow: rgba(255, 188, 0, 0.4); --btn-bg: #ffbc00; }
    .bank-fubon { --theme-color: #38bdf8; --theme-glow: rgba(0, 132, 199, 0.4); --btn-bg: #0084c7; }

    .brand-pill { display: inline-block; font-size: 16px; font-weight: 900; color: #fff; background: var(--btn-bg, #1e3a8a); padding: 6px 20px; border-radius: 9999px; border: 2px solid var(--theme-color, #38bdf8); margin-bottom: 16px; }
    .led-board { background: #000; border: 3px solid var(--theme-color, #38bdf8); border-radius: 26px; padding: 28px 16px; margin: 18px 0; }
    .led-num { font-size: clamp(84px, 18vw, 120px); font-weight: 900; color: var(--theme-color, #38bdf8); line-height: 1; text-shadow: 0 0 25px var(--theme-glow, rgba(56, 189, 248, 0.6)); }

    .btn-group { display: flex; gap: 10px; margin-top: 14px; }
    .btn-act { flex: 1; height: 65px; border-radius: 18px; font-size: 17px; font-weight: 900; cursor: pointer; border: 2px solid transparent; }
    .btn-delay { background: #d97706; color: #fff; border-color: #f59e0b; }
    .btn-cancel { background: #7f1d1d; color: #fecaca; border-color: #dc2626; }

    .bank-select-btn { width: 100%; height: 75px; font-size: 22px; font-weight: 900; color: #fff; border-radius: 20px; border: 2px solid #374151; background: #111827; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body onclick="ensureCustomerAudio()">
  <div id="clientCard" class="client-card bank-woori">
    <div id="app">
      <div style="padding: 40px 0;">
        <div style="font-size: 20px; font-weight: 900; color: #38bdf8;">대기 순번을 확인 중입니다...</div>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    const params = new URLSearchParams(window.location.search);

    const bankKeyMap = {
      'woori': '우리은행',
      'shinhan': '신한은행',
      'kb': '국민은행',
      'fubon': '푸본현대생명'
    };

    const rawParam = params.get('b') || params.get('bank');
    let bank = null;

    if (rawParam) {
      const clean = decodeURIComponent(rawParam).trim();
      bank = bankKeyMap[clean.toLowerCase()] || clean;
    }

    let audioCtx = null;
    let wakeLock = null;
    let keepAliveOsc = null;
    let preAlert3rdSent = false;
    let preAlertNextSent = false;
    let hasProcessed = false;

    // 해당 은행 테마 자동 설정
    const cardEl = document.getElementById('clientCard');
    if (bank === '신한은행') cardEl.className = 'client-card bank-shinhan';
    else if (bank === '국민은행') cardEl.className = 'client-card bank-kb';
    else if (bank === '푸본현대생명') cardEl.className = 'client-card bank-fubon';
    else if (bank === '우리은행') cardEl.className = 'client-card bank-woori';

    function toHanja(raw) {
      const num = parseInt(raw, 10);
      if (isNaN(num) || num <= 0) return raw;
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return digits[num];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return (t === 1 ? '십' : digits[t] + '십') + (o > 0 ? digits[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100), r = num % 100, t = Math.floor(r / 10), o = r % 10;
        return (h === 1 ? '백' : digits[h] + '백') + (t > 0 ? (t === 1 ? '십' : digits[t] + '십') : '') + (o > 0 ? digits[o] : '');
      }
      return num;
    }

    async function ensureCustomerAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();

      if (!keepAliveOsc) {
        keepAliveOsc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        keepAliveOsc.frequency.value = 15;
        g.gain.value = 0.001;
        keepAliveOsc.connect(g);
        g.connect(audioCtx.destination);
        keepAliveOsc.start();
      }

      if ('wakeLock' in navigator && !wakeLock) {
        try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
      }
    }

    ['click', 'touchstart', 'touchend'].forEach(evt => window.addEventListener(evt, ensureCustomerAudio, { once: true }));

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        ensureCustomerAudio();
        socket.emit('get_all_state');
      }
    });

    function playDingDong(cb) {
      ensureCustomerAudio();
      try {
        const t = audioCtx.currentTime;
        const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(784, t);
        g1.gain.setValueAtTime(0.5, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        o1.connect(g1); g1.connect(audioCtx.destination);
        o1.start(t); o1.stop(t + 0.45);

        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(523.25, t + 0.25);
        g2.gain.setValueAtTime(0.55, t + 0.25); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(t + 0.25); o2.stop(t + 0.85);

        if (cb) setTimeout(cb, 750);
      } catch (e) {
        if (cb) cb();
      }
    }

    function speakCustomer(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("... " + text);
      u.lang = 'ko-KR'; u.rate = 0.92; u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }

    socket.on('connect', () => {
      if (bank && !hasProcessed) {
        hasProcessed = true;
        autoProcessTicket();
      } else if (!bank) {
        render();
      }
    });

    socket.on('ticket_finished', ({ bank: b, ticketNo, reason }) => {
      const activeData = localStorage.getItem(`ticket_${b}`);
      if (activeData) {
        const myTicket = JSON.parse(activeData);
        if (myTicket.no === ticketNo) {
          localStorage.removeItem(`ticket_${b}`);
          localStorage.setItem(`ticket_status_${b}`, reason);
          render();
        }
      }
    });

    function autoProcessTicket() {
      const activeData = localStorage.getItem(`ticket_${bank}`);
      if (activeData) { render(); return; }

      localStorage.removeItem(`ticket_status_${bank}`);
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res && res.success) {
          localStorage.setItem(`ticket_${bank}`, JSON.stringify({ no: res.ticketNo, delay: 0 }));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
        } else {
          alert('발권 오류가 발생했습니다.');
          render();
        }
      });
    }

    function render() {
      const app = document.getElementById('app');

      if (!bank) {
        app.innerHTML = `
          <h2 style="font-size: 26px; font-weight: 900; margin-bottom: 8px;">상담 기관 선택</h2>
          <p style="font-size: 14px; color: #94a3b8; margin-bottom: 24px;">원하시는 금융기관을 터치하세요.</p>
          <div>
            <button onclick="selectBank('woori')" class="bank-select-btn" style="border-color: #00a2ed;">🏦 우리은행</button>
            <button onclick="selectBank('shinhan')" class="bank-select-btn" style="border-color: #0046ff;">🏦 신한은행</button>
            <button onclick="selectBank('kb')" class="bank-select-btn" style="border-color: #ffbc00; color: #ffd15c;">🏦 국민은행</button>
            <button onclick="selectBank('fubon')" class="bank-select-btn" style="border-color: #0084c7;">🏦 푸본현대생명</button>
          </div>
        `;
        return;
      }

      const activeData = localStorage.getItem(`ticket_${bank}`);
      const finishedStatus = localStorage.getItem(`ticket_status_${bank}`);

      if (finishedStatus) {
        const isAbsent = (finishedStatus === '부재중');
        app.innerHTML = `
          <div style="padding: 10px 0;">
            <div style="font-size: 50px; margin-bottom: 8px;">${isAbsent ? '✕' : '✓'}</div>
            <h2 style="font-size: 28px; font-weight: 900; margin-bottom: 6px;">
              ${isAbsent ? '대기표가 취소되었습니다' : '상담이 완료되었습니다'}
            </h2>
            <p style="font-size: 14px; color: #94a3b8; margin-bottom: 24px;">
              ${isAbsent ? '호출 시 부재로 인해 번호표가 자동 소멸되었습니다.' : `[${bank}] 상담이 정상 종료되었습니다.`}
            </p>

            <div style="background: #000; border: 2px solid #1f2937; border-radius: 20px; padding: 18px; margin-bottom: 20px; text-align: left;">
              <span style="font-size: 15px; font-weight: 900; color: var(--theme-color, #38bdf8); display: block; margin-bottom: 12px;">➕ 다른 금융기관 추가 상담 신청</span>
              <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                <button onclick="selectBank('woori')" style="height: 52px; background:#111827; border:2px solid #00a2ed; color:#fff; font-weight:900; border-radius:14px;">우리은행</button>
                <button onclick="selectBank('shinhan')" style="height: 52px; background:#111827; border:2px solid #0046ff; color:#fff; font-weight:900; border-radius:14px;">신한은행</button>
                <button onclick="selectBank('kb')" style="height: 52px; background:#111827; border:2px solid #ffbc00; color:#ffd15c; font-weight:900; border-radius:14px;">국민은행</button>
                <button onclick="selectBank('fubon')" style="height: 52px; background:#111827; border:2px solid #0084c7; color:#fff; font-weight:900; border-radius:14px;">푸본현대생명</button>
              </div>
            </div>

            <button onclick="reIssue()" style="width: 100%; height: 60px; background: #1f2937; color: #fff; font-size: 17px; font-weight: 900; border-radius: 16px; border: 1px solid #374151;">
              ${bank} 새 번호표 다시 뽑기
            </button>
          </div>
        `;
        return;
      }

      if (activeData) {
        const ticket = JSON.parse(activeData);
        app.innerHTML = `
          <span class="brand-pill">${bank}</span>
          <div class="led-board">
            <p style="font-size: 16px; font-weight: 800; color: #94a3b8; margin-bottom: 4px;">고객님의 대기 번호</p>
            <div class="led-num">${ticket.no}번</div>
            <div id="waitAheadCount" style="font-size: 16px; font-weight: 900; color: var(--theme-color, #38bdf8); margin-top: 8px;">대기 순서를 조회하고 있습니다...</div>
          </div>
          
          <div class="btn-group">
            <button onclick="delayTicket(${ticket.no})" id="delay-btn" ${ticket.delay >= 3 ? 'disabled style="opacity: 0.4;"' : ''} class="btn-act btn-delay">
              순번 미루기 (${ticket.delay}/3)
            </button>
            <button onclick="cancelTicket(${ticket.no})" class="btn-act btn-cancel">
              대기 취소
            </button>
          </div>
        `;
      }
    }

    function selectBank(code) { window.location.search = `?b=${code}`; }

    function delayTicket(ticketNo) {
      let ticket = JSON.parse(localStorage.getItem(`ticket_${bank}`));
      if (ticket.delay >= 3) return alert('순번 미루기는 최대 3회까지만 가능합니다.');

      socket.emit('delay_ticket', { bank, ticketNo: Number(ticketNo) }, (res) => {
        if (res && res.success) {
          ticket.delay++;
          localStorage.setItem(`ticket_${bank}`, JSON.stringify(ticket));
          preAlert3rdSent = false;
          preAlertNextSent = false;
          render();
          alert('순번이 맨 뒤로 미뤄졌습니다.');
        }
      });
    }

    function cancelTicket(ticketNo) {
      if (confirm('대기 번호표를 취소하시겠습니까?')) {
        socket.emit('cancel_ticket', { bank, ticketNo: Number(ticketNo) }, () => {
          localStorage.removeItem(`ticket_${bank}`);
          localStorage.removeItem(`ticket_status_${bank}`);
          alert('대기표가 취소되었습니다.');
          window.location.href = window.location.pathname;
        });
      }
    }

    function reIssue() {
      localStorage.removeItem(`ticket_status_${bank}`);
      autoProcessTicket();
    }

    socket.on('queue_update', ({ bank: b, data }) => {
      if (b !== bank) return;

      const activeData = localStorage.getItem(`ticket_${bank}`);
      if (!activeData) return;

      const ticket = JSON.parse(activeData);
      const myNumber = ticket.no;
      const myNumberHanja = toHanja(myNumber);

      const myIndex = data.waiting.indexOf(myNumber);
      const waitCountEl = document.getElementById('waitAheadCount');

      if (myIndex > -1) {
        const aheadCount = myIndex;
        if (waitCountEl) {
          if (aheadCount === 0) {
            waitCountEl.innerText = '🔔 곧 고객님 순서입니다! 창구 바로 앞으로 이동하세요.';
            waitCountEl.style.color = '#ef4444';
          } else if (aheadCount <= 2) {
            waitCountEl.innerText = `⚠️ 대기 순서 3번째 전입니다 (앞에 ${aheadCount}명 대기)`;
            waitCountEl.style.color = '#f59e0b';
          } else {
            waitCountEl.innerText = `내 앞에 ${aheadCount}명 대기 중`;
            waitCountEl.style.color = 'var(--theme-color, #38bdf8)';
          }
        }

        if (aheadCount === 2 && !preAlert3rdSent) {
          preAlert3rdSent = true;
          playDingDong(() => {
            speakCustomer(`${myNumberHanja} 번 고객님, 대기 순서 3번째 전입니다. 창구 근처로 이동해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
        }

        if (aheadCount === 0 && !preAlertNextSent) {
          preAlertNextSent = true;
          playDingDong(() => {
            speakCustomer(`곧 ${myNumberHanja} 번 고객님 상담 순번입니다. 창구 바로 앞에서 대기해 주세요.`);
          });
          if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
        }
      }

      const calledDesk = data.desks.find(d => d.current === myNumber);
      if (calledDesk) {
        const dNum = calledDesk.name.replace(/[^0-9]/g, '');
        const dHanja = dNum ? toHanja(dNum) + ' 번 창구' : calledDesk.name;

        playDingDong(() => {
          speakCustomer(`${bank}, ${myNumberHanja} 번 고객님, ${dHanja}로 와주시기 바랍니다.`);
        });
        if (navigator.vibrate) navigator.vibrate([600, 200, 600, 200, 600]);

        document.getElementById('app').innerHTML = `
          <div style="padding: 10px 0;">
            <span style="display:inline-block; font-size:16px; font-weight:900; background:#991b1b; color:#fff; padding:6px 20px; border-radius:30px; margin-bottom:14px; border:2px solid #ef4444;">● 지금 호출 중입니다</span>
            <div class="led-num" style="color: #ef4444; text-shadow: 0 0 30px rgba(239,68,68,0.7);">${myNumber}번</div>
            <div style="background:#000; border:3px solid var(--theme-color, #38bdf8); border-radius:24px; padding:22px; margin:20px 0;">
              <p style="font-size:15px; color:#94a3b8; font-weight:800;">${bank}</p>
              <h2 style="font-size:32px; font-weight:900; color:#fff; margin-top:4px;">${calledDesk.name}로 오십시오!</h2>
            </div>
            <p style="font-size:16px; font-weight:800; color:#94a3b8;">담당 상담사가 창구에서 기다리고 있습니다.</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
