<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 관리자 모니터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; }
    .toss-card { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 상단 헤더 & 음성 테스트 -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
      <div>
        <h1 class="text-2xl font-black text-gray-900 flex items-center gap-2">
          🏦 통합 대기 현황 관리 모니터
        </h1>
        <p class="text-xs text-gray-500 mt-1">현장 스마트태그/QR 발권 및 각 은행별 실시간 상태를 관제합니다.</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="testVoice()" class="px-4 py-2.5 bg-blue-50 active:bg-blue-100 text-blue-600 font-bold rounded-xl text-sm border border-blue-100 transition flex items-center gap-1.5">
          🔊 음성 안내 테스트
        </button>
        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-2 rounded-xl border border-emerald-100">
          ● 음성 엔진 가동 중
        </span>
      </div>
    </div>

    <!-- 1. 스마트폰 미소지자 현장 대리 발권 데스크 (원클릭 발권) -->
    <div class="toss-card p-6 border border-gray-100">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-lg font-bold text-gray-800">📋 현장 대리 발권 (스마트폰 미소지자용)</h2>
          <p class="text-xs text-gray-400">버튼을 누르면 즉시 해당 은행의 번호표가 1장 발권됩니다.</p>
        </div>
      </div>
      <div id="proxyIssueGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 2. 은행별 실시간 전광판 & 상담 상태 현황 -->
    <div>
      <h2 class="text-lg font-bold text-gray-800 mb-3 px-1">📊 실시간 창구 현황 모니터</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="boardGrid">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 3. 시스템 설정 (은행 추가 / 상담사 추가 / 대기열 초기화) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      
      <!-- 은행 추가 -->
      <div class="toss-card p-6 border border-gray-100">
        <h3 class="font-bold text-gray-800 mb-2">➕ 신규 은행 창구 추가</h3>
        <p class="text-xs text-gray-400 mb-4">새로운 은행이나 기관 창구를 추가합니다.</p>
        <div class="flex gap-2">
          <input type="text" id="newBankName" placeholder="은행/기관명 입력" class="flex-1 p-3 bg-gray-50 rounded-xl text-sm border border-gray-200 font-semibold outline-none focus:border-blue-500">
          <button onclick="addNewBank()" class="px-4 py-3 bg-gray-900 text-white font-bold rounded-xl text-sm hover:bg-black">추가</button>
        </div>
      </div>

      <!-- 상담사 추가 -->
      <div class="toss-card p-6 border border-gray-100">
        <h3 class="font-bold text-gray-800 mb-2">👤 창구별 상담사 추가</h3>
        <p class="text-xs text-gray-400 mb-4">지정 은행에 담당 상담사를 배정합니다.</p>
        <div class="space-y-2">
          <select id="staffTargetBank" class="w-full p-3 bg-gray-50 rounded-xl text-sm font-bold border border-gray-200 outline-none">
            <!-- 동적 은행 목록 -->
          </select>
          <div class="flex gap-2">
            <input type="text" id="newStaffName" placeholder="상담사명 (예: 창구2)" class="flex-1 p-3 bg-gray-50 rounded-xl text-sm border border-gray-200 font-semibold outline-none focus:border-blue-500">
            <button onclick="addNewStaff()" class="px-4 py-3 bg-blue-600 text-white font-bold rounded-xl text-sm hover:bg-blue-700">등록</button>
          </div>
        </div>
      </div>

      <!-- 번호 초기화 -->
      <div class="toss-card p-6 border border-gray-100">
        <h3 class="font-bold text-gray-800 mb-2">🔄 번호표 초기화 (1번 리셋)</h3>
        <p class="text-xs text-gray-400 mb-4">행사 종료 또는 다음 날 번호를 초기화합니다.</p>
        <div class="space-y-2">
          <select id="resetTargetBank" class="w-full p-3 bg-gray-50 rounded-xl text-sm font-bold border border-gray-200 outline-none">
            <!-- 동적 은행 목록 -->
          </select>
          <button onclick="resetBankQueue()" class="w-full py-3 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-sm border border-rose-200">
            해당 은행 1번으로 리셋
          </button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const socket = io();
    let globalState = {};

    socket.on('init_state', (queues) => {
      globalState = queues;
      renderAll();
    });

    socket.on('queue_update', ({ bank, data }) => {
      globalState[bank] = data;
      renderAll();
    });

    // 실시간 음성 호출 TTS
    socket.on('voice_call', ({ bank, ticketNo }) => {
      speakMessage(`${bank}, ${ticketNo}번 고객님, 창구로 와주시기 바랍니다.`);
    });

    function speakMessage(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    function testVoice() {
      speakMessage("음성 호출 시스템이 정상적으로 연결되어 작동 중입니다.");
    }

    function renderAll() {
      const banks = Object.keys(globalState);

      // 1. 대리 발권 버튼 렌더링
      const proxyGrid = document.getElementById('proxyIssueGrid');
      proxyGrid.innerHTML = banks.map(b => `
        <button onclick="proxyIssue('${b}')" class="py-4 px-3 bg-blue-50/70 hover:bg-blue-100 text-blue-700 font-bold rounded-2xl border border-blue-100 text-sm flex flex-col items-center justify-center gap-1 transition active:scale-95">
          <span>${b}</span>
          <span class="text-xs text-blue-500 font-normal">대리 발권 +</span>
        </button>
      `).join('');

      // 2. 은행별 현황 모니터 렌더링
      const boardGrid = document.getElementById('boardGrid');
      boardGrid.innerHTML = banks.map(b => {
        const item = globalState[b];
        const status = item.status || '대기중';
        
        let statusBadge = 'bg-gray-100 text-gray-700';
        if (status === '상담중') statusBadge = 'bg-emerald-100 text-emerald-700';
        if (status === '호출중') statusBadge = 'bg-blue-100 text-blue-700';
        if (status === '부재중') statusBadge = 'bg-rose-100 text-rose-600';

        return `
          <div class="toss-card p-6 border border-gray-100 text-center flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="text-sm font-bold text-blue-600">${b}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${statusBadge}">${status}</span>
              </div>
              <div class="text-xs text-gray-400 mt-3">현재 응대 번호</div>
              <div class="text-5xl font-black text-gray-900 my-2">${item.current > 0 ? item.current + '번' : '-'}</div>
            </div>
            
            <div class="mt-4 pt-3 border-t border-gray-50 text-left space-y-1">
              <div class="flex justify-between text-xs text-gray-500">
                <span>대기 인원</span>
                <span class="font-bold text-gray-800">${item.waiting.length}명</span>
              </div>
              <div class="text-[11px] text-gray-400 truncate">
                상담사: ${(item.staff || []).join(', ') || '미등록'}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 3. 셀렉트 박스 갱신
      const options = banks.map(b => `<option value="${b}">${b}</option>`).join('');
      document.getElementById('staffTargetBank').innerHTML = options;
      document.getElementById('resetTargetBank').innerHTML = options;
    }

    // 대리 발권 실행
    function proxyIssue(bank) {
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res.success) {
          alert(`[${bank}] 대리 발권 완료: ${res.ticketNo}번`);
        }
      });
    }

    // 은행 추가
    function addNewBank() {
      const name = document.getElementById('newBankName').value.trim();
      if (!name) return alert('은행 이름을 입력하세요.');
      socket.emit('add_bank', { newBank: name }, (res) => {
        if (res.success) {
          document.getElementById('newBankName').value = '';
          alert(`'${name}' 창구가 추가되었습니다.`);
        } else {
          alert(res.message);
        }
      });
    }

    // 상담사 추가
    function addNewStaff() {
      const bank = document.getElementById('staffTargetBank').value;
      const staffName = document.getElementById('newStaffName').value.trim();
      if (!staffName) return alert('상담사 이름을 입력하세요.');
      socket.emit('add_staff', { bank, staffName }, (res) => {
        if (res.success) {
          document.getElementById('newStaffName').value = '';
          alert(`[${bank}]에 '${staffName}' 등록 완료`);
        }
      });
    }

    // 번호 리셋
    function resetBankQueue() {
      const bank = document.getElementById('resetTargetBank').value;
      if (confirm(`[${bank}]의 모든 대기열을 지우고 1번부터 다시 시작하도록 초기화하시겠습니까?`)) {
        socket.emit('reset_queue', { bank }, () => {
          alert(`[${bank}] 초기화가 완료되었습니다.`);
        });
      }
    }
  </script>
</body>
</html>
