<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장 총괄 관리자 대시보드</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #3182f6;
      --danger: #ef4444;
      --border: #e2e8f0;
      --text: #0f172a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    
    .card { background: var(--card); border-radius: 24px; padding: 26px; box-shadow: 0 6px 20px rgba(0,0,0,0.03); margin-bottom: 20px; }
    h2 { font-size: 19px; font-weight: 800; margin-bottom: 16px; }

    .btn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
    .btn { height: 56px; border-radius: 16px; font-size: 16px; font-weight: 800; border: none; cursor: pointer; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-dark { background: #0f172a; color: #fff; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
    .stat-box { background: #f1f5f9; border-radius: 16px; padding: 20px; text-align: center; }
    .stat-title { font-size: 14px; font-weight: 700; color: #64748b; }
    .stat-val { font-size: 32px; font-weight: 900; color: var(--primary); margin-top: 6px; }

    #reportBox { display: none; background: #0f172a; color: #38bdf8; padding: 20px; border-radius: 18px; font-family: monospace; white-space: pre-wrap; margin-top: 14px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="head">
      <h1 style="font-size: 26px; font-weight: 900;">총괄 관리자 콘솔</h1>
      <span style="color: #10b981; font-weight: 800; font-size: 14px;">● 실시간 정상 작동</span>
    </div>

    <!-- 비상 제어 센터 -->
    <div class="card" style="border: 2px solid var(--danger);">
      <h2 style="color: var(--danger);">🚨 비상 긴급 제어 & 복구</h2>
      <p style="font-size: 14px; color: #64748b; margin-bottom: 18px;">현장에서 앱 먹통 또는 오류 발생 시 스마트폰으로 즉시 복구합니다.</p>
      <div class="btn-grid">
        <button class="btn btn-danger" onclick="emergencyRepair()">비상 시스템 원클릭 복구</button>
        <button class="btn btn-secondary" onclick="resetTickets()">전체 번호표 리셋</button>
        <button class="btn btn-dark" onclick="closeDay()">일마감 및 통계 생성</button>
      </div>
    </div>

    <!-- 실시간 집계 -->
    <div class="card">
      <h2>실시간 상담 완료 현황</h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-title">우리은행</div><div class="stat-val" id="cntWoori">0</div></div>
        <div class="stat-box"><div class="stat-title">신한은행</div><div class="stat-val" id="cntShinhan">0</div></div>
        <div class="stat-box"><div class="stat-title">국민은행</div><div class="stat-val" id="cntKb">0</div></div>
        <div class="stat-box"><div class="stat-title">푸본현대</div><div class="stat-val" id="cntFubon">0</div></div>
      </div>
      <div style="text-align: right; margin-top: 18px; font-size: 18px; font-weight: 800;">
        총 완료 상담: <span id="cntTotal" style="color: var(--primary);">0</span>건
      </div>
    </div>

    <!-- 일마감 출력 -->
    <div class="card" id="reportCard" style="display: none;">
      <h2>📋 당일 현장 일마감 보고서</h2>
      <button class="btn" style="background: #10b981; color: #fff; width: 100%; height: 50px;" onclick="copyReport()">보고서 텍스트 복사</button>
      <div id="reportBox"></div>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });

    socket.on('connect', () => {
      socket.emit('get_all_state');
    });

    socket.on('all_state_update', (data) => {
      renderStats(data.logs || []);
    });

    function renderStats(logs) {
      const counts = { woori: 0, shinhan: 0, kb: 0, fubon: 0 };
      logs.forEach(l => { if (counts[l.bank] !== undefined) counts[l.bank]++; });

      document.getElementById('cntWoori').innerText = counts.woori;
      document.getElementById('cntShinhan').innerText = counts.shinhan;
      document.getElementById('cntKb').innerText = counts.kb;
      document.getElementById('cntFubon').innerText = counts.fubon;
      document.getElementById('cntTotal').innerText = logs.length;
    }

    function emergencyRepair() {
      if (confirm('모든 창구와 대기열을 초기화하고 비상 복구하시겠습니까?')) {
        socket.emit('admin_emergency_repair');
        alert('비상 복구가 완료되었습니다.');
      }
    }

    function resetTickets() {
      if (confirm('번호표 순번을 100번으로 리셋하시겠습니까?')) {
        socket.emit('admin_reset_tickets', { bank: 'all' });
      }
    }

    function closeDay() {
      if (confirm('일마감을 실행하시겠습니까?')) {
        socket.emit('admin_day_close');
      }
    }

    socket.on('day_closed', (report) => {
      const counts = { woori: 0, shinhan: 0, kb: 0, fubon: 0 };
      report.logs.forEach(l => { if (counts[l.bank] !== undefined) counts[l.bank]++; });

      const text = `[현장 일마감 상담 보고서]
마감 시각: ${new Date(report.closedAt).toLocaleString('ko-KR')}
총 상담 완료 건수: ${report.totalCount}건

■ 은행별 완료 건수
- 우리은행: ${counts.woori}건 (2개 창구)
- 푸본현대: ${counts.fubon}건 (단일 창구)
- 신한은행: ${counts.shinhan}건 (2개 창구)
- 국민은행: ${counts.kb}건 (2개 창구)
`;
      document.getElementById('reportCard').style.display = 'block';
      const box = document.getElementById('reportBox');
      box.style.display = 'block';
      box.innerText = text;
    });

    function copyReport() {
      navigator.clipboard.writeText(document.getElementById('reportBox').innerText).then(() => alert('보고서 복사 완료!'));
    }
  </script>
</body>
</html>
