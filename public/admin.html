<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>종합 관리자 관제 센터</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #030712; color: #f9fafb; padding: 18px; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .wrap { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* 헤더 */
    .top-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #111827; border: 2px solid #1f2937; border-radius: 24px; padding: 20px 26px; gap: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .brand-title { font-size: 26px; font-weight: 900; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
    .auto-status { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; background: #064e3b; color: #34d399; padding: 8px 16px; border-radius: 9999px; border: 1px solid #059669; }
    .pulse-dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }

    /* 대형 호출 전광판 배너 */
    .call-display { display: none; background: #000; border: 3px solid #eab308; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 0 35px rgba(234, 179, 8, 0.35); }
    .call-tag { font-size: 15px; font-weight: 900; color: #ca8a04; letter-spacing: 3px; }
    .call-content { font-size: clamp(38px, 6vw, 68px); font-weight: 900; color: #fef08a; margin-top: 4px; text-shadow: 0 0 15px rgba(250, 204, 21, 0.6); }

    /* 도식화 종합 대시보드 리포트 */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .kpi-card { background: #111827; border: 2px solid #1f2937; border-radius: 20px; padding: 22px; text-align: center; }
    .kpi-card.green { border-color: #059669; background: linear-gradient(180deg, #064e3b 0%, #111827 100%); }
    .kpi-card.red { border-color: #dc2626; background: linear-gradient(180deg, #7f1d1d 0%, #111827 100%); }
    .kpi-card.blue { border-color: #2563eb; background: linear-gradient(180deg, #1e3a8a 0%, #111827 100%); }
    .kpi-label { font-size: 15px; font-weight: 800; color: #9ca3af; margin-bottom: 6px; }
    .kpi-val { font-size: 46px; font-weight: 900; color: #fff; }

    /* 은행별 섹션 */
    .bank-section { background: #111827; border: 2px solid #1f2937; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; gap: 18px; }
    .bank-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1f2937; padding-bottom: 16px; }
    .bank-title { font-size: 26px; font-weight: 900; color: #ffffff; }
    .bank-badges { display: flex; gap: 8px; align-items: center; }
    .badge-completed { background: #065f46; color: #6ee7b7; font-size: 14px; font-weight: 800; padding: 6px 14px; border-radius: 12px; }
    .badge-wait { background: #b91c1c; color: #fecaca; font-size: 14px; font-weight: 900; padding: 6px 14px; border-radius: 12px; }

    /* 창구 개별 박스 (도식화 블록) */
    .desk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    .desk-card { background: #030712; border: 2px solid #374151; border-radius: 18px; padding: 18px; text-align: center; transition: all 0.2s ease; position: relative; }
    .desk-card.active { border-color: #38bdf8; box-shadow: 0 0 20px rgba(56, 189, 248, 0.25); }
    .desk-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .desk-name { font-size: 16px; font-weight: 900; color: #94a3b8; }
    .desk-status-pill { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; }
    .pill-상담중 { background: #065f46; color: #34d399; }
    .pill-대기중 { background: #374151; color: #9ca3af; }
    .desk-current-num { font-size: 52px; font-weight: 900; color: #facc15; margin: 4px 0; letter-spacing: -1px; }
    .desk-perf { font-size: 13px; font-weight: 800; color: #38bdf8; background: #0f172a; padding: 6px; border-radius: 8px; border: 1px solid #1f2937; }

    /* 현장 원터치 대리 발권 데스크 */
    .proxy-title { font-size: 18px; font-weight: 900; color: #fff; margin-bottom: 12px; }
    .proxy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .btn-proxy-large { background: #1f2937; border: 2px solid #374151; color: #fff; padding: 20px 14px; border-radius: 16px; font-size: 18px; font-weight: 900; cursor: pointer; transition: all 0.15s; }
    .btn-proxy-large:active { transform: scale(0.97); background: #2563eb; }

    /* 리셋 버튼 */
    .btn-reset-danger { width: 100%; background: #991b1b; color: #fff; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 900; cursor: pointer; }
    .btn-reset-danger:active { background: #7f1d1d; }
  </style>
</head>
<body>
  <div class="wrap">

    <div class="top-header">
      <div class="brand-title">
        <span>🏦 종합 관제 센터 (전광판·음성 자동화)</span>
      </div>
      <div class="auto-status">
        <div class="pulse-dot"></div>
        <span id="audioStatusText">음성·네트워크 자동 연결됨</span>
      </div>
    </div>

    <!-- 대형 호출 전광판 알림 -->
    <div id="callDisplay" class="call-display">
      <div class="call-tag">CURRENT CALLING</div>
      <div id="callContent" class="call-content">-</div>
    </div>

    <!-- 1. 도식화 종합 실적 리포트 -->
    <div class="kpi-grid">
      <div class="kpi-card green">
        <div class="kpi-label">총 누적 상담완료</div>
        <div id="grandCompleted" class="kpi-val">0건</div>
      </div>
      <div class="kpi-card red">
        <div class="kpi-label">현재 총 대기인원</div>
        <div id="grandWaiting" class="kpi-val">0명</div>
      </div>
      <div class="kpi-card blue">
        <div class="kpi-label">운영 중인 창구</div>
        <div id="grandDesks" class="kpi-val">0개</div>
      </div>
    </div>

    <!-- 2. 각 은행별 개별 박스 창구 현황 (도식화 전광판) -->
    <div id="bankSectionContainer" style="display: flex; flex-direction: column; gap: 18px;"></div>

    <!-- 3. 대형 원터치 대리 발권 데스크 -->
    <div class="bank-section">
      <div class="proxy-title">📋 현장 대리 발권 데스크 (터치 즉시 1초 발권)</div>
      <div id="proxyButtons" class="proxy-grid"></div>
    </div>

    <!-- 4. 비상 번호표 리셋 -->
    <div class="bank-section">
      <button onclick="resetAllQueues()" class="btn-reset-danger">
        ⚠️ 모든 은행 대기번호 및 실적 1번으로 초기화 (마감 전용)
      </button>
    </div>

  </div>

  <script>
    const socket = io();
    let state = {};
    let audioCtx = null;
    let silentAudio = null;
    let wakeLock = null;
    let isAudioUnlocked = false;

    function toHanja(raw) {
      const num = parseInt(raw, 10);
      if (isNaN(num) || num <= 0) return raw;
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return digits[num];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return (t === 1 ? '십' : digits[t] + '십') + (o > 0 ? digits[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100), r = num % 100, t = Math.floor(r / 10), o = r % 10;
        return (h === 1 ? '백' : digits[h] + '백') + (t > 0 ? (t === 1 ? '십' : digits[t] + '십') : '') + (o > 0 ? digits[o] : '');
      }
      return num;
    }

    // 터치필수 버튼 제거: 페이지 어디든 한 번만 스치거나 터치해도 자동 언락
    function autoUnlockAudio() {
      if (isAudioUnlocked) return;
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!silentAudio) {
        silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        silentAudio.loop = true;
        silentAudio.play().catch(() => {});
      }

      if ('wakeLock' in navigator && !wakeLock) {
        navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }).catch(() => {});
      }

      if ('speechSynthesis' in window) {
        const dummy = new SpeechSynthesisUtterance('');
        window.speechSynthesis.speak(dummy);
      }

      isAudioUnlocked = true;
      document.getElementById('audioStatusText').innerText = '음성·절전방지 100% 가동 중';
    }

    // 사용자 제스처 이벤트 전체에 자동 언락 등록
    ['click', 'touchstart', 'touchend', 'pointerdown'].forEach(evt => {
      window.addEventListener(evt, autoUnlockAudio, { once: true });
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        autoUnlockAudio();
        socket.emit('get_all_state');
      }
    });

    function playDingDong(cb) {
      autoUnlockAudio();
      try {
        const t = audioCtx.currentTime;
        const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(784, t);
        g1.gain.setValueAtTime(0.45, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
        o1.connect(g1); g1.connect(audioCtx.destination);
        o1.start(t); o1.stop(t + 0.45);

        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(523.25, t + 0.25);
        g2.gain.setValueAtTime(0.5, t + 0.25); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.85);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(t + 0.25); o2.stop(t + 0.85);

        if (cb) setTimeout(cb, 750);
      } catch (e) {
        if (cb) cb();
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("... " + text);
      u.lang = 'ko-KR'; u.rate = 0.92; u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }

    socket.on('init_state', (data) => { state = data; render(); });
    socket.on('queue_update', ({ bank, data }) => { state[bank] = data; render(); });

    socket.on('voice_call', ({ bank, deskName, ticketNo }) => {
      const dNum = deskName.replace(/[^0-9]/g, '');
      const dHanja = dNum ? toHanja(dNum) + ' 번 창구' : deskName;
      const tHanja = toHanja(ticketNo) + ' 번 고객님';

      const banner = document.getElementById('callDisplay');
      const textEl = document.getElementById('callContent');
      banner.style.display = 'block';
      textEl.innerText = `${bank} ${deskName} ➔ ${ticketNo}번 고객님`;

      const callSpeech = `${bank}, ${dHanja}, ${tHanja} 창구로 와주시기 바랍니다.`;
      playDingDong(() => { speak(callSpeech); });
    });

    function render() {
      const banks = Object.keys(state);

      let totalCompleted = 0;
      let totalWaiting = 0;
      let totalDesks = 0;

      banks.forEach(b => {
        const item = state[b];
        totalWaiting += (item.waiting ? item.waiting.length : 0);
        totalDesks += item.desks.length;
        item.desks.forEach(d => { totalCompleted += (d.completedCount || 0); });
      });

      document.getElementById('grandCompleted').innerText = `${totalCompleted}건`;
      document.getElementById('grandWaiting').innerText = `${totalWaiting}명`;
      document.getElementById('grandDesks').innerText = `${totalDesks}개`;

      // 대리 발권 버튼
      document.getElementById('proxyButtons').innerHTML = banks.map(b => `
        <button onclick="socket.emit('issue_ticket', { bank: '${b}' })" class="btn-proxy-large">
          ${b} 발권 +
        </button>
      `).join('');

      // 은행별 창구 박스 도식화
      const container = document.getElementById('bankSectionContainer');
      container.innerHTML = banks.map(b => {
        const item = state[b];
        const waitCount = item.waiting ? item.waiting.length : 0;
        const bankDone = item.desks.reduce((acc, cur) => acc + (cur.completedCount || 0), 0);

        return `
          <div class="bank-section">
            <div class="bank-header">
              <div class="bank-title">${b}</div>
              <div class="bank-badges">
                <span class="badge-completed">완료: ${bankDone}건</span>
                <span class="badge-wait">대기: ${waitCount}명</span>
              </div>
            </div>

            <div class="desk-grid">
              ${item.desks.map(d => `
                <div class="desk-card ${d.status === '상담중' ? 'active' : ''}">
                  <div class="desk-top">
                    <span class="desk-name">${d.name}</span>
                    <span class="desk-status-pill pill-${d.status}">${d.status}</span>
                  </div>
                  <div style="font-size: 11px; color: #64748b; font-weight: 700;">현재 호출 번호</div>
                  <div class="desk-current-num">${d.current > 0 ? d.current + '번' : '-'}</div>
                  <div class="desk-perf">완료 실적: <b style="color: #34d399;">${d.completedCount || 0}건</b></div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function resetAllQueues() {
      if (confirm('🚨 모든 은행의 대기번호와 상담 실적을 1번으로 초기화하시겠습니까?')) {
        socket.emit('reset_all_queues');
      }
    }
  </script>
</body>
</html>
