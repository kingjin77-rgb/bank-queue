<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>현장 총괄 관리자 및 음성 전광판</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
    h1 { font-size: 24px; margin-bottom: 20px; }
    .box { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #334155; }
    .btn { background: #22c55e; color: #000; font-weight: bold; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <h1>📢 현장 총괄 관리자 콘솔 (음성 전광판 겸용)</h1>
  <div class="box">
    <p>브라우저 음성 엔진 활성화를 위해 아래 버튼을 먼저 눌러주세요.</p>
    <button class="btn" onclick="enableAudio()">🔊 음성 시스템 활성화 (필수)</button>
  </div>
  <div class="box">
    <h3>실시간 음성 방송 모니터</h3>
    <div id="voiceLog" style="font-family: monospace; color: #38bdf8;">대기 중...</div>
  </div>

  <script>
    const socket = io();
    let audioEnabled = false;

    function enableAudio() {
      audioEnabled = true;
      alert('음성 시스템이 활성화되었습니다.');
    }

    function convertNumberToKorean(numStr) {
      let n = parseInt(numStr);
      if (isNaN(n)) return numStr;
      if (n === 0) return '영';

      const units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (n < 10) return units[n];
      if (n < 20) return '십' + (n % 10 > 0 ? units[n % 10] : '');
      
      let ten = Math.floor(n / 10);
      let one = n % 10;
      return (ten > 1 ? units[ten] : '') + '십' + (one > 0 ? units[one] : '');
    }

    let speechQueue = [];
    let isSpeaking = false;

    function queueSpeech(text) {
      speechQueue.push(text);
      processQueue();
    }

    function processQueue() {
      if (isSpeaking || speechQueue.length === 0) return;
      if (!audioEnabled) return;

      const text = speechQueue.shift();
      isSpeaking = true;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ko-KR';
        utterance.rate = 0.92;
        utterance.pitch = 1.0;

        utterance.onend = () => {
          isSpeaking = false;
          setTimeout(processQueue, 300);
        };
        utterance.onerror = () => {
          isSpeaking = false;
          processQueue();
        };

        window.speechSynthesis.speak(utterance);
      } else {
        isSpeaking = false;
      }
    }

    socket.on('customer_called', (data) => {
      const { bankName, customer, deskName } = data;
      document.getElementById('voiceLog').innerText = `[호출] ${bankName} ${customer.ticketNumber}번 고객님 -> ${deskName}`;

      const koreanTicketNum = convertNumberToKorean(customer.ticketNumber);
      const deskNumOnly = deskName.replace(/[^0-9]/g, '');
      const koreanDeskNum = convertNumberToKorean(deskNumOnly);

      const speechMessage = `${bankName}, ${koreanTicketNum}번 고객님, ${koreanDeskNum}번 창구로 오십시요.`;
      
      playChimeAndSpeak(speechMessage);
    });

    function playChimeAndSpeak(text) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      } catch (e) {
        console.log(e);
      }

      setTimeout(() => {
        queueSpeech(text);
      }, 600);
    }
  </script>
</body>
</html>
