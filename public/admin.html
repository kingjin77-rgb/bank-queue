<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 및 통합 대기 현황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-6 flex flex-col justify-between select-none">

  <!-- 상단 관리자 설정 -->
  <div class="bg-slate-800 p-5 rounded-3xl border border-slate-700 shadow-xl mb-6 space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-700">
      <h2 class="text-lg font-bold text-white flex items-center gap-2">
        ⚙️ 현장 운영 관리 설정
      </h2>
      <button onclick="resetAllQueue()" class="px-4 py-2 bg-red-600 hover:bg-red-700 active:scale-95 text-white text-xs font-black rounded-xl shadow transition">
        ⚠️ 대기열 전체 초기화 (리셋)
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700/60">
        <span class="text-xs font-bold text-slate-400 block mb-2">🏛️ 등록된 은행 목록</span>
        <div id="bank-tags" class="flex flex-wrap gap-2 mb-3"></div>
        <div class="flex gap-2">
          <input id="input-new-bank" type="text" placeholder="새 은행명 입력" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white outline-none focus:border-blue-500" />
          <button onclick="addNewBank()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-xs font-bold rounded-xl whitespace-nowrap">은행 추가</button>
        </div>
      </div>

      <div class="bg-slate-900/60 p-4 rounded-2xl border border-slate-700/60">
        <span class="text-xs font-bold text-slate-400 block mb-2">👤 상담원(창구) 추가</span>
        <div class="flex gap-2 mb-2">
          <input id="input-teller-name" type="text" placeholder="창구/상담원명 (예: 5번 창구)" class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white outline-none focus:border-blue-500" />
          <select id="select-teller-bank" class="bg-slate-800 border border-slate-700 rounded-xl px-2 py-1.5 text-xs text-white outline-none"></select>
          <button onclick="addNewTeller()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-xs font-bold rounded-xl whitespace-nowrap">창구 생성</button>
        </div>
        <div id="teller-manage-list" class="flex flex-wrap gap-1.5 max-h-20 overflow-y-auto pr-1"></div>
      </div>
    </div>
  </div>

  <!-- 메인 실시간 전광판 -->
  <main class="flex-1 flex flex-col justify-center my-4">
    <div class="text-center mb-6">
      <h1 class="text-3xl md:text-4xl font-black tracking-wider text-white">실시간 창구 대기 현황</h1>
    </div>

    <div id="counter-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
  </main>

  <!-- 하단 상태 바 -->
  <footer class="mt-4 bg-slate-800/80 p-4 rounded-2xl flex justify-between items-center text-slate-400 text-xs md:text-sm">
    <span>전체 대기 인원: <b class="text-yellow-400 text-lg font-black ml-1" id="total-wait">0명</b></span>
    <span class="flex items-center gap-1.5">
      <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
      실시간 동기화 정상
    </span>
  </footer>

  <script>
    const socket = io();
    let currentBanks = [];
    let currentTellers = [];
    let currentStatusMap = {};

    function addNewBank() {
      const input = document.getElementById('input-new-bank');
      const val = input.value.trim();
      if (!val) return alert('은행명을 입력하세요.');
      socket.emit('admin_add_bank', { bankName: val });
      input.value = '';
    }

    function deleteBank(bankName) {
      if (confirm(`'${bankName}' 은행을 삭제하시겠습니까?`)) {
        socket.emit('admin_delete_bank', { bankName });
      }
    }

    function addNewTeller() {
      const nameInput = document.getElementById('input-teller-name');
      const bankSelect = document.getElementById('select-teller-bank');
      const name = nameInput.value.trim();
      const bank = bankSelect.value;
      if (!name) return alert('상담원 이름을 입력하세요.');
      socket.emit('admin_add_teller', { name, bank });
      nameInput.value = '';
    }

    function deleteTeller(tellerId) {
      if (confirm('해당 창구를 삭제하시겠습니까?')) {
        socket.emit('admin_delete_teller', { tellerId });
      }
    }

    function resetAllQueue() {
      if (confirm('⚠️ 경고: 모든 대기 순번이 100번으로 완전 초기화됩니다. 진행하시겠습니까?')) {
        socket.emit('admin_reset_queue');
      }
    }

    socket.on('state_update', (data) => {
      currentBanks = data.banks;
      currentTellers = data.tellers;
      currentStatusMap = data.counterStatus || {};

      document.getElementById('total-wait').innerText = `${data.totalWaiting}명`;

      // 은행 태그
      const bankTags = document.getElementById('bank-tags');
      const tellerBankSelect = document.getElementById('select-teller-bank');
      bankTags.innerHTML = '';
      tellerBankSelect.innerHTML = '';

      data.banks.forEach(b => {
        const tag = document.createElement('span');
        tag.className = 'inline-flex items-center gap-1 bg-blue-900/60 border border-blue-500/40 text-blue-300 text-xs px-2.5 py-1 rounded-lg font-bold';
        tag.innerHTML = `${b} <button onclick="deleteBank('${b}')" class="text-blue-400 hover:text-white ml-1 font-bold">×</button>`;
        bankTags.appendChild(tag);

        const opt = document.createElement('option');
        opt.value = b;
        opt.innerText = b;
        tellerBankSelect.appendChild(opt);
      });

      // 상담원 태그
      const tellerManageList = document.getElementById('teller-manage-list');
      tellerManageList.innerHTML = '';
      data.tellers.forEach(t => {
        const chip = document.createElement('span');
        chip.className = 'inline-flex items-center gap-1 bg-slate-800 border border-slate-700 text-slate-300 text-[11px] px-2 py-0.5 rounded-md';
        chip.innerHTML = `${t.name} (${t.bank}) <button onclick="deleteTeller(${t.id})" class="text-red-400 hover:text-red-200 font-bold ml-1">×</button>`;
        tellerManageList.appendChild(chip);
      });

      renderBoard();
    });

    function renderBoard() {
      const grid = document.getElementById('counter-grid');
      grid.innerHTML = '';

      currentTellers.forEach(t => {
        const tid = String(t.id);
        const info = currentStatusMap[tid];
        const isCalling = info && info.ticketNo;
        const isCalled = info && info.status === 'CALLED';
        const isInProgress = info && info.status === 'IN_PROGRESS';

        const card = document.createElement('div');
        card.className = `bg-slate-800/90 rounded-3xl p-5 border ${isCalling ? (isCalled ? 'border-amber-400 shadow-xl shadow-amber-500/20' : 'border-emerald-500 shadow-xl shadow-emerald-500/20') : 'border-slate-700/70'} flex flex-col items-center justify-center transition`;
        card.innerHTML = `
          <div class="flex items-center justify-between w-full px-2">
            <span class="text-xs font-bold text-slate-300">${t.name}</span>
            <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded-full">${t.bank}</span>
          </div>
          <div class="text-5xl md:text-6xl font-black ${isCalling ? (isCalled ? 'text-amber-400 animate-pulse' : 'text-emerald-400') : 'text-slate-600'} my-3">
            ${isCalling ? info.ticketNo + '번' : '-'}
          </div>
          <span class="text-xs font-bold ${isCalling ? (isCalled ? 'text-amber-400' : 'text-emerald-400') : 'text-slate-500'}">
            ${isCalling ? (isCalled ? '📢 호출 중' : '▶ 상담 진행 중') : '대기 중'}
          </span>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
