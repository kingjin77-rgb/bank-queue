<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 대기 시스템 관리자 & 종합 안내 현황판</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style> body { font-family: "Pretendard Variable", Pretendard, sans-serif; word-break: keep-all; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-6 antialiased">
  <header class="flex justify-between items-center border-b border-slate-800 pb-4">
    <div>
      <h1 class="text-2xl font-black text-blue-400 tracking-tight">현장 상담 대기 종합 현황판</h1>
      <p class="text-xs text-slate-400 mt-1">실시간 호출 음성 안내 및 은행/창구 관리</p>
    </div>
    <div class="flex gap-2">
      <button onclick="testSpeech()" class="px-3 py-2 bg-blue-600 hover:bg-blue-500 text-xs font-black rounded-xl shadow transition">🔊 음성 테스트</button>
      <button onclick="resetSystem()" class="px-3 py-2 bg-rose-600/80 hover:bg-rose-600 text-xs font-black rounded-xl transition">⚠️ 번호 초기화</button>
    </div>
  </header>

  <main class="grid grid-cols-1 lg:grid-cols-3 gap-6 my-6 flex-1">
    <div class="lg:col-span-1 space-y-6 flex flex-col">
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center shadow-2xl">
        <div class="inline-block px-3 py-1 bg-amber-500/20 text-amber-400 rounded-full text-xs font-bold mb-4">📢 지금 호출 중인 고객</div>
        <div class="text-6xl font-black text-amber-400 my-3 tracking-tight" id="main-call-ticket">---</div>
        <div class="text-lg font-black text-white" id="main-call-counter">호출 대기 중</div>
        <div class="text-xs text-slate-400 mt-1" id="main-call-bank">-</div>
      </div>

      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-xl flex-1 flex flex-col justify-between">
        <div>
          <h2 class="text-sm font-black text-white mb-3">🏢 현장 은행(기관) 관리</h2>
          <div class="flex gap-2 mb-4">
            <input type="text" id="new-bank-input" placeholder="추가할 은행/기관명 입력" class="flex-1 bg-slate-950 border border-slate-700 px-3 py-2 text-xs rounded-xl text-white outline-none focus:border-blue-500" />
            <button onclick="addBank()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-xl transition">추가</button>
          </div>
          <div id="admin-bank-list" class="space-y-2 max-h-40 overflow-y-auto pr-1"></div>
        </div>
        <p class="text-[11px] text-slate-500 mt-4">💡 여기서 은행을 추가하면 고객 발권 페이지와 현황판에 즉시 반영됩니다.</p>
      </div>
    </div>

    <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
      <h2 class="text-base font-black text-white mb-4">🏛️ 은행별 실시간 대기 현황</h2>
      <div id="stats-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-600 py-2 border-t border-slate-800">현장 통합 대기 순번 시스템 · 관리자 대시보드</footer>

  <script>
    const socket = io();
    let audioCtx = null;

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('touchstart', unlockAudio, { passive: true });
    document.addEventListener('click', unlockAudio, { passive: true });

    function convertNumberToKorean(numStr) {
      const digits = {'0': '영', '1': '일', '2': '이', '3': '삼', '4': '사', '5': '오', '6': '육', '7': '칠', '8': '팔', '9': '구'};
      const num = parseInt(numStr);
      if (isNaN(num)) return numStr;

      if (num < 10) {
        return digits[num] || numStr;
      } else if (num < 100) {
        let tens = Math.floor(num / 10);
        let units = num % 10;
        let res = '';
        if (tens > 0) res += (tens > 1 ? digits[tens] : '') + '십';
        if (units > 0) res += digits[units];
        return res;
      } else if (num < 1000) {
        let hundreds = Math.floor(num / 100);
        let remainder = num % 100;
        let res = (hundreds > 1 ? digits[hundreds] : '') + '백';
        if (remainder > 0) {
          let tens = Math.floor(remainder / 10);
          let units = remainder % 10;
          if (tens > 0) res += (tens > 1 ? digits[tens] : '') + '십';
          if (units > 0) res += digits[units];
        }
        return res;
      }
      return numStr;
    }

    function playChime() {
      return new Promise((resolve) => {
        unlockAudio();
        const ctx = audioCtx;
        const now = ctx.currentTime;
        const chimeFrequencies = [523.25, 659.25, 783.99, 1046.50];
        chimeFrequencies.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.12);
          gain.gain.setValueAtTime(0, now + idx * 0.12);
          gain.gain.linearRampToValueAtTime(0.3, now + idx * 0.12 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.4);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.12);
          osc.stop(now + idx * 0.12 + 0.45);
        });
        setTimeout(resolve, 600);
      });
    }

    function announceCustomer(ticketNo, bank, counterName) {
      playChime().then(() => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const koreanTicket = convertNumberToKorean(String(ticketNo));
          // 창구 이름에 포함된 숫자만 한글로 변환 (bank를 중복으로 붙이지 않음)
          const spokenCounter = counterName.replace(/\d+/g, (match) => convertNumberToKorean(match));
          const text = `${koreanTicket}번 고객님, ${spokenCounter}로 오시기 바랍니다.`;
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'ko-KR';
          utterance.rate = 0.90;
          window.speechSynthesis.speak(utterance);
        }
      });
    }

    function testSpeech() { announceCustomer(103, '국민은행', '국민은행 1번 창구'); }
    function resetSystem() { if (confirm('전체 대기 번호표를 초기화하시겠습니까?')) socket.emit('reset_system'); }

    function addBank() {
      const input = document.getElementById('new-bank-input');
      const bankName = input.value.trim();
      if (bankName) { socket.emit('add_bank', { bankName }); input.value = ''; }
    }

    function removeBank(bankName) {
      if (confirm(`"${bankName}"과 관련된 모든 대기열과 창구가 삭제됩니다. 삭제하시겠습니까?`)) {
        socket.emit('remove_bank', { bankName });
      }
    }

    socket.on('customer_called', (data) => {
      document.getElementById('main-call-ticket').innerText = `${data.ticketNo}번`;
      document.getElementById('main-call-counter').innerText = data.counterName;
      document.getElementById('main-call-bank').innerText = data.bank;
      announceCustomer(data.ticketNo, data.bank, data.counterName);
    });

    socket.on('state_update', (data) => {
      const bankListDiv = document.getElementById('admin-bank-list');
      bankListDiv.innerHTML = '';
      data.banks.forEach(b => {
        const item = document.createElement('div');
        item.className = 'flex justify-between items-center bg-slate-950 px-3 py-2 rounded-xl border border-slate-800 text-xs';
        item.innerHTML = `<span class="font-bold text-white">🏛️ ${b}</span><button onclick="removeBank('${b}')" class="text-rose-400 hover:text-rose-300 font-bold px-2 py-1">삭제</button>`;
        bankListDiv.appendChild(item);
      });

      const statsGrid = document.getElementById('stats-grid');
      statsGrid.innerHTML = '';
      (data.stats || []).forEach(s => {
        const card = document.createElement('div');
        card.className = 'p-4 bg-slate-950/70 border border-slate-800 rounded-2xl flex flex-col justify-between';
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2"><span class="font-bold text-sm text-white">${s.bank}</span><span class="px-2 py-0.5 bg-blue-500/10 text-blue-400 text-[10px] font-bold rounded-md">상담중 ${s.calling}</span></div>
          <div class="flex justify-between items-end mt-2"><span class="text-xs text-slate-500">대기 인원</span><span class="text-2xl font-black text-amber-400">${s.waiting}명</span></div>
        `;
        statsGrid.appendChild(card);
      });
    });
  </script>
</body>
</html>
