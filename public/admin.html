<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트폰 관리자 호출 전광판</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #f2f4f6; color: #191f28; padding: 12px; }
    .wrap { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: #ffffff; border-radius: 16px; padding: 16px; border: 1px solid #e5e8eb; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    
    button { cursor: pointer; border: none; outline: none; border-radius: 12px; font-weight: bold; }
    button:active { transform: scale(0.97); }
    .btn-voice { width: 100%; padding: 14px; background: #3182f6; color: #fff; font-size: 16px; border-radius: 12px; margin-bottom: 8px; }
    .btn-voice.on { background: #00874c; }
    .btn-reset-all { width: 100%; padding: 10px; background: #feebeb; color: #f04452; font-size: 13px; border-radius: 10px; border: 1px solid #fca5a5; }

    .proxy-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .btn-proxy { background: #e8f3ff; color: #1b64da; border: 1px solid #cbe2ff; padding: 12px 6px; border-radius: 12px; text-align: center; }

    .bank-card { margin-top: 8px; border-top: 1px solid #f2f4f6; padding-top: 10px; }
    .bank-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .bank-name { font-size: 16px; font-weight: 900; }
    .badge-wait { background: #e8f3ff; color: #1b64da; font-size: 11px; padding: 3px 8px; border-radius: 20px; }

    .desks-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .desk-box { background: #f9fafb; border: 1px solid #e5e8eb; border-radius: 10px; padding: 10px; text-align: center; }
    .desk-title { font-size: 12px; color: #6b7684; display: flex; justify-content: space-between; }
    .desk-num { font-size: 24px; font-weight: 900; color: #191f28; margin: 4px 0; }
    .badge-status { font-size: 10px; padding: 1px 6px; border-radius: 10px; }
    .s-호출중 { background: #e8f3ff; color: #1b64da; font-weight: bold; }
    .s-상담중 { background: #e6f8f0; color: #00874c; font-weight: bold; }
    .s-대기중 { background: #e5e8eb; color: #6b7684; }

    .call-banner { background: #191f28; color: #fff; padding: 14px; border-radius: 14px; text-align: center; margin-bottom: 8px; }
  </style>
</head>
<body onclick="unlockAudio()">
  <div class="wrap">

    <div class="card" style="padding: 12px;">
      <button id="voiceBtn" onclick="initVoice(event)" class="btn-voice">
        🔊 음성 활성화 (터치 필수)
      </button>
      <div id="latestCall" class="call-banner" style="display: none;">
        <div id="callText" style="font-size: 18px; font-weight: 900; color: #ffd15c;">-</div>
      </div>
      <button onclick="resetAllQueues()" class="btn-reset-all">
        ⚠️ 전체 은행 번호 1번으로 리셋
      </button>
    </div>

    <div class="card">
      <div style="font-size: 14px; font-weight: 800; color: #333d4b;">📋 현장 대리 발권 (스마트폰 미소지자)</div>
      <div id="proxyContainer" class="proxy-grid"></div>
    </div>

    <div class="card">
      <div style="font-size: 14px; font-weight: 800; color: #333d4b; margin-bottom: 6px;">🏦 실시간 은행별 창구 현황</div>
      <div id="bankListContainer"></div>
    </div>

  </div>

  <script>
    const socket = io();
    let state = {};
    let audioCtx = null;

    function toHanja(raw) {
      const num = parseInt(raw, 10);
      if (isNaN(num) || num <= 0) return raw;
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return digits[num];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return (t === 1 ? '십' : digits[t] + '십') + (o > 0 ? digits[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100), r = num % 100, t = Math.floor(r / 10), o = r % 10;
        return (h === 1 ? '백' : digits[h] + '백') + (t > 0 ? (t === 1 ? '십' : digits[t] + '십') : '') + (o > 0 ? digits[o] : '');
      }
      return num;
    }

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function initVoice(e) {
      if (e) e.stopPropagation();
      unlockAudio();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance('음성 시스템이 준비되었습니다.');
        u.lang = 'ko-KR';
        u.rate = 0.95;
        window.speechSynthesis.speak(u);
      }
      playDingDong();
      const btn = document.getElementById('voiceBtn');
      btn.innerText = '● 음성 가동 중 (정상 작동)';
      btn.className = 'btn-voice on';
    }

    function playDingDong(cb) {
      unlockAudio();
      try {
        const t = audioCtx.currentTime;
        const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = 'sine';
        o1.frequency.setValueAtTime(784, t);
        g1.gain.setValueAtTime(0.3, t);
        g1.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
        o1.connect(g1); g1.connect(audioCtx.destination);
        o1.start(t); o1.stop(t + 0.4);

        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'sine';
        o2.frequency.setValueAtTime(523.25, t + 0.25);
        g2.gain.setValueAtTime(0.35, t + 0.25);
        g2.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(t + 0.25); o2.stop(t + 0.8);

        if (cb) setTimeout(cb, 600);
      } catch (err) {
        if (cb) cb();
      }
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.92;
      u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }

    socket.on('init_state', (data) => { state = data; render(); });
    socket.on('queue_update', ({ bank, data }) => { state[bank] = data; render(); });

    socket.on('voice_call', ({ bank, deskName, ticketNo }) => {
      const dNum = deskName.replace(/[^0-9]/g, '');
      const dHanja = dNum ? toHanja(dNum) + ' 번 창구' : deskName;
      const tHanja = toHanja(ticketNo) + ' 번 고객님';

      const banner = document.getElementById('latestCall');
      const textEl = document.getElementById('callText');
      banner.style.display = 'block';
      textEl.innerText = `${bank} ${deskName} ➔ ${ticketNo}번 고객님`;

      const callSpeech = `${bank}, ${dHanja}, ${tHanja} 창구로 와주시기 바랍니다.`;
      playDingDong(() => {
        speak(callSpeech);
      });
    });

    function render() {
      const banks = Object.keys(state);

      document.getElementById('proxyContainer').innerHTML = banks.map(b => `
        <button onclick="socket.emit('issue_ticket', { bank: '${b}' })" class="btn-proxy">
          <div style="font-size: 14px; font-weight: 800;">${b}</div>
          <div style="font-size: 11px; opacity: 0.7;">발권 +</div>
        </button>
      `).join('');

      document.getElementById('bankListContainer').innerHTML = banks.map(b => {
        const item = state[b];
        const waitCount = item.waiting ? item.waiting.length : 0;

        return `
          <div class="bank-card">
            <div class="bank-header">
              <span class="bank-name">${b}</span>
              <span class="badge-wait">대기 ${waitCount}명</span>
            </div>
            <div class="desks-grid">
              ${item.desks.map(d => `
                <div class="desk-box">
                  <div class="desk-title">
                    <span>${d.name}</span>
                    <span class="badge-status s-${d.status}">${d.status}</span>
                  </div>
                  <div class="desk-num">${d.current > 0 ? d.current + '번' : '-'}</div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function resetAllQueues() {
      if (confirm('🚨 모든 은행의 번호표를 1번으로 리셋하시겠습니까?')) {
        socket.emit('reset_all_queues');
      }
    }
  </script>
</body>
</html>
