<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통합 관리자 모니터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; }
    .toss-card { background: #ffffff; border-radius: 24px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04); }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- 상단 헤더 & 전체 리셋 & 음성 테스트 -->
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
      <div>
        <h1 class="text-2xl font-black text-gray-900 flex items-center gap-2">
          🏦 대기 시스템 통합 관제 모니터
        </h1>
        <p class="text-xs text-gray-500 mt-1">실시간 대기열 동기화, 대리 발권, 출근 상담사 인원 관리</p>
      </div>
      <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
        <button onclick="testVoice()" class="px-4 py-2.5 bg-blue-50 active:bg-blue-100 text-blue-600 font-bold rounded-xl text-sm border border-blue-100 transition">
          🔊 음성 테스트
        </button>
        <button onclick="resetAll()" class="px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-black rounded-xl text-sm shadow-md transition">
          ⚠️ 전체 은행 번호표 일괄 리셋
        </button>
      </div>
    </div>

    <!-- 1. 현장 대리 발권 데스크 (원클릭 발권) -->
    <div class="toss-card p-6 border border-gray-100">
      <div class="mb-4">
        <h2 class="text-lg font-bold text-gray-800">📋 현장 대리 발권 (스마트폰 미소지자용)</h2>
        <p class="text-xs text-gray-400">버튼을 클릭하면 즉시 해당 은행의 번호표가 실시간 발권됩니다.</p>
      </div>
      <div id="proxyIssueGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 2. 은행별 실시간 전광판 & 출근 상담사 인원수 증감 -->
    <div>
      <h2 class="text-lg font-bold text-gray-800 mb-3 px-1">📊 실시간 창구 모니터 & 상담사 인원 배치</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="boardGrid">
        <!-- 동적 렌더링 -->
      </div>
    </div>

    <!-- 3. 추가 설정 (신규 은행 추가 & 개별 리셋) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      
      <!-- 신규 은행 추가 -->
      <div class="toss-card p-6 border border-gray-100">
        <h3 class="font-bold text-gray-800 mb-1">➕ 신규 은행 창구 추가</h3>
        <p class="text-xs text-gray-400 mb-3">새로운 금융기관 창구를 즉시 개설합니다.</p>
        <div class="flex gap-2">
          <input type="text" id="newBankName" placeholder="은행명 입력" class="flex-1 p-3 bg-gray-50 rounded-xl text-sm border border-gray-200 font-semibold outline-none focus:border-blue-500">
          <button onclick="addNewBank()" class="px-5 py-3 bg-gray-900 text-white font-bold rounded-xl text-sm hover:bg-black">추가</button>
        </div>
      </div>

      <!-- 개별 은행 리셋 -->
      <div class="toss-card p-6 border border-gray-100">
        <h3 class="font-bold text-gray-800 mb-1">🔄 개별 은행 번호 리셋</h3>
        <p class="text-xs text-gray-400 mb-3">선택한 특정 은행만 1번부터 다시 시작하도록 초기화합니다.</p>
        <div class="flex gap-2">
          <select id="resetTargetBank" class="flex-1 p-3 bg-gray-50 rounded-xl text-sm font-bold border border-gray-200 outline-none">
            <!-- 동적 은행 목록 -->
          </select>
          <button onclick="resetSingleBank()" class="px-4 py-3 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-sm border border-rose-200">
            선택 은행 리셋
          </button>
        </div>
      </div>

    </div>

  </div>

  <script>
    const socket = io();
    let globalState = {};

    socket.on('init_state', (queues) => {
      globalState = queues;
      renderAll();
    });

    socket.on('queue_update', ({ bank, data }) => {
      globalState[bank] = data;
      renderAll();
    });

    socket.on('voice_call', ({ bank, ticketNo }) => {
      speakMessage(`${bank}, ${ticketNo}번 고객님, 창구로 와주시기 바랍니다.`);
    });

    function speakMessage(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    }

    function testVoice() {
      speakMessage("음성 호출 안내 시스템이 정상 작동 중입니다.");
    }

    function renderAll() {
      const banks = Object.keys(globalState);

      // 1. 대리 발권 버튼
      const proxyGrid = document.getElementById('proxyIssueGrid');
      proxyGrid.innerHTML = banks.map(b => `
        <button onclick="proxyIssue('${b}')" class="py-4 px-3 bg-blue-50/70 active:bg-blue-100 text-blue-700 font-bold rounded-2xl border border-blue-100 text-sm flex flex-col items-center justify-center gap-1 transition active:scale-95 shadow-sm">
          <span class="text-base">${b}</span>
          <span class="text-xs text-blue-500 font-normal">대리 발권 +</span>
        </button>
      `).join('');

      // 2. 실시간 모니터 & 인원 증감
      const boardGrid = document.getElementById('boardGrid');
      boardGrid.innerHTML = banks.map(b => {
        const item = globalState[b];
        const status = item.status || '대기중';
        const staffCount = item.staffCount || 1;

        let statusBadge = 'bg-gray-100 text-gray-700';
        if (status === '상담중') statusBadge = 'bg-emerald-100 text-emerald-700';
        if (status === '호출중') statusBadge = 'bg-blue-100 text-blue-700';
        if (status === '부재중') statusBadge = 'bg-rose-100 text-rose-600';

        return `
          <div class="toss-card p-6 border border-gray-100 text-center flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-center mb-2">
                <span class="text-base font-bold text-blue-600">${b}</span>
                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${statusBadge}">${status}</span>
              </div>
              <div class="text-xs text-gray-400 mt-2">현재 호출 번호</div>
              <div class="text-5xl font-black text-gray-900 my-2">${item.current > 0 ? item.current + '번' : '-'}</div>
              <div class="text-xs font-semibold text-gray-500">대기 인원: <span class="text-blue-600 font-bold">${item.waiting.length}명</span></div>
            </div>
            
            <!-- 상담사 인원수 +/- 컨트롤러 -->
            <div class="mt-4 pt-3 border-t border-gray-100">
              <div class="flex items-center justify-between bg-gray-50 p-2 rounded-xl">
                <span class="text-xs font-bold text-gray-600">상담사 배치</span>
                <div class="flex items-center gap-2">
                  <button onclick="adjustStaff('${b}', -1)" class="w-7 h-7 bg-white border border-gray-200 rounded-lg text-gray-700 font-black text-sm flex items-center justify-center active:bg-gray-100">-</button>
                  <span class="text-sm font-black text-blue-600 min-w-[24px] text-center">${staffCount}명</span>
                  <button onclick="adjustStaff('${b}', 1)" class="w-7 h-7 bg-white border border-gray-200 rounded-lg text-gray-700 font-black text-sm flex items-center justify-center active:bg-gray-100">+</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 3. 리셋 셀렉트
      document.getElementById('resetTargetBank').innerHTML = banks.map(b => `<option value="${b}">${b}</option>`).join('');
    }

    function proxyIssue(bank) {
      socket.emit('issue_ticket', { bank }, (res) => {
        if (res.success) {
          // alert 제거하여 즉각 연속 발권 가능
        }
      });
    }

    function adjustStaff(bank, change) {
      socket.emit('adjust_staff_count', { bank, change }, (res) => {
        if (!res.success && res.message) alert(res.message);
      });
    }

    function addNewBank() {
      const name = document.getElementById('newBankName').value.trim();
      if (!name) return alert('은행명을 입력하세요.');
      socket.emit('add_bank', { newBank: name }, (res) => {
        if (res.success) {
          document.getElementById('newBankName').value = '';
        } else {
          alert(res.message);
        }
      });
    }

    function resetSingleBank() {
      const bank = document.getElementById('resetTargetBank').value;
      if (confirm(`[${bank}]의 대기열을 초기화(1번부터 시작)하시겠습니까?`)) {
        socket.emit('reset_queue', { bank }, () => {});
      }
    }

    function resetAll() {
      if (confirm('🚨 모든 은행의 대기 번호표를 전부 1번으로 일괄 초기화하시겠습니까?')) {
        socket.emit('reset_all_queues', () => {});
      }
    }
  </script>
</body>
</html>
