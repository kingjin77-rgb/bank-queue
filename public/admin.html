<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대기 현황 모니터 & 관리자</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', sans-serif; background-color: #f2f4f6; color: #191f28; }
  </style>
</head>
<body class="min-h-screen p-6">
  <div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">🏦 통합 대기 현황 모니터</h1>
      <div class="text-sm font-semibold text-green-600 bg-green-50 px-3 py-1 rounded-full">🔊 음성 안내 작동 중</div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8" id="boardGrid"></div>

    <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
      <h2 class="text-lg font-bold mb-4">대기열 리셋 (필요시 사용)</h2>
      <div class="flex flex-wrap gap-4 items-center">
        <select id="targetBank" class="p-3 bg-gray-50 rounded-xl font-bold border border-gray-200">
          <option value="우리은행">우리은행</option>
          <option value="신한은행">신한은행</option>
          <option value="국민은행">국민은행</option>
          <option value="푸본현대생명">푸본현대생명</option>
        </select>
        <button onclick="resetQueue()" class="px-5 py-3 bg-red-50 text-red-600 font-bold rounded-xl">해당 은행 번호 초기화 (1번부터)</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let state = {};

    socket.on('init_state', (queues) => {
      state = queues;
      renderBoard();
    });

    socket.on('queue_update', ({ bank, data }) => {
      state[bank] = data;
      renderBoard();
    });

    // 음성 호출 실행
    socket.on('voice_call', ({ bank, ticketNo }) => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const text = `${bank}, ${ticketNo}번 고객님, 창구로 와주시기 바랍니다.`;
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ko-KR';
        msg.rate = 0.95;
        window.speechSynthesis.speak(msg);
      }
    });

    function renderBoard() {
      const grid = document.getElementById('boardGrid');
      grid.innerHTML = Object.keys(state).map(bank => {
        const item = state[bank];
        return `
          <div class="bg-white rounded-3xl p-6 shadow-sm border border-gray-100 text-center">
            <div class="text-sm font-bold text-blue-600 mb-2">${bank}</div>
            <div class="text-xs text-gray-400">현재 호출 번호</div>
            <div class="text-5xl font-black text-gray-900 my-3">${item.current > 0 ? item.current + '번' : '-'}</div>
            <div class="text-xs font-semibold text-gray-500">대기 인원: ${item.waiting.length}명</div>
          </div>
        `;
      }).join('');
    }

    function resetQueue() {
      const bank = document.getElementById('targetBank').value;
      if (confirm(`${bank}의 대기열을 1번부터 다시 시작하도록 리셋하시겠습니까?`)) {
        socket.emit('reset_queue', { bank }, () => alert('초기화 완료되었습니다.'));
      }
    }
  </script>
</body>
</html>
