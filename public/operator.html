<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b101b">
  <title>현장 진행요원 패널</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --font-stack: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      --bg: #0b101b;
      --card: #171f30;
      --panel: #1f293d;
      --border: rgba(255,255,255,0.08);
      --text: #ffffff;
      --text-sub: #94a3b8;
      --blue: #3182f6;
      --green: #04b071;
      --amber: #ffb020;
      --red: #f04452;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-stack); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; font-weight: 700; letter-spacing: -0.4px; padding: 16px 14px calc(env(safe-area-inset-bottom) + 30px); }

    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 2px solid #1e293b; }
    .tag { display: inline-block; background: #8b0029; color: #ffd7e0; font-size: 12px; font-weight: 900; padding: 6px 12px; border-radius: 12px; margin-bottom: 8px; }
    h1 { font-size: 28px; font-weight: 900; letter-spacing: -1px; }

    .btn { border: none; border-radius: 20px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; }
    .btn:active { transform: scale(0.97); }
    .btn-proxy { min-height: 76px; padding: 0 30px; font-size: 21px; background: var(--blue); color: #fff; box-shadow: 0 8px 24px rgba(49,130,246,0.28); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
    .bank-card { background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 22px; }
    .bank-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .bank-name { font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; }
    .dot { width: 15px; height: 15px; border-radius: 50%; }
    .wait-badge { background: rgba(49,130,246,0.12); border: 1px solid rgba(49,130,246,0.35); color: var(--blue); font-size: 15px; font-weight: 900; padding: 8px 14px; border-radius: 16px; }
    .wait-badge b { color: #fff; font-size: 20px; }

    .desk-box { background: var(--panel); border: 1px solid var(--border); border-radius: 22px; padding: 16px; margin-bottom: 14px; }
    .desk-top { display: flex; justify-content: space-between; align-items: center; }
    .desk-name { font-size: 19px; font-weight: 900; color: #e2e8f0; }
    .desk-state { font-size: 14px; font-weight: 900; padding: 7px 13px; border-radius: 14px; background: #0f172a; color: var(--text-sub); }
    .desk-state.busy { background: var(--amber); color: #1a1a1a; }
    .desk-elapsed { font-size: 13px; font-weight: 900; font-family: monospace; color: var(--text-sub); margin-top: 6px; min-height: 17px; }

    .desk-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .btn-desk { min-height: 62px; font-size: 17px; }
    .b-call { background: var(--blue); color: #fff; }
    .b-recall { background: var(--amber); color: #1a1a1a; }
    .b-pass { background: transparent; border: 2px solid var(--red); color: #ff8b96; }
    .b-done { background: var(--green); color: #fff; }

    .bank-foot { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; color: var(--text-sub); padding-top: 12px; border-top: 1px solid var(--border); }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 900; display: none; align-items: center; justify-content: center; padding: 18px; }
    .modal.show { display: flex; }
    .sheet { background: var(--card); border: 1px solid var(--border); border-radius: 30px; padding: 26px 22px; width: 100%; max-width: 460px; max-height: 88vh; overflow-y: auto; }
    .sheet h3 { font-size: 24px; font-weight: 900; margin-bottom: 6px; }
    .sheet p { font-size: 14px; color: var(--text-sub); font-weight: 700; margin-bottom: 18px; }
    .proxy-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .proxy-btn { min-height: 74px; font-size: 20px; border-radius: 20px; }
    .btn-close { width: 100%; min-height: 60px; font-size: 17px; background: #0f172a; color: var(--text-sub); border: 1px solid var(--border); border-radius: 18px; }

    #opToast {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 20px);
      background: #fff; color: #111; border-radius: 20px; padding: 16px 26px; font-size: 18px; font-weight: 900;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: none; z-index: 950; max-width: 92vw; text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="keepAliveCanvasOp" width="2" height="2" style="position:fixed;top:0;left:0;opacity:0;pointer-events:none;"></canvas>

  <header>
    <div>
      <span class="tag">🏛️ 법무법인 제이엘 · 현장 진행본부</span>
      <h1>현장 창구 제어 센터</h1>
    </div>
    <button class="btn btn-proxy" onclick="openProxyModal()">🎫 원터치 대리 발권</button>
  </header>

  <main class="grid" id="operatorGrid"></main>

  <div class="modal" id="proxyModal">
    <div class="sheet">
      <h3>어르신 대리 발권</h3>
      <p>발권할 기관을 누르면 즉시 번호표가 발행됩니다.</p>
      <div class="proxy-list" id="proxyBankList"></div>
      <button class="btn btn-close" onclick="closeProxyModal()">닫기</button>
    </div>
  </div>

  <div id="opToast"></div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });
    let state = { bankInfo: {}, queues: {}, desks: {}, logs: [] };
    let standardMinutes = 15;
    let serverOffsetMs = 0;

    function elapsedSec(iso) {
      if (!iso) return 0;
      return Math.max(0, Math.round((Date.now() + serverOffsetMs - new Date(iso).getTime()) / 1000));
    }
    function fmtMs(sec) {
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    // 화면 꺼짐 방지
    const canvas = document.getElementById('keepAliveCanvasOp');
    if (canvas && canvas.getContext) {
      const ctx = canvas.getContext('2d');
      let f = 0;
      (function loop() {
        f++;
        ctx.fillStyle = (f % 2 === 0) ? '#000000' : '#010101';
        ctx.fillRect(0, 0, 2, 2);
        requestAnimationFrame(loop);
      })();
    }
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(function () {});

    socket.on('connect', function () { socket.emit('get_all_state'); });

    socket.on('all_state_update', function (data) {
      state = data;
      if (data.serverTime) serverOffsetMs = new Date(data.serverTime).getTime() - Date.now();
      if (data.settings) standardMinutes = data.settings.standardMinutes;
      render();
      if (document.getElementById('proxyModal').classList.contains('show')) renderProxyList();
    });

    // 경과시간만 1초마다 갱신
    setInterval(function () {
      document.querySelectorAll('.desk-elapsed[data-called]').forEach(function (el) {
        const iso = el.dataset.called;
        if (!iso) return;
        const sec = elapsedSec(iso);
        const over = sec > standardMinutes * 60;
        el.innerText = '상담 ' + fmtMs(sec) + (over ? ' · 지연' : '');
        el.style.color = over ? '#ff8b96' : '#94a3b8';
      });
    }, 1000);

    function bankList() {
      return Object.keys(state.bankInfo || {}).map(function (id) {
        const info = state.bankInfo[id];
        return { id: id, name: info.name, color: info.color, btnText: info.btnText };
      });
    }

    function render() {
      const container = document.getElementById('operatorGrid');
      container.innerHTML = '';

      bankList().forEach(function (bank) {
        const queue = state.queues[bank.id] || [];
        const waiting = queue.filter(function (c) { return c.status === 'waiting'; });
        const desks = state.desks[bank.id] || [];
        const done = (state.logs || []).filter(function (l) { return l.bank === bank.id; }).length;

        let html =
          '<div class="bank-head">' +
            '<span class="bank-name"><span class="dot" style="background:' + bank.color + '"></span>' + bank.name + '</span>' +
            '<span class="wait-badge">대기 <b>' + waiting.length + '</b>명</span>' +
          '</div>';

        desks.forEach(function (desk) {
          const busy = desk.status === 'consulting' && desk.currentCustomer;
          const sec = busy ? elapsedSec(desk.currentCustomer.calledAt) : 0;
          const over = busy && sec > standardMinutes * 60;
          html +=
            '<div class="desk-box">' +
              '<div class="desk-top">' +
                '<span class="desk-name">' + desk.name + '</span>' +
                '<span class="desk-state' + (busy ? ' busy' : '') + '">' +
                  (busy ? '진행중 ' + desk.currentCustomer.ticketNumber + '번' : '호출 대기') +
                '</span>' +
              '</div>' +
              '<div class="desk-elapsed" data-called="' + (busy ? desk.currentCustomer.calledAt : '') + '"' +
                ' style="color:' + (over ? '#ff8b96' : '#94a3b8') + ';">' +
                (busy ? '상담 ' + fmtMs(sec) + (over ? ' · 지연' : '') : '') +
              '</div>' +
              '<div class="desk-btns">' +
                '<button class="btn btn-desk b-call" onclick="callCustomer(\'' + bank.id + '\',' + desk.desk + ')">호출</button>' +
                '<button class="btn btn-desk b-recall" onclick="recallCustomer(\'' + bank.id + '\',' + desk.desk + ')">재호출</button>' +
                '<button class="btn btn-desk b-pass" onclick="passCustomer(\'' + bank.id + '\',' + desk.desk + ')">부재패스</button>' +
                '<button class="btn btn-desk b-done" onclick="completeCustomer(\'' + bank.id + '\',' + desk.desk + ')">완료</button>' +
              '</div>' +
            '</div>';
        });

        html +=
          '<div class="bank-foot">' +
            '<span>대기열: ' + (waiting.length ? waiting.slice(0, 5).map(function (w) { return w.ticketNumber + '번'; }).join(', ') : '비어있음') + '</span>' +
            '<span>완료 ' + done + '건</span>' +
          '</div>';

        const card = document.createElement('div');
        card.className = 'bank-card';
        card.style.borderTop = '6px solid ' + bank.color;
        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function toast(msg) {
      const t = document.getElementById('opToast');
      t.innerText = msg;
      t.style.display = 'block';
      clearTimeout(toast._t);
      toast._t = setTimeout(function () { t.style.display = 'none'; }, 3000);
    }

    function callCustomer(bank, deskNumber) { socket.emit('call_customer', { bank: bank, deskNumber: deskNumber }); }
    function recallCustomer(bank, deskNumber) { socket.emit('recall_customer', { bank: bank, deskNumber: deskNumber }); }
    function passCustomer(bank, deskNumber) {
      if (confirm('현재 고객을 부재(패스) 처리하시겠습니까?')) {
        socket.emit('pass_customer', { bank: bank, deskNumber: deskNumber });
      }
    }
    function completeCustomer(bank, deskNumber) {
      socket.emit('complete_consultation', { bank: bank, deskNumber: deskNumber, autoCall: false });
    }

    function renderProxyList() {
      const list = document.getElementById('proxyBankList');
      list.innerHTML = '';
      bankList().forEach(function (bank) {
        const btn = document.createElement('button');
        btn.className = 'btn proxy-btn';
        btn.style.background = bank.color;
        btn.style.color = bank.btnText || '#fff';
        btn.innerText = bank.name + ' 대리 발권';
        btn.onclick = function () {
          socket.emit('issue_ticket', { bank: bank.id, name: '대리발권' }, function (res) {
            if (res && res.success) {
              toast('[발권 완료] ' + res.ticket.bankName + ' ' + res.ticket.ticketNumber + '번');
              closeProxyModal();
            }
          });
        };
        list.appendChild(btn);
      });
    }
    function openProxyModal() {
      renderProxyList();
      document.getElementById('proxyModal').classList.add('show');
    }
    function closeProxyModal() {
      document.getElementById('proxyModal').classList.remove('show');
    }

    socket.on('customer_called', function (data) {
      toast(data.bankName + ' ' + data.customer.ticketNumber + '번 → ' + data.deskName);
    });
  </script>
</body>
</html>
