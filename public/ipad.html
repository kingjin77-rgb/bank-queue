<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="/manifest.json">
  <title>통합 대기 전광판 및 관제</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    .container { max-width: 1600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    
    /* 상단 배너 */
    .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; background: #1e293b; padding: 18px 24px; border-radius: 20px; border: 1px solid #334155; gap: 14px; }
    .brand-title { font-size: 26px; font-weight: 900; color: #60a5fa; }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
    button { cursor: pointer; border: none; outline: none; border-radius: 12px; font-weight: 800; transition: all 0.15s ease; }
    button:active { transform: scale(0.97); }
    .btn-action { background: #2563eb; color: #fff; padding: 14px 22px; font-size: 16px; }
    .btn-action.on { background: #16a34a; }
    .btn-reset { background: #ef4444; color: #fff; padding: 14px 20px; font-size: 15px; }

    /* 호출 안내 대형 전광판 */
    .now-calling { background: #000; border: 3px solid #3b82f6; border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 0 30px rgba(59, 130, 246, 0.4); }
    .calling-tag { font-size: 16px; font-weight: 900; color: #93c5fd; letter-spacing: 2px; margin-bottom: 6px; }
    .calling-num { font-size: clamp(38px, 6vw, 68px); font-weight: 900; color: #facc15; }

    /* 은행별 카드 그리드 */
    .bank-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; }
    .bank-card { background: #1e293b; border: 1px solid #334155; border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 6px 18px rgba(0,0,0,0.2); }
    .bank-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 14px; }
    .bank-name { font-size: 24px; font-weight: 900; color: #ffffff; }
    .wait-badge { background: #ef4444; color: #ffffff; font-size: 14px; font-weight: 900; padding: 4px 12px; border-radius: 30px; }

    /* 창구 그리드 */
    .desk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .desk-box { background: #0f172a; border: 2px solid #334155; border-radius: 16px; padding: 16px; text-align: center; }
    .desk-name { font-size: 14px; font-weight: 800; color: #94a3b8; }
    .desk-num { font-size: clamp(34px, 4vw, 54px); font-weight: 900; color: #38bdf8; margin: 6px 0; }
    .desk-status { font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 8px; display: inline-block; }
    .s-상담중 { background: #065f46; color: #34d399; }
    .s-대기중 { background: #334155; color: #94a3b8; }

    /* 대기열 목록 */
    .wait-list-box { background: #0f172a; border-radius: 14px; padding: 14px; border: 1px solid #334155; }
    .wait-list-title { font-size: 13px; font-weight: 800; color: #94a3b8; margin-bottom: 8px; }
    .wait-chips { display: flex; flex-wrap: wrap; gap: 8px; max-height: 110px; overflow-y: auto; }
    .wait-chip { background: #1e293b; border: 1px solid #475569; color: #f8fafc; font-size: 15px; font-weight: 900; padding: 6px 12px; border-radius: 10px; }
  </style>
</head>
<body onclick="unlockAudioEngine()">
  <div class="container">
    
    <div class="top-bar">
      <div class="brand-title">🏦 실시간 고객 대기 통합 전광판</div>
      <div class="btn-group">
        <button id="voiceBtn" onclick="toggleAudio(event)" class="btn-action">🔊 음성 및 절전방지 활성화</button>
        <button onclick="resetAll()" class="btn-reset">⚠️ 번호 전체 1번 리셋</button>
      </div>
    </div>

    <div id="callingBanner" class="now-calling" style="display: none;">
      <div class="calling-tag">NOW CALLING</div>
      <div id="callingText" class="calling-num">-</div>
    </div>

    <div id="bankListContainer" class="bank-grid"></div>

  </div>

  <script>
    const socket = io();
    let state = {};
    let audioCtx = null;
    let silentAudio = null;
    let wakeLock = null;

    function toHanja(raw) {
      const num = parseInt(raw, 10);
      if (isNaN(num) || num <= 0) return raw;
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return digits[num];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return (t === 1 ? '십' : digits[t] + '십') + (o > 0 ? digits[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100), r = num % 100, t = Math.floor(r / 10), o = r % 10;
        return (h === 1 ? '백' : digits[h] + '백') + (t > 0 ? (t === 1 ? '십' : digits[t] + '십') : '') + (o > 0 ? digits[o] : '');
      }
      return num;
    }

    function unlockAudioEngine() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!silentAudio) {
        silentAudio = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');
        silentAudio.loop = true;
        silentAudio.play().catch(() => {});
      }

      if ('wakeLock' in navigator && !wakeLock) {
        navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }).catch(() => {});
      }
    }

    function toggleAudio(e) {
      if (e) e.stopPropagation();
      unlockAudioEngine();
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance('전광판 음성 시스템이 준비되었습니다.');
        u.lang = 'ko-KR';
        window.speechSynthesis.speak(u);
      }
      playDingDong();
      const btn = document.getElementById('voiceBtn');
      btn.innerText = '● 음성 가동 중 (화면 유지)';
      btn.className = 'btn-action on';
    }

    function playDingDong(cb) {
      unlockAudioEngine();
      try {
        const now = audioCtx.currentTime;
        const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
        o1.type = 'sine'; o1.frequency.setValueAtTime(784, now);
        g1.gain.setValueAtTime(0.4, now); g1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        o1.connect(g1); g1.connect(audioCtx.destination);
        o1.start(now); o1.stop(now + 0.45);

        const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
        o2.type = 'sine'; o2.frequency.setValueAtTime(523.25, now + 0.25);
        g2.gain.setValueAtTime(0.45, now + 0.25); g2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        o2.connect(g2); g2.connect(audioCtx.destination);
        o2.start(now + 0.25); o2.stop(now + 0.85);

        if (cb) setTimeout(cb, 800);
      } catch (e) {
        if (cb) cb();
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance("... " + text);
      u.lang = 'ko-KR'; u.rate = 0.92; u.volume = 1.0;
      window.speechSynthesis.speak(u);
    }

    socket.on('init_state', (data) => { state = data; render(); });
    socket.on('queue_update', ({ bank, data }) => { state[bank] = data; render(); });

    socket.on('voice_call', ({ bank, deskName, ticketNo }) => {
      const dNum = deskName.replace(/[^0-9]/g, '');
      const dHanja = dNum ? toHanja(dNum) + ' 번 창구' : deskName;
      const tHanja = toHanja(ticketNo) + ' 번 고객님';

      const banner = document.getElementById('callingBanner');
      const textEl = document.getElementById('callingText');
      banner.style.display = 'block';
      textEl.innerText = `${bank} ${deskName} ➔ ${ticketNo}번`;

      const speech = `${bank}, ${dHanja}, ${tHanja} 창구로 와주시기 바랍니다.`;
      playDingDong(() => { speakText(speech); });
    });

    function render() {
      const container = document.getElementById('bankListContainer');
      const banks = Object.keys(state);

      container.innerHTML = banks.map(b => {
        const item = state[b];
        const waitList = item.waiting || [];

        return `
          <div class="bank-card">
            <div class="bank-header">
              <span class="bank-name">${b}</span>
              <span class="wait-badge">대기 ${waitList.length}명</span>
            </div>

            <div class="desk-grid">
              ${item.desks.map(d => `
                <div class="desk-box">
                  <div class="desk-name">${d.name}</div>
                  <div class="desk-num">${d.current > 0 ? d.current + '번' : '-'}</div>
                  <span class="desk-status s-${d.status}">${d.status}</span>
                </div>
              `).join('')}
            </div>

            <div class="wait-list-box">
              <div class="wait-list-title">대기 고객 목록 (${waitList.length}명)</div>
              <div class="wait-chips">
                ${waitList.length > 0 
                  ? waitList.map((num, i) => `<span class="wait-chip">${i+1}. ${num}번</span>`).join('')
                  : '<span style="font-size: 13px; color: #64748b;">대기 인원 없음</span>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function resetAll() {
      if (confirm('🚨 모든 은행의 대기 순번을 1번으로 리셋하시겠습니까?')) {
        socket.emit('reset_all_queues');
      }
    }
  </script>
</body>
</html>
