<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>통합 관리자 모니터 (iPad 전용)</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { background-color: #f2f4f6; color: #191f28; padding: 16px; -webkit-font-smoothing: antialiased; }
    .max-w { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .card { background: #ffffff; border-radius: 18px; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.04); border: 1px solid #e5e8eb; }
    
    .header-box { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .header-title { font-size: 22px; font-weight: 900; color: #191f28; }
    .header-sub { font-size: 12px; color: #8b95a1; margin-top: 2px; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 8px; }

    button { cursor: pointer; border: none; outline: none; border-radius: 12px; font-weight: 700; transition: transform 0.1s ease; }
    button:active { transform: scale(0.97); }
    .btn-blue { background-color: #3182f6; color: #ffffff; padding: 12px 18px; font-size: 15px; }
    .btn-green { background-color: #00874c; color: #ffffff; padding: 12px 18px; font-size: 15px; }
    .btn-red { background-color: #f04452; color: #ffffff; padding: 12px 18px; font-size: 15px; }
    .btn-proxy { background-color: #e8f3ff; color: #1b64da; border: 1px solid #cbe2ff; padding: 16px 10px; font-size: 16px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; }
    .btn-ctrl { background-color: #ffffff; border: 1px solid #d1d6db; width: 30px; height: 30px; font-size: 14px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }

    .grid-proxy { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 12px; }
    .grid-desks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0; }
    .grid-bottom { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }

    .call-banner { background: #191f28; color: #fff; padding: 16px; border-radius: 16px; text-align: center; margin-top: 8px; }
    .desk-card { background: #f9fafb; border: 1px solid #e5e8eb; border-radius: 14px; padding: 14px; text-align: center; }
    .desk-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #4e5968; margin-bottom: 6px; }
    .desk-num { font-size: 32px; font-weight: 900; color: #191f28; margin: 6px 0; }

    .badge { padding: 3px 8px; border-radius: 9999px; font-size: 11px; font-weight: 800; }
    .badge-wait { background: #e5e8eb; color: #4e5968; }
    .badge-call { background: #e8f3ff; color: #1b64da; }
    .badge-ing { background: #e6f8f0; color: #00874c; }
    .badge-absent { background: #feebeb; color: #f04452; }

    .wait-box { background: #f9fafb; border: 1px solid #e5e8eb; border-radius: 12px; padding: 12px; }
    .wait-title { font-size: 13px; font-weight: 700; color: #6b7684; margin-bottom: 8px; }
    .wait-tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .wait-tag { background: #ffffff; border: 1px solid #d1d6db; border-radius: 8px; padding: 6px 10px; font-size: 14px; font-weight: 800; color: #191f28; }

    input[type="text"], select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #d1d6db; font-size: 14px; background: #f9fafb; outline: none; font-weight: 600; }
    input[type="text"]:focus, select:focus { border-color: #3182f6; background: #ffffff; }
    .form-row { display: flex; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body onclick="unlockIpadAudio()">
  <div class="max-w">
    
    <!-- 1. 헤더 컨트롤 바 -->
    <div class="card header-box">
      <div>
        <h1 class="header-title">🏦 은행 대기 통합 관제 모니터 (iPad)</h1>
        <p class="header-sub">전 은행 실시간 음성 호출 및 전광판</p>
      </div>
      <div class="btn-group">
        <button id="voiceBtn" onclick="toggleAudioEngine(event)" class="btn-blue">
          🔊 음성 켜기 (화면 터치 필수)
        </button>
        <button onclick="resetAllQueues()" class="btn-red">
          ⚠️ 전체 번호 1번 리셋
        </button>
      </div>
    </div>

    <!-- 최근 호출 알림 배너 -->
    <div id="latestCallBanner" class="call-banner" style="display: none;">
      <div style="font-size: 12px; color: #8b95a1; margin-bottom: 4px;">NOW CALLING</div>
      <div id="latestCallText" style="font-size: 24px; font-weight: 900; color: #ffd15c;">-</div>
    </div>

    <!-- 2. 현장 대리 발권 데스크 -->
    <div class="card">
      <div style="font-size: 16px; font-weight: 800; color: #333d4b;">📋 현장 대리 발권 데스크 (스마트폰 미소지자)</div>
      <div style="font-size: 12px; color: #8b95a1; margin-top: 2px;">터치 즉시 해당 은행의 번호표가 실시간 발급됩니다.</div>
      <div id="proxyContainer" class="grid-proxy"></div>
    </div>

    <!-- 3. 실시간 은행 창구 현황 -->
    <div id="bankListContainer" style="display: flex; flex-direction: column; gap: 14px;"></div>

    <!-- 4. 하단 설정 (은행 추가 및 개별 리셋) -->
    <div class="grid-bottom">
      <div class="card">
        <div style="font-size: 15px; font-weight: 800; color: #333d4b;">➕ 신규 은행 창구 추가</div>
        <div class="form-row">
          <input type="text" id="newBankInput" placeholder="은행명 입력">
          <button onclick="addNewBank()" class="btn-blue" style="min-width: 80px;">추가</button>
        </div>
      </div>

      <div class="card">
        <div style="font-size: 15px; font-weight: 800; color: #333d4b;">🔄 개별 은행 번호 리셋</div>
        <div class="form-row">
          <select id="resetBankDropdown"></select>
          <button onclick="resetSingleBank()" class="btn-red" style="min-width: 90px; background-color: #feebeb; color: #f04452; border: 1px solid #fca5a5;">선택 리셋</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const socket = io();
    let state = {};
    let audioCtx = null;
    let windowUtterances = [];

    // 순수 숫자 한자어 변환
    function toHanja(raw) {
      const num = parseInt(raw, 10);
      if (isNaN(num) || num <= 0) return raw;
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return digits[num];
      if (num < 100) {
        const t = Math.floor(num / 10), o = num % 10;
        return (t === 1 ? '십' : digits[t] + '십') + (o > 0 ? digits[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100), r = num % 100, t = Math.floor(r / 10), o = r % 10;
        return (h === 1 ? '백' : digits[h] + '백') + (t > 0 ? (t === 1 ? '십' : digits[t] + '십') : '') + (o > 0 ? digits[o] : '');
      }
      return num;
    }

    function unlockIpadAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function toggleAudioEngine(e) {
      if (e) e.stopPropagation();
      unlockIpadAudio();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const testUtter = new SpeechSynthesisUtterance('음성 안내 시스템이 정상 가동 중입니다.');
        testUtter.lang = 'ko-KR';
        testUtter.rate = 0.95;
        
        const voices = window.speechSynthesis.getVoices();
        const koVoice = voices.find(v => v.lang.includes('ko') || v.lang.includes('KR'));
        if (koVoice) testUtter.voice = koVoice;

        windowUtterances.push(testUtter);
        testUtter.onend = () => { windowUtterances = []; };
        window.speechSynthesis.speak(testUtter);
      }

      playDingDong();
      const btn = document.getElementById('voiceBtn');
      btn.innerText = '● 음성 가동 중 (정상)';
      btn.className = 'btn-green';
    }

    function playDingDong(callback) {
      unlockIpadAudio();
      try {
        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator(), gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(784, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.45);

        const osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(523.25, now + 0.25);
        gain2.gain.setValueAtTime(0.35, now + 0.25);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.85);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.25);
        osc2.stop(now + 0.85);

        // 벨 소리 완료 후 850ms 딜레이를 주어 아이패드 TTS 첫 음절 씹힘 완벽 차단
        if (callback) setTimeout(callback, 850);
      } catch (err) {
        if (callback) callback();
      }
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      // 점 3개 버퍼로 첫 글자 묵음 현상 방지
      const utter = new SpeechSynthesisUtterance("... " + text);
      utter.lang = 'ko-KR';
      utter.rate = 0.90;
      utter.volume = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const koVoice = voices.find(v => v.lang.includes('ko') || v.lang.includes('KR'));
      if (koVoice) utter.voice = koVoice;

      windowUtterances.push(utter);
      utter.onend = () => {
        windowUtterances = windowUtterances.filter(u => u !== utter);
      };

      window.speechSynthesis.speak(utter);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

    socket.on('init_state', (data) => {
      state = data;
      render();
    });

    socket.on('queue_update', ({ bank, data }) => {
      state[bank] = data;
      render();
    });

    // 모든 은행(우리/신한/국민/푸본) 음성 호출 수신부
    socket.on('voice_call', ({ bank, deskName, ticketNo }) => {
      const dNum = deskName.replace(/[^0-9]/g, '');
      const dHanja = dNum ? toHanja(dNum) + ' 번 창구' : deskName;
      const tHanja = toHanja(ticketNo) + ' 번 고객님';

      // 상단 전광판 배너
      const banner = document.getElementById('latestCallBanner');
      const textEl = document.getElementById('latestCallText');
      banner.style.display = 'block';
      textEl.innerText = `${bank} ${deskName} ➔ ${ticketNo}번 고객님`;

      // 정확한 은행명 포함 발성
      const fullCallSpeech = `${bank}, ${dHanja}, ${tHanja} 창구로 와주시기 바랍니다.`;
      playDingDong(() => {
        speakText(fullCallSpeech);
      });
    });

    function render() {
      const banks = Object.keys(state);

      // 발권 데스크
      const proxyContainer = document.getElementById('proxyContainer');
      proxyContainer.innerHTML = banks.map(b => `
        <button onclick="proxyIssue('${b}')" class="btn-proxy">
          <span style="font-weight: 800;">${b}</span>
          <span style="font-size: 11px; opacity: 0.8;">원터치 발권 +</span>
        </button>
      `).join('');

      // 은행별 창구 현황
      const listContainer = document.getElementById('bankListContainer');
      listContainer.innerHTML = banks.map(b => {
        const item = state[b];
        const waitList = item.waiting || [];

        return `
          <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f2f4f6; padding-bottom: 12px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="font-size: 18px; font-weight: 900; color: #191f28;">${b}</span>
                <span style="background: #e8f3ff; color: #1b64da; font-size: 12px; font-weight: 800; padding: 2px 10px; border-radius: 9999px;">
                  대기 ${waitList.length}명
                </span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 12px; font-weight: 700; color: #6b7684;">창구 수:</span>
                <div style="display: flex; align-items: center; background: #f2f4f6; padding: 2px 6px; border-radius: 10px; gap: 6px;">
                  <button onclick="adjustDesk('${b}', -1)" class="btn-ctrl">-</button>
                  <span style="font-size: 14px; font-weight: 900; color: #3182f6; min-width: 18px; text-align: center;">${item.desks.length}</span>
                  <button onclick="adjustDesk('${b}', 1)" class="btn-ctrl">+</button>
                </div>
              </div>
            </div>

            <div class="grid-desks">
              ${item.desks.map(desk => {
                let badgeClass = 'badge-wait';
                if (desk.status === '상담중') badgeClass = 'badge-ing';
                if (desk.status === '호출중') badgeClass = 'badge-call';
                if (desk.status === '부재중') badgeClass = 'badge-absent';

                return `
                  <div class="desk-card">
                    <div class="desk-header">
                      <span>${desk.name}</span>
                      <span class="badge ${badgeClass}">${desk.status}</span>
                    </div>
                    <div style="font-size: 11px; color: #8b95a1;">현재 고객</div>
                    <div class="desk-num">${desk.current > 0 ? desk.current + '번' : '-'}</div>
                  </div>
                `;
              }).join('')}
            </div>

            <div class="wait-box">
              <div class="wait-title">📋 실시간 대기 순번 (${waitList.length}명 대기 중)</div>
              <div class="wait-tags">
                ${waitList.length > 0 
                  ? waitList.map((num, i) => `<span class="wait-tag"><span style="color: #8b95a1; font-size: 11px; margin-right: 2px;">${i+1}.</span>${num}번</span>`).join('') 
                  : '<span style="font-size: 12px; color: #8b95a1;">현재 대기 중인 고객이 없습니다.</span>'
                }
              </div>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('resetBankDropdown').innerHTML = banks.map(b => `<option value="${b}">${b}</option>`).join('');
    }

    function proxyIssue(bank) {
      socket.emit('issue_ticket', { bank });
    }

    function adjustDesk(bank, change) {
      socket.emit('adjust_desk_count', { bank, change }, (res) => {
        if (!res.success && res.message) alert(res.message);
      });
    }

    function addNewBank() {
      const input = document.getElementById('newBankInput');
      const name = input.value.trim();
      if (!name) return alert('은행명을 입력하세요.');
      socket.emit('add_bank', { newBank: name }, (res) => {
        if (res.success) {
          input.value = '';
        } else alert(res.message);
      });
    }

    function resetSingleBank() {
      const bank = document.getElementById('resetBankDropdown').value;
      if (confirm(`[${bank}] 번호표를 1번으로 리셋하시겠습니까?`)) {
        socket.emit('reset_queue', { bank });
      }
    }

    function resetAllQueues() {
      if (confirm('🚨 모든 은행의 번호표를 1번으로 일괄 리셋하시겠습니까?')) {
        socket.emit('reset_all_queues');
      }
    }
  </script>
</body>
</html>
