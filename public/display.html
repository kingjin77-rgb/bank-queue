<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>전광판 및 음성 안내</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; }
    .box { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 15px; }
    .btn { background: #22c55e; color: #000; padding: 15px 25px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>📢 통합 음성 전광판</h1>
  <div class="box">
    <button class="btn" onclick="enableAudio()">🔊 음성 시스템 활성화 (필수 클릭)</button>
  </div>
  <div class="box">
    <h3>최근 호출 내역</h3>
    <p id="voiceLog" style="font-size: 22px; color: #38bdf8;">대기 중...</p>
  </div>

  <script>
    const socket = io();
    let audioReady = false;

    function enableAudio() {
      audioReady = true;
      alert('음성 시스템이 활성화되었습니다.');
    }

    // "한번" 발음 버그를 완벽하게 방지하는 한글 숫자 변환 함수
    function numToKorean(n) {
      let num = parseInt(n);
      if (isNaN(num)) return n;
      const units = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      if (num < 10) return units[num];
      if (num < 20) return '십' + (num % 10 > 0 ? units[num % 10] : '');
      let ten = Math.floor(num / 10);
      let one = num % 10;
      return (ten > 1 ? units[ten] : '') + '십' + (one > 0 ? units[one] : '');
    }

    let queue = [];
    let speaking = false;

    function speakNext() {
      if (speaking || queue.length === 0 || !audioReady) return;
      speaking = true;

      const text = queue.shift();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ko-KR';
      utter.rate = 0.92;

      utter.onend = () => { speaking = false; setTimeout(speakNext, 300); };
      utter.onerror = () => { speaking = false; speakNext(); };

      window.speechSynthesis.speak(utter);
    }

    socket.on('customer_called', (data) => {
      document.getElementById('voiceLog').innerText = `${data.bankName} ${data.customer.ticketNumber}번 -> ${data.deskName}`;
      
      const tNum = numToKorean(data.customer.ticketNumber);
      const dNum = numToKorean(data.deskName.replace(/[^0-9]/g, ''));
      const msg = `${data.bankName}, ${tNum}번 고객님, ${dNum}번 창구로 오십시요.`;

      queue.push(msg);
      speakNext();
    });
  </script>
</body>
</html>
