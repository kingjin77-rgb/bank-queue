<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>은행 종합 상담 전광판</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #0b101b;
      --card-bg: #162032;
      --text: #ffffff;
      --text-sub: #94a3b8;
      --border: #24324a;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; overflow-x: hidden; }

    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
    .title { font-size: 34px; font-weight: 900; letter-spacing: -0.5px; }
    .clock { font-size: 28px; font-weight: 800; color: #38bdf8; font-family: monospace; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 24px; }
    .bank-card { background: var(--card-bg); border-radius: 28px; padding: 24px; border: 2px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

    .bank-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 14px; }
    .bank-name { font-size: 28px; font-weight: 900; }
    .queue-badge { background: #0b101b; border: 1px solid #e2e8f0; color: #fff; font-size: 18px; font-weight: 800; padding: 6px 16px; border-radius: 20px; }

    .desk-list { display: flex; flex-direction: column; gap: 14px; }
    .desk-row { display: flex; justify-content: space-between; align-items: center; background: #0b101b; border-radius: 20px; padding: 18px 24px; border: 1px solid var(--border); }
    .desk-title { font-size: 22px; font-weight: 800; color: var(--text-sub); }
    .ticket-display { font-size: 64px; font-weight: 900; color: var(--success); letter-spacing: -1px; }
    .ticket-display.idle { font-size: 26px; color: #475569; font-weight: 700; }

    #audioBtn { position: fixed; bottom: 24px; right: 24px; background: #38bdf8; color: #000; border: none; font-size: 18px; font-weight: 900; padding: 16px 28px; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); z-index: 100; }
  </style>
</head>
<body>

  <div class="header">
    <div class="title" id="boardTitle">상담 창구 전광판</div>
    <div class="clock" id="clock">00:00:00</div>
  </div>

  <div class="grid" id="gridContainer"></div>

  <button id="audioBtn" onclick="activateAudio()">🔊 전광판 음성 켜기 (필수 클릭)</button>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });
    const urlParams = new URLSearchParams(window.location.search);
    const targetBank = urlParams.get('bank');

    let audioCtx = null;
    function activateAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      document.getElementById('audioBtn').innerText = '🔊 전광판 음성 켜짐 (정상)';
      document.getElementById('audioBtn').style.background = '#22c55e';
    }

    // 챠임벨 (딩-동)
    let chimeCtx = null;
    function playChime() {
      try {
        if (!chimeCtx) chimeCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (chimeCtx.state === 'suspended') chimeCtx.resume();
        const now = chimeCtx.currentTime;
        [[659.25, 0, 0.5], [523.25, 0.25, 0.85]].forEach(([freq, at, end]) => {
          const osc = chimeCtx.createOscillator();
          const gain = chimeCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + at);
          gain.gain.setValueAtTime(0.3, now + at);
          gain.gain.exponentialRampToValueAtTime(0.001, now + end);
          osc.connect(gain);
          gain.connect(chimeCtx.destination);
          osc.start(now + at);
          osc.stop(now + end);
        });
      } catch (e) {
        console.error('Chime error:', e);
      }
    }

    // ===== 공통 음성 유틸 =====
    // 숫자를 "일, 이, 삼..." 한자어 발음으로 변환 ("한번/두번" 오독 방지, 최대 9999)
    function numToKorean(n) {
      const num = parseInt(n, 10);
      if (isNaN(num)) return String(n);
      if (num === 0) return '영';
      const digits = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const units = ['', '십', '백', '천'];
      let out = '';
      let rest = num;
      for (let i = 3; i >= 0; i--) {
        const div = Math.pow(10, i);
        const d = Math.floor(rest / div);
        rest %= div;
        if (d === 0) continue;
        out += (d === 1 && i > 0 ? '' : digits[d]) + units[i];
      }
      return out;
    }

    // "1번 창구" -> "일번 창구", "단일 창구" -> 그대로
    function deskToKorean(deskName) {
      const m = String(deskName || '').match(/\d+/);
      return m ? `${numToKorean(m[0])}번 창구` : String(deskName || '창구');
    }

    // 표준 호출 안내 멘트
    function callMessage(bankName, ticketNumber, deskName) {
      return `${bankName}, ${numToKorean(ticketNumber)}번 고객님, ${deskToKorean(deskName)}로 오십시오.`;
    }

    // 음성 끊김 방지 큐: 이전 멘트가 끝난 뒤에 다음 멘트를 읽는다 (cancel 사용 안 함)
    const speechQueue = [];
    let speaking = false;
    let speechGuard = null;

    function enqueueSpeech(text, withChime) {
      speechQueue.push({ text, withChime: !!withChime });
      processSpeechQueue();
    }

    function processSpeechQueue() {
      if (speaking || speechQueue.length === 0) return;
      if (!('speechSynthesis' in window)) { speechQueue.length = 0; return; }
      speaking = true;
      const item = speechQueue.shift();

      const start = () => {
        const utter = new SpeechSynthesisUtterance(item.text);
        utter.lang = 'ko-KR';
        utter.rate = 0.92;
        utter.pitch = 1.0;
        utter.volume = 1.0;
        const done = () => {
          if (!speaking) return;
          speaking = false;
          clearTimeout(speechGuard);
          setTimeout(processSpeechQueue, 300);
        };
        utter.onend = done;
        utter.onerror = done;
        speechGuard = setTimeout(done, 15000); // onend 가 오지 않는 브라우저 대비 안전장치
        try { window.speechSynthesis.resume(); } catch (e) {}
        window.speechSynthesis.speak(utter);
      };

      if (item.withChime && typeof playChime === 'function') {
        playChime();
        setTimeout(start, 500);
      } else {
        start();
      }
    }

    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleTimeString('ko-KR');
    }, 1000);

    socket.on('connect', () => {
      socket.emit('get_all_state');
    });

    socket.on('all_state_update', (data) => {
      render(data);
    });

    function render(data) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = '';

      const banks = targetBank ? [targetBank.toLowerCase()] : Object.keys(data.bankInfo);

      banks.forEach(b => {
        const info = data.bankInfo[b] || { name: b.toUpperCase(), color: '#38bdf8' };
        const desks = data.desks[b] || [];
        const q = data.queues[b] || [];

        const card = document.createElement('div');
        card.className = 'bank-card';
        card.style.borderTop = `6px solid ${info.color}`;
        card.innerHTML = `
          <div class="bank-head">
            <span class="bank-name" style="color: ${info.color};">${info.name}</span>
            <span class="queue-badge">대기 ${q.length}명</span>
          </div>
          <div class="desk-list">
            ${desks.map(d => `
              <div class="desk-row">
                <span class="desk-title">${d.name}</span>
                <span class="ticket-display ${d.currentCustomer ? '' : 'idle'}">
                  ${d.currentCustomer ? d.currentCustomer.ticketNumber + '번' : '대기중'}
                </span>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(card);
      });
    }

    socket.on('customer_called', (data) => {
      if (!targetBank || targetBank.toLowerCase() === data.bank) {
        enqueueSpeech(callMessage(data.bankName, data.customer.ticketNumber, data.deskName), true);
      }
    });
  </script>
</body>
</html>
