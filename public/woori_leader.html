<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리은행 상담 관제 | 지점장·팀장용</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif; letter-spacing: -0.035em; }
    .toss-card { background: #171f30; border: 1px solid rgba(255,255,255,0.08); }
    .toss-btn { transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
    .toss-btn:active { transform: scale(0.96); }
  </style>
</head>
<body class="bg-[#0b101b] text-white min-h-screen p-4 md:p-6 font-sans select-none pb-20">

  <!-- 상단 헤더 -->
  <header class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 pb-5 mb-6 border-b border-slate-800">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <span class="px-3 py-1 bg-[#0067ac] text-white text-xs font-black rounded-xl">우리은행 전용</span>
        <span class="text-xs text-slate-400 font-bold">현장 실시간 지휘 대시보드</span>
      </div>
      <h1 class="text-3xl font-black text-white tracking-tight">우리은행 팀장·지점장 관제</h1>
    </div>
    <div id="realtimeClock" class="font-mono text-emerald-400 bg-[#171f30] border border-white/10 px-5 py-2.5 rounded-2xl text-sm font-black shadow w-fit">
      KST --:--:--
    </div>
  </header>

  <!-- 상단 총괄 지표 2종 카드 -->
  <div class="grid grid-cols-2 gap-4 mb-6">
    <div class="toss-card rounded-[32px] p-6 text-center shadow-xl">
      <div class="text-xs font-black text-slate-400 mb-1">우리은행 실시간 총 대기</div>
      <div id="wooriWaitCount" class="text-5xl md:text-6xl font-black text-amber-400 my-2 tracking-tight">0</div>
      <div class="text-[11px] font-bold text-slate-500">대기 번호표 기준</div>
    </div>
    <div class="toss-card rounded-[32px] p-6 text-center shadow-xl">
      <div class="text-xs font-black text-slate-400 mb-1">오늘 우리은행 총 상담 완료</div>
      <div id="wooriDoneCount" class="text-5xl md:text-6xl font-black text-[#3182f6] my-2 tracking-tight">0</div>
      <div class="text-[11px] font-bold text-slate-500">부재/취소 제외 실제 실적</div>
    </div>
  </div>

  <!-- [복원] 창구별 실시간 상황 & 상담 건수 개별 박스 그리드 -->
  <section class="mb-6">
    <div class="flex justify-between items-center mb-3 px-1">
      <h2 class="text-base font-black text-white flex items-center gap-2">
        <span>👨‍💼</span> 우리은행 창구별 개별 진행 현황
      </h2>
      <span class="text-xs font-bold text-blue-400" id="deskActiveSummary">운영 창구 집계 중</span>
    </div>
    <div id="wooriDesksGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- 창구별 카드가 실시간 렌더링됨 -->
    </div>
  </section>

  <!-- 운영시간대 안내 바 -->
  <div class="toss-card rounded-2xl px-5 py-3.5 mb-6 flex justify-between items-center text-xs font-bold border border-amber-500/20">
    <span class="text-slate-400">현장 총괄 운영시간대</span>
    <span id="displayHoursText" class="text-amber-300 font-black">--:00 ~ --:00 (자동 연동)</span>
  </div>

  <!-- 시간대별 완료 실적 차트 -->
  <section class="toss-card rounded-[32px] p-6 shadow-xl">
    <div class="flex justify-between items-center mb-5">
      <h2 class="text-sm font-black text-white">📊 시간대별 우리은행 상담 실적</h2>
      <span class="text-xs font-bold text-slate-500">총괄 관리자 시간대 자동 동기화</span>
    </div>
    <div id="hourlyChart" class="flex items-end gap-3 h-44 pt-6 pb-2 px-1 overflow-x-auto"></div>
  </section>

  <script>
    const socket = io();
    let currentOperatingHours = { startHour: 9, endHour: 21 };
    let wooriStats = {};
    let wooriDesks = [];

    function updateClock() {
      const now = new Date();
      const kstStr = now.toLocaleTimeString('ko-KR', { hour12: false, timeZone: 'Asia/Seoul' });
      document.getElementById('realtimeClock').innerText = `KST ${kstStr}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    socket.on('operating_hours_update', (hours) => {
      if (hours && hours.startHour !== undefined) {
        currentOperatingHours = hours;
        document.getElementById('displayHoursText').innerText = 
          `${String(hours.startHour).padStart(2, '0')}:00 ~ ${String(hours.endHour).padStart(2, '0')}:00 (자동 연동)`;
        renderChart();
      }
    });

    socket.on('full_state_sync', (states) => {
      if (states && states.woori) applyWooriState(states.woori);
    });

    socket.on('queue_update', ({ bankId, state }) => {
      if (bankId === 'woori') applyWooriState(state);
    });

    function applyWooriState(state) {
      document.getElementById('wooriWaitCount').innerText = (state.waiting || []).length;
      document.getElementById('wooriDoneCount').innerText = state.completedCount || 0;
      wooriStats = state.hourlyStats || {};
      wooriDesks = state.desks || [];
      renderDesksGrid();
      renderChart();
    }

    // 창구별 개별 박스 생성
    function renderDesksGrid() {
      const container = document.getElementById('wooriDesksGrid');
      if (!container) return;
      container.innerHTML = '';

      if (wooriDesks.length === 0) {
        container.innerHTML = '<div class="text-sm text-slate-500 p-4 toss-card rounded-2xl col-span-full text-center">개설된 창구가 없습니다. 관리자에게 문의하세요.</div>';
        return;
      }

      document.getElementById('deskActiveSummary').innerText = `총 ${wooriDesks.length}개 창구 가동 중`;

      wooriDesks.forEach(d => {
        const isBusy = !!d.currentTicket;
        const doneCount = d.completedCount || 0;

        const card = document.createElement('div');
        card.className = `toss-card rounded-[28px] p-5 shadow-lg border transition-all ${
          isBusy ? 'border-amber-400/50 bg-[#1c2333]' : 'border-white/5'
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-center pb-3 border-b border-white/5 mb-3">
            <span class="font-black text-lg text-white flex items-center gap-2">
              <span class="w-3 h-3 rounded-full ${isBusy ? 'bg-amber-400 animate-pulse' : 'bg-slate-600'}"></span>
              ${d.name}
            </span>
            <span class="px-3 py-1 rounded-xl text-xs font-black ${
              isBusy ? 'bg-amber-400 text-slate-950 animate-pulse' : 'bg-slate-800 text-slate-400'
            }">
              ${isBusy ? '상담 진행 중' : '호출 대기'}
            </span>
          </div>

          <div class="my-4 text-center">
            <div class="text-xs font-bold text-slate-500 mb-1">현재 상담 고객 번호</div>
            <div class="text-5xl font-black ${isBusy ? 'text-amber-300' : 'text-slate-600'} tracking-tight">
              ${isBusy ? d.currentTicket + '번' : '-'}
            </div>
          </div>

          <div class="bg-[#1f293d] rounded-2xl p-3 flex justify-between items-center text-xs font-bold">
            <span class="text-slate-400">창구 개별 상담 실적</span>
            <span class="text-emerald-400 font-black text-sm">${doneCount}건 완료</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderChart() {
      const container = document.getElementById('hourlyChart');
      if (!container) return;
      container.innerHTML = '';

      const start = currentOperatingHours.startHour;
      const end = currentOperatingHours.endHour;
      const nowHour = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Seoul' })).getHours();

      const hoursToDisplay = [];
      if (start <= end) {
        for (let h = start; h <= end; h++) hoursToDisplay.push(h);
      } else {
        for (let h = start; h < 24; h++) hoursToDisplay.push(h);
        for (let h = 0; h <= end; h++) hoursToDisplay.push(h);
      }

      let maxVal = 1;
      hoursToDisplay.forEach(h => {
        if ((wooriStats[h] || 0) > maxVal) maxVal = wooriStats[h];
      });

      hoursToDisplay.forEach(h => {
        const count = wooriStats[h] || 0;
        const heightPercent = Math.max(14, Math.round((count / maxVal) * 100));
        const isCurrent = (h === nowHour);

        const col = document.createElement('div');
        col.className = 'flex-1 flex flex-col items-center justify-end h-full min-w-[38px]';
        col.innerHTML = `
          <span class="text-xs font-black ${count > 0 ? 'text-[#3182f6]' : 'text-slate-600'} mb-1">${count}</span>
          <div class="w-full rounded-2xl transition-all ${isCurrent ? 'bg-amber-400 ring-2 ring-amber-300' : (count > 0 ? 'bg-[#0067ac]' : 'bg-slate-800')}" style="height: ${heightPercent}%;"></div>
          <span class="text-[11px] font-black ${isCurrent ? 'text-amber-300' : 'text-slate-500'} mt-2">${h}시</span>
        `;
        container.appendChild(col);
      });
    }
  </script>
</body>
</html>
