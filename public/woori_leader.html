<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리은행 팀장 현장 지휘 콘솔</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root { --primary: #0067ac; --bg: #f0f4f8; --card: #ffffff; --border: #d0d7de; --text: #1f2328; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .wrap { max-width: 800px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 6px solid var(--primary); }
    h2 { font-size: 20px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    
    .desk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .desk-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 16px; padding: 16px; text-align: center; }
    .desk-num { font-size: 36px; font-weight: 900; color: var(--primary); margin: 6px 0; }

    .ctrl-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; }
    .btn-ctrl { padding: 12px 20px; border-radius: 12px; font-size: 15px; font-weight: 800; border: none; cursor: pointer; background: var(--primary); color: #fff; }
    
    .queue-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; }
    .btn-assign { background: #1f2328; color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h2>우리은행 창구 실시간 지휘 본부 <span style="font-size: 13px; color: var(--primary);">팀장 전용 모드</span></h2>
      <div class="desk-grid" id="deskGrid"></div>
      <div class="ctrl-row">
        <span style="font-weight: 700;">창구 실시간 조절:</span>
        <button class="btn-ctrl" onclick="modDesk('remove')">- 창구 축소</button>
        <button class="btn-ctrl" onclick="modDesk('add')">+ 창구 즉시 증설</button>
      </div>
    </div>

    <div class="card">
      <h2>실시간 고객 대기 명단 <span id="queueTotal">0명 대기</span></h2>
      <div class="queue-list" id="queueList"></div>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });
    const bank = 'woori';

    socket.on('connect', () => {
      socket.emit('get_state', { bank });
    });

    socket.on('state_update', (data) => {
      if (data.bank !== bank) return;
      renderDesks(data.desks);
      renderQueue(data.queue, data.desks);
    });

    function renderDesks(desks) {
      const box = document.getElementById('deskGrid');
      box.innerHTML = '';
      desks.forEach(d => {
        const isBusy = d.status === 'consulting' && d.currentCustomer;
        box.innerHTML += `
          <div class="desk-box">
            <div style="font-size: 14px; font-weight: 700; color: #64748b;">${d.name}</div>
            <div class="desk-num">${isBusy ? d.currentCustomer.ticketNumber + '번' : '대기'}</div>
            <div style="font-size: 12px; font-weight: 700; color: ${isBusy ? '#ef4444' : '#10b981'};">
              ${isBusy ? '상담 진행 중' : '비어 있음'}
            </div>
          </div>
        `;
      });
    }

    function renderQueue(queue, desks) {
      document.getElementById('queueTotal').innerText = `${queue.length}명 대기`;
      const list = document.getElementById('queueList');
      list.innerHTML = '';

      if (queue.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding: 20px; color:#94a3b8;">현재 대기 중인 고객이 없습니다.</div>';
        return;
      }

      queue.forEach((c, idx) => {
        const item = document.createElement('div');
        item.className = 'queue-item';
        item.innerHTML = `
          <div>
            <span style="font-size: 18px; font-weight: 900; color: var(--primary);">${c.ticketNumber}번</span>
            <span style="font-size: 13px; color: #64748b; margin-left: 8px;">(순번: ${idx + 1}번째)</span>
          </div>
          <div>
            <select id="sel-desk-${c.id}" style="padding: 6px; border-radius: 8px;">
              ${desks.map(d => `<option value="${d.desk}">${d.name}</option>`).join('')}
            </select>
            <button class="btn-assign" onclick="forceAssign('${c.id}')">강제 호출</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function modDesk(action) {
      socket.emit('modify_desk_count', { bank, action });
    }

    function forceAssign(customerId) {
      const sel = document.getElementById(`sel-desk-${customerId}`);
      const deskNumber = sel.value;
      socket.emit('call_customer', { bank, deskNumber, customerId });
    }
  </script>
</body>
</html>
