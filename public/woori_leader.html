<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>우리은행 팀장 관제 센터</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
    body { background-color: #030712; color: #f8fafc; padding: 18px; min-height: 100vh; }
    .wrap { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    .top-header { display: flex; justify-content: space-between; align-items: center; background: #0f172a; border: 2px solid #0067ac; border-radius: 24px; padding: 20px 26px; }
    .brand-title { font-size: 26px; font-weight: 900; color: #00a2ed; }

    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .kpi-box { background: #0f172a; border: 2px solid #1e293b; border-radius: 20px; padding: 20px; text-align: center; }
    .kpi-val { font-size: 42px; font-weight: 900; margin-top: 6px; }

    .card { background: #0f172a; border: 2px solid #1e293b; border-radius: 24px; padding: 24px; }
    .card-title { font-size: 20px; font-weight: 900; color: #fff; margin-bottom: 16px; }

    .desk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    .desk-box { background: #030712; border: 2px solid #334155; border-radius: 20px; padding: 18px; text-align: center; }
    .desk-box.active { border-color: #00a2ed; box-shadow: 0 0 20px rgba(0, 162, 237, 0.3); }
    .desk-num { font-size: 52px; font-weight: 900; color: #facc15; margin: 6px 0; }

    .hourly-grid { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; align-items: flex-end; height: 140px; padding-top: 16px; border-bottom: 2px solid #334155; }
    .bar-col { display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
    .bar-pill { width: 100%; background: #00a2ed; border-radius: 6px 6px 0 0; min-height: 4px; }
    .bar-label { font-size: 11px; color: #94a3b8; font-weight: 800; margin-top: 6px; }
    .bar-count { font-size: 12px; color: #fff; font-weight: 900; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top-header">
      <div class="brand-title">🏦 우리은행 팀장 종합 관제 대시보드</div>
      <div style="font-size: 14px; font-weight: 800; color: #34d399;">● 실시간 연동 중</div>
    </div>

    <!-- 우리은행 핵심 KPI 요약 -->
    <div class="kpi-grid">
      <div class="kpi-box">
        <div style="font-size: 14px; font-weight: 800; color: #94a3b8;">현재 대기 인원</div>
        <div id="wooriWaiting" class="kpi-val" style="color: #f87171;">0명</div>
      </div>
      <div class="kpi-box">
        <div style="font-size: 14px; font-weight: 800; color: #94a3b8;">오늘 상담 완료</div>
        <div id="wooriDone" class="kpi-val" style="color: #34d399;">0건</div>
      </div>
      <div class="kpi-box">
        <div style="font-size: 14px; font-weight: 800; color: #94a3b8;">운영 창구 수</div>
        <div id="wooriDesks" class="kpi-val" style="color: #00a2ed;">0개</div>
      </div>
    </div>

    <!-- 우리은행 시간대별 방문 집중도 (독립 분석) -->
    <div class="card">
      <div class="card-title">📈 우리은행 시간대별 방문 집중도 (08:00 ~ 18:00)</div>
      <div id="wooriHourlyChart" class="hourly-grid"></div>
    </div>

    <!-- 우리은행 창구별 실시간 상황 및 누적 실적 -->
    <div class="card">
      <div class="card-title">👨‍💼 우리은행 창구별 실시간 현황 및 상담 실적</div>
      <div id="wooriDeskGrid" class="desk-grid"></div>
    </div>
  </div>

  <script>
    const TARGET = "우리은행";
    const socket = io();

    socket.on('init_state', (data) => {
      render(data.queues[TARGET], data.report);
    });

    socket.on('queue_update', ({ bank, data }) => {
      if (bank === TARGET) {
        socket.emit('get_all_state');
      }
    });

    socket.on('report_update', (report) => {
      renderReport(report);
    });

    function renderReport(report) {
      if (!report || !report.logs) return;

      // 우리은행 전용 시간대별 통계 계산
      const hours = {};
      for (let i = 8; i <= 18; i++) hours[`${String(i).padStart(2, '0')}:00`] = 0;

      report.logs.filter(l => l.bank === TARGET && l.calledTime).forEach(l => {
        const h = new Date(l.calledTime).getHours();
        const k = `${String(h).padStart(2, '0')}:00`;
        if (hours[k] !== undefined) hours[k]++;
      });

      const maxVal = Math.max(...Object.values(hours), 1);
      const chartEl = document.getElementById('wooriHourlyChart');

      chartEl.innerHTML = Object.keys(hours).map(h => {
        const count = hours[h];
        const heightPct = Math.max((count / maxVal) * 100, 4);
        return `
          <div class="bar-col">
            <span class="bar-count">${count > 0 ? count : ''}</span>
            <div class="bar-pill" style="height: ${heightPct}%;"></div>
            <span class="bar-label">${h}</span>
          </div>
        `;
      }).join('');
    }

    function render(bankData, report) {
      if (!bankData) return;
      renderReport(report);

      const waiting = bankData.waiting || [];
      const activeDesks = (bankData.desks || []).filter(d => d.isActive);
      const totalDone = bankData.desks.reduce((acc, cur) => acc + (cur.completedCount || 0), 0);

      document.getElementById('wooriWaiting').innerText = `${waiting.length}명`;
      document.getElementById('wooriDone').innerText = `${totalDone}건`;
      document.getElementById('wooriDesks').innerText = `${activeDesks.length}개`;

      document.getElementById('wooriDeskGrid').innerHTML = activeDesks.map(d => `
        <div class="desk-box ${d.status === '상담중' ? 'active' : ''}">
          <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:800; color:#94a3b8;">
            <span>${d.name}</span>
            <span style="color:${d.status === '상담중' ? '#34d399' : '#94a3b8'};">${d.status}</span>
          </div>
          <div class="desk-num">${d.current > 0 ? d.current + '번' : '-'}</div>
          <div style="font-size:14px; color:#34d399; font-weight:800; margin-top:4px;">완료 실적: <b>${d.completedCount || 0}건</b></div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
