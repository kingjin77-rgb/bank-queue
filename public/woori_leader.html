<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리은행 원격 현황 관제 콘솔</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #0067ac;
      --bg: #f2f4f6;
      --card: #ffffff;
      --text: #191f28;
      --text-sub: #8b95a1;
      --border: #e5e8eb;
      --success: #04b071;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; }
    .wrap { max-width: 900px; margin: 0 auto; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title { font-size: 26px; font-weight: 900; color: var(--primary); }

    /* 토스형 초대형 지표 카드 */
    .hero-card { background: var(--card); border-radius: 28px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px; border-top: 8px solid var(--primary); }
    .hero-label { font-size: 16px; font-weight: 700; color: var(--text-sub); }
    .hero-val { font-size: 72px; font-weight: 900; color: var(--primary); letter-spacing: -2px; margin: 10px 0; }

    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
    .sub-stat { background: #f9fafb; padding: 18px; border-radius: 18px; border: 1px solid var(--border); }
    .sub-stat .num { font-size: 32px; font-weight: 900; color: var(--text); margin-top: 6px; }

    .card { background: var(--card); border-radius: 28px; padding: 26px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); margin-bottom: 20px; }
    h2 { font-size: 20px; font-weight: 800; margin-bottom: 16px; }

    /* 창구별 현황 */
    .desk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
    .desk-card { background: #f9fafb; border: 2px solid var(--border); border-radius: 20px; padding: 20px; text-align: center; }
    .desk-title { font-size: 16px; font-weight: 800; color: var(--text-sub); }
    .desk-stat { font-size: 40px; font-weight: 900; color: var(--primary); margin: 8px 0; }

    /* 시간대별 완료 추이 */
    .timeline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 10px; }
    .time-slot { background: #f9fafb; border: 1px solid var(--border); border-radius: 14px; padding: 12px; text-align: center; }
    .time-hour { font-size: 13px; font-weight: 700; color: var(--text-sub); }
    .time-count { font-size: 22px; font-weight: 900; color: var(--primary); margin-top: 4px; }

    /* 실시간 대기 명단 */
    .queue-chip-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .queue-pill { background: #e6f3fa; color: var(--primary); font-size: 16px; font-weight: 800; padding: 10px 18px; border-radius: 14px; border: 1px solid #cce3ff; }

    .leader-summary { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.06); font-size: 15px; font-weight: 700; color: var(--text-sub); }
    .leader-summary b { font-weight: 900; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="header">
      <div>
        <div style="font-size: 13px; font-weight: 800; color: var(--primary);">원격 현황 모니터링</div>
        <div class="title">우리은행 상담 관제 본부</div>
      </div>
      <div style="font-size: 14px; font-weight: 800; color: var(--success);">● 원격 실시간 집계 중</div>
    </div>

    <!-- 1. 토스 스타일 총 상담 실적 -->
    <div class="hero-card">
      <div class="hero-label">오늘 우리은행 총 누적 상담 완료</div>
      <div class="hero-val" id="totalCompleted">0<span style="font-size: 32px; font-weight: 700;">건</span></div>
      <div class="stats-row">
        <div class="sub-stat">
          <div style="font-size: 14px; font-weight: 700; color: var(--text-sub);">현재 실시간 대기인원</div>
          <div class="num" id="currentWait" style="color: #ef4444;">0명</div>
        </div>
        <div class="sub-stat">
          <div style="font-size: 14px; font-weight: 700; color: var(--text-sub);">운영 중인 창구 수</div>
          <div class="num" id="activeDesks">0개</div>
        </div>
      </div>
      <div id="leaderSummary" class="leader-summary">집계 중...</div>
    </div>

    <!-- 2. 각 창구별 완료 건수 및 현재 상태 -->
    <div class="card">
      <h2>창구별 상담 실적 및 현재 상황</h2>
      <div class="desk-grid" id="deskGrid"></div>
    </div>

    <!-- 3. 시간대별 상담 완료 추이 -->
    <div class="card">
      <h2>시간대별 상담 완료 건수 (1시간 단위)</h2>
      <div class="timeline-grid" id="timelineGrid"></div>
    </div>

    <!-- 4. 실시간 대기열 -->
    <div class="card">
      <h2>실시간 대기 고객 순번 명단</h2>
      <div class="queue-chip-list" id="queueList"></div>
    </div>
  </div>

  <script>
    const socket = io({ transports: ['websocket', 'polling'] });
    const bank = 'woori';

    let standardMinutes = 15;
    let serverOffsetMs = 0;
    function elapsedSec(iso) {
      if (!iso) return 0;
      return Math.max(0, Math.round((Date.now() + serverOffsetMs - new Date(iso).getTime()) / 1000));
    }
    function fmtMs(sec) {
      const m = Math.floor(sec / 60);
      return `${m}:${String(sec % 60).padStart(2, '0')}`;
    }

    function fmtMin(sec) {
      if (!sec) return '-';
      const m = Math.floor(sec / 60);
      return m > 0 ? `${m}분 ${sec % 60}초` : `${sec}초`;
    }
    function avg(arr) {
      if (!arr.length) return 0;
      return Math.round(arr.reduce((x, y) => x + y, 0) / arr.length);
    }

    socket.on('connect', () => {
      socket.emit('get_all_state');
    });

    socket.on('all_state_update', (data) => {
      if (data.serverTime) serverOffsetMs = new Date(data.serverTime).getTime() - Date.now();
      if (data.settings) standardMinutes = data.settings.standardMinutes;

      const q = (data.queues[bank] || []).filter(c => c.status === 'waiting');
      const desks = data.desks[bank] || [];
      const logs = (data.logs || []).filter(l => l.bank === bank);
      const passes = (data.passes || []).filter(l => l.bank === bank);

      // 평균 상담시간 / 평균 대기시간 요약 줄
      const summary = document.getElementById('leaderSummary');
      if (summary) {
        const avgDur = avg(logs.map(l => l.durationSec || 0));
        const avgWait = avg(logs.map(l => l.waitSec || 0));
        summary.innerHTML = `
          <span>평균 상담 <b style="color:#04b071;">${fmtMin(avgDur)}</b></span>
          <span>평균 대기 <b style="color:#0067ac;">${fmtMin(avgWait)}</b></span>
          <span>부재 패스 <b style="color:#ef4444;">${passes.length}건</b></span>
          <span>예상 대기 <b>${desks.length ? Math.ceil(q.length / desks.length) * standardMinutes : 0}분</b></span>
        `;
      }

      // 1. 총괄 지표
      document.getElementById('totalCompleted').innerHTML = `${logs.length}<span style="font-size: 32px; font-weight: 700;">건</span>`;
      document.getElementById('currentWait').innerText = `${q.length}명`;
      document.getElementById('activeDesks').innerText = `${desks.length}개`;

      // 2. 창구별 완료 건수
      const deskCounts = {};
      desks.forEach(d => deskCounts[d.desk] = 0);
      logs.forEach(l => {
        if (deskCounts[l.desk] !== undefined) deskCounts[l.desk]++;
      });

      const deskGrid = document.getElementById('deskGrid');
      deskGrid.innerHTML = '';
      desks.forEach(d => {
        const isBusy = d.status === 'consulting' && d.currentCustomer;
        const box = document.createElement('div');
        box.className = 'desk-card';
        const deskLogs = logs.filter(l => l.desk === d.desk);
        const deskAvg = avg(deskLogs.map(l => l.durationSec || 0));
        const sec = isBusy ? elapsedSec(d.currentCustomer.calledAt) : 0;
        const over = isBusy && sec > standardMinutes * 60;

        box.innerHTML = `
          <div class="desk-title">${d.name}</div>
          <div class="desk-stat">${deskCounts[d.desk]}<span style="font-size: 18px;">건 완료</span></div>
          <div style="font-size: 13px; font-weight: 800; color: ${isBusy ? (over ? '#ef4444' : '#0067ac') : '#04b071'};">
            ${isBusy ? `${d.currentCustomer.ticketNumber}번 상담 중` : '대기 중'}
          </div>
          <div class="desk-elapsed" data-called="${isBusy ? d.currentCustomer.calledAt : ''}"
               style="font-size: 13px; font-weight: 800; font-family: monospace; margin-top: 4px; color: ${over ? '#ef4444' : '#8b95a1'};">
            ${isBusy ? '상담 ' + fmtMs(sec) + (over ? ' 지연' : '') : '평균 ' + fmtMin(deskAvg)}
          </div>
        `;
        deskGrid.appendChild(box);
      });

      // 3. 시간대별 분석 (09시~18시)
      const hours = ['09', '10', '11', '12', '13', '14', '15', '16', '17', '18'];
      const hourCounts = {};
      hours.forEach(h => hourCounts[h] = 0);

      logs.forEach(l => {
        if (l.completedAt) {
          const h = new Date(l.completedAt).getHours().toString().padStart(2, '0');
          if (hourCounts[h] !== undefined) hourCounts[h]++;
        }
      });

      const timeGrid = document.getElementById('timelineGrid');
      timeGrid.innerHTML = '';
      hours.forEach(h => {
        const slot = document.createElement('div');
        slot.className = 'time-slot';
        slot.innerHTML = `
          <div class="time-hour">${h}시</div>
          <div class="time-count">${hourCounts[h]}건</div>
        `;
        timeGrid.appendChild(slot);
      });

      // 4. 대기 명단
      const qBox = document.getElementById('queueList');
      qBox.innerHTML = '';
      if (q.length === 0) {
        qBox.innerHTML = '<div style="color: var(--text-sub); font-size: 14px;">현재 대기 중인 고객이 없습니다.</div>';
      } else {
        q.forEach((c, idx) => {
          const pill = document.createElement('div');
          pill.className = 'queue-pill';
          pill.innerText = `${idx + 1}등: ${c.ticketNumber}번`;
          qBox.appendChild(pill);
        });
      }
    });
  </script>
  <script src="/pwa.js" data-role="leader"></script>
</body>
</html>
